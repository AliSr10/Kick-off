enter; border-bottom: 1px solid var(--surface-border); }\r\n.ticket-status { background: rgba(255, 176, 32, 0.15); color: #FFB020; padding: 6px 12px; border-radius: 4px; font-family: var(--font-display); font-size: 0.85rem; font-weight: 700; letter-spacing: 1px; }\r\n.ticket-id { color: var(--text-dim); font-family: var(--font-mono); font-size: 0.85rem; font-weight: 700; }\r\n.ticket-body { padding: 32px 24px; border-bottom: 2px dashed var(--surface-border); }\r\n.ticket-row { display: flex; justify-content: space-between; }\r\n.ticket-col { display: flex; flex-direction: column; gap: 4px; }\r\n.text-right { text-align: right; }\r\n.t-label { font-size: 0.75rem; color: var(--text-dim); font-weight: 600; text-transform: uppercase; }\r\n.t-value { font-family: var(--font-mono); font-size: 1.2rem; font-weight: 700; color: var(--text-main); }\r\n.ticket-footer { padding: 32px 24px; display: flex; justify-content: center; background: rgba(0,0,0,0.4); }\r\n.qr-placeholder { background: #FFFFFF; padding: 12px; border-radius: 12px; display: inline-block; }\r\n.qr-img { width: 140px; height: 140px; display: block; }\r\n\r\n.modern-footer { padding: 60px 24px 30px; display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: auto; border-top: 1px solid var(--surface-border); }\r\n.footer-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; }\r\n.footer-links a { color: var(--text-dim); text-decoration: none; font-size: 0.85rem; }\r\n.footer-links a:hover { color: var(--accent); }\r\n.footer-admin-link { color: var(--accent) !important; font-weight: 600; }\r\n.footer-copyright { font-size: 0.75rem; opacity: 0.5; font-family: var(--font-mono); }\r\n\r\n.confirm-modal-overlay { position: fixed; inset: 0; background: rgba(5, 7, 8, 0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.3s; }\r\n.confirm-modal-overlay.active { opacity: 1; pointer-events: auto; }\r\n.confirm-modal { background: var(--bg-color); border: 1px solid var(--surface-border); border-left: 4px solid var(--accent); border-radius: 12px; padding: 32px; width: 90%; max-width: 420px; text-align: center; transform: translateY(30px) scale(0.95); transition: 0.4s cubic-bezier(0.25, 1, 0.3, 1); box-shadow: 0 25px 50px rgba(0,0,0,0.5); }\r\n.confirm-modal-overlay.active .confirm-modal { transform: translateY(0) scale(1); }\r\n\r\n.reveal-3d { opacity: 0; transform: translateY(60px) rotateX(-15deg) scale(0.95); transition: opacity 0.8s cubic-bezier(0.25, 1, 0.3, 1), transform 0.8s cubic-bezier(0.25, 1, 0.3, 1); transform-style: preserve-3d; will-change: transform, opacity; }\r\n.reveal-3d.visible { opacity: 1; transform: translateY(0) rotateX(0) scale(1); }\r\n.stagger-1 { transition-delay: 0.1s; } .stagger-2 { transition-delay: 0.2s; } .stagger-3 { transition-delay: 0.3s; } .stagger-4 { transition-delay: 0.4s; }\r\n\r\n@media (min-width: 900px) {\r\n  .desktop-nav { display: flex; }\r\n  .topbar-brand .icon-btn { display: none; }\r\n  .hero-grid { grid-template-columns: 1.2fr 1fr; align-items: center; min-height: 70vh; }\r\n  .location-grid { grid-template-columns: 1.2fr 1fr; }\r\n  .interactive-map { height: 100%; min-height: 350px; }\r\n}"}, {"path": "client/public/ticket.html", "code": "\u003c!DOCTYPE html\u003e\r\n\u003chtml lang=\"en\"\u003e\r\n\u003chead\u003e\r\n  \u003cmeta charset=\"UTF-8\"\u003e\r\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content\"\u003e\r\n  \u003ctitle\u003eKickoff | Digital Match Pass\u003c/title\u003e\r\n  \u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800\u0026family=Rajdhani:wght@600;700;800\u0026family=Space+Mono:wght@700\u0026display=swap\" rel=\"stylesheet\"\u003e\r\n  \u003cstyle\u003e\r\n    /* ==========================================================================\r\n       1. CORE ENVIRONMENT \u0026 VARIABLES\r\n       ========================================================================== */\r\n    :root {\r\n      --bg-core: #060809;\r\n      --accent: #00FF66;\r\n      --accent-glow: rgba(0, 255, 102, 0.25);\r\n      --text-dim: #8E9BA0;\r\n    }\r\n\r\n    * { box-sizing: border-box; margin: 0; padding: 0; }\r\n\r\n    body {\r\n      background-color: var(--bg-core);\r\n      color: #FFFFFF;\r\n      font-family: 'Inter', sans-serif;\r\n      overflow: hidden; /* Lock scroll to maintain 3D viewport */\r\n      height: 100vh;\r\n      width: 100vw;\r\n      perspective: 1200px; /* Establishes the 3D camera */\r\n      background: radial-gradient(circle at 50% -20%, rgba(0, 255, 102, 0.12), var(--bg-core) 70%);\r\n    }\r\n\r\n    /* ==========================================================================\r\n       2. 3D STADIUM BACKGROUND (PITCH, LIGHTS, FOG)\r\n       ========================================================================== */\r\n    .stadium-env {\r\n      position: absolute;\r\n      inset: -20%; /* Bleed edges for parallax panning */\r\n      pointer-events: none;\r\n      transform-style: preserve-3d;\r\n      transition: transform 0.1s ease-out;\r\n      z-index: 1;\r\n    }\r\n\r\n    /* The Perspective Football Pitch */\r\n    .pitch-grid {\r\n      position: absolute;\r\n      bottom: -10vh;\r\n      left: 0;\r\n      right: 0;\r\n      height: 70vh;\r\n      background-image: \r\n        linear-gradient(rgba(0, 255, 102, 0.15) 1px, transparent 1px),\r\n        linear-gradient(90deg, rgba(0, 255, 102, 0.15) 1px, transparent 1px);\r\n      background-size: 60px 60px;\r\n      background-position: center bottom;\r\n      transform-origin: center bottom;\r\n      transform: rotateX(75deg) translateZ(-200px);\r\n      mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, transparent 90%);\r\n      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, transparent 90%);\r\n      opacity: 0;\r\n      animation: envFadeIn 2s ease-out 0.5s forwards;\r\n    }\r\n\r\n    /* Stadium Light Beams */\r\n    .light-beam {\r\n      position: absolute;\r\n      top: -10vh;\r\n      width: 30vw;\r\n      height: 120vh;\r\n      background: linear-gradient(180deg, rgba(0,255,102,0.08) 0%, transparent 80%);\r\n      filter: blur(20px);\r\n      opacity: 0;\r\n      animation: envFadeIn 2s ease-out 0.2s forwards;\r\n    }\r\n    .light-beam.left { left: 10%; transform: rotate(-25deg); transform-origin: top center; }\r\n    .light-beam.right { right: 10%; transform: rotate(25deg); transform-origin: top center; }\r\n\r\n    /* Ambient Dust Canvas */\r\n    #ambientCanvas {\r\n      position: absolute; inset: 0; z-index: 2; opacity: 0;\r\n      animation: envFadeIn 2s ease-out 0.8s forwards;\r\n    }\r\n\r\n    /* Subtle Floating Football */\r\n    .ambient-football {\r\n      position: absolute;\r\n      top: 20%; right: 15%;\r\n      font-size: 3rem;\r\n      opacity: 0.1;\r\n      filter: blur(2px);\r\n      transform: translateZ(-100px);\r\n      animation: floatBall 20s infinite linear;\r\n    }\r\n\r\n    \r\n\r\n    /* ==========================================================================\r\n       3. SPATIAL MATCH PASS (BORDERLESS)\r\n       ========================================================================== */\r\n    .spatial-pass-wrapper {\r\n      position: relative;\r\n      height: 100vh;\r\n      width: 100vw;\r\n      display: flex;\r\n      flex-direction: column;\r\n      align-items: center;\r\n      justify-content: center;\r\n      z-index: 10;\r\n      transform-style: preserve-3d;\r\n      /* Default breathing animation, overridden by JS if device motion is supported */\r\n      animation: floatPassBreathing 8s ease-in-out infinite alternate;\r\n    }\r\n\r\n    .pass-content {\r\n      display: flex;\r\n      flex-direction: column;\r\n      align-items: center;\r\n      gap: 32px;\r\n      text-align: center;\r\n      transform-style: preserve-3d;\r\n      width: 100%;\r\n      max-width: 500px;\r\n      padding: 0 24px;\r\n    }\r\n\r\n    /* Common Typography \u0026 Layout */\r\n    .label {\r\n      font-size: 0.75rem;\r\n      color: var(--text-dim);\r\n      text-transform: uppercase;\r\n      letter-spacing: 3px;\r\n      font-weight: 800;\r\n      margin-bottom: 6px;\r\n      display: block;\r\n    }\r\n    \r\n    .value {\r\n      font-family: 'Rajdhani', sans-serif;\r\n      font-weight: 700;\r\n      text-transform: uppercase;\r\n      letter-spacing: 1px;\r\n    }\r\n\r\n    /* Specific Elements \u0026 Z-Depth Staggering */\r\n    .brand-header {\r\n      transform: translateZ(20px);\r\n      opacity: 0; animation: passElementEntrance 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 1.0s forwards;\r\n    }\r\n    .brand-header h1 {\r\n      font-family: 'Rajdhani', sans-serif; font-size: 1.5rem; font-weight: 800; letter-spacing: 4px;\r\n    }\r\n\r\n    .pass-id {\r\n      font-family: 'Space Mono', monospace; font-size: 1.2rem; color: var(--accent);\r\n      text-shadow: 0 0 15px var(--accent-glow);\r\n      transform: translateZ(40px);\r\n      opacity: 0; animation: passElementEntrance 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 1.2s forwards;\r\n    }\r\n\r\n    .player-name {\r\n      font-size: 2rem;\r\n      transform: translateZ(30px);\r\n      opacity: 0; animation: passElementEntrance 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 1.4s forwards;\r\n    }\r\n\r\n    .match-core {\r\n      display: flex;\r\n      flex-direction: column;\r\n      align-items: center;\r\n      gap: 8px;\r\n      transform: translateZ(50px); /* Brings the time closest to the user */\r\n      opacity: 0; animation: passElementEntrance 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 1.6s forwards;\r\n    }\r\n    .match-date { font-size: 1.25rem; color: #FFF; }\r\n    .match-time {\r\n      font-size: clamp(2rem, 8vw, 3.5rem); /* Auto-scales massive time range */\r\n      color: var(--accent);\r\n      text-shadow: 0 0 30px var(--accent-glow);\r\n      line-height: 1;\r\n    }\r\n\r\n    .venue-info {\r\n      transform: translateZ(20px);\r\n      opacity: 0; animation: passElementEntrance 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 1.8s forwards;\r\n    }\r\n    .venue-info .value { font-size: 1rem; color: var(--text-dim); }\r\n\r\n    /* ==========================================================================\r\n       4. CINEMATIC VERIFICATION \u0026 EFFECTS\r\n       ========================================================================== */\r\n    \r\n    /* The scanning laser that sweeps down once */\r\n    .scanner-laser {\r\n      position: absolute;\r\n      top: -10%; left: -20%; right: -20%;\r\n      height: 2px;\r\n      background: var(--accent);\r\n      box-shadow: 0 0 20px 4px var(--accent-glow), 0 0 50px 10px rgba(0, 255, 102, 0.2);\r\n      opacity: 0;\r\n      z-index: 100;\r\n      animation: scanSweep 1.5s cubic-bezier(0.4, 0, 0.2, 1) 2.2s forwards;\r\n    }\r\n\r\n    /* The Verified Indicator */\r\n    .verified-status {\r\n      margin-top: 24px;\r\n      transform: translateZ(60px); /* Pops out furthest */\r\n      opacity: 0;\r\n      display: flex;\r\n      align-items: center;\r\n      gap: 12px;\r\n      font-family: 'Space Mono', monospace;\r\n      font-weight: 700;\r\n      font-size: 1rem;\r\n      color: #000;\r\n      background: var(--accent);\r\n      padding: 10px 24px;\r\n      border-radius: 50px;\r\n      box-shadow: 0 0 30px var(--accent-glow);\r\n      animation: verifiedPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 3.2s forwards;\r\n    }\r\n    .verified-status .dot {\r\n      width: 8px; height: 8px; background: #000; border-radius: 50%;\r\n      animation: pulseDot 2s infinite;\r\n    }\r\n\r\n    /* Holographic Shimmer Overlay */\r\n    .pass-content::after {\r\n      content: '';\r\n      position: absolute; inset: -50%;\r\n      background: linear-gradient(125deg, transparent 30%, rgba(255,255,255,0.05) 45%, rgba(0,255,102,0.1) 50%, transparent 55%);\r\n      transform: translateZ(70px);\r\n      pointer-events: none;\r\n      background-size: 200% 200%;\r\n      animation: holoShimmer 6s infinite linear;\r\n      mask-image: radial-gradient(circle at center, black 40%, transparent 60%);\r\n      -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 60%);\r\n    }\r\n\r\n    /* ==========================================================================\r\n       5. KEYFRAME ANIMATIONS\r\n       ========================================================================== */\r\n    @keyframes envFadeIn { to { opacity: 1; } }\r\n    @keyframes floatBall { 0% { transform: translateZ(-100px) rotate(0deg) translateY(0); } 50% { transform: translateZ(-100px) rotate(180deg) translateY(-30px); } 100% { transform: translateZ(-100px) rotate(360deg) translateY(0); } }\r\n    @keyframes passElementEntrance { \r\n      0% { opacity: 0; transform: translateY(40px) translateZ(calc(var(--z, 0) - 100px)) rotateX(-20deg); } \r\n      100% { opacity: 1; transform: translateY(0) translateZ(var(--z, 0)) rotateX(0deg); } \r\n    }\r\n    @keyframes scanSweep { \r\n      0% { top: -10%; opacity: 0; } \r\n      10% { opacity: 1; } \r\n      80% { opacity: 1; } \r\n      100% { top: 110%; opacity: 0; } \r\n    }\r\n    @keyframes verifiedPop { 0% { opacity: 0; transform: translateZ(60px) scale(0.8); } 100% { opacity: 1; transform: translateZ(60px) scale(1); } }\r\n    @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }\r\n    @keyframes holoShimmer { 0% { background-position: 200% center; } 100% { background-position: -200% center; } }\r\n    @keyframes floatPassBreathing { 0% { transform: rotateX(2deg) rotateY(-2deg) translateY(-5px); } 100% { transform: rotateX(-2deg) rotateY(2deg) translateY(5px); } }\r\n\r\n    /* Accessibility / Performance Fallback */\r\n    @media (prefers-reduced-motion: reduce) {\r\n      .spatial-pass-wrapper { animation: none; transform: none !important; }\r\n      .stadium-env { transform: none !important; }\r\n      .scanner-laser, .ambient-football, #ambientCanvas, .pass-content::after { display: none; }\r\n    }\r\n\r\n    /* ==========================================================================\r\n   6. MATCH PASS ACTIONS\r\n   ========================================================================== */\r\n\r\n.pass-actions {\r\n  position: fixed;\r\n\r\n  left: 50%;\r\n  bottom: 22px;\r\n\r\n  transform: translateX(-50%);\r\n\r\n  z-index: 500;\r\n\r\n  width: min(92%, 430px);\r\n\r\n  display: flex;\r\n  flex-direction: column;\r\n\r\n  gap: 8px;\r\n\r\n  padding: 8px;\r\n\r\n  border-radius: 16px;\r\n\r\n  background: rgba(5, 8, 7, 0.72);\r\n\r\n  -webkit-backdrop-filter: blur(18px);\r\n  backdrop-filter: blur(18px);\r\n\r\n  box-shadow:\r\n    0 20px 60px rgba(0, 0, 0, 0.45),\r\n    0 0 35px rgba(0, 255, 102, 0.035);\r\n}\r\n\r\n\r\n.pass-action {\r\n  border: 0;\r\n\r\n  font-family: 'Rajdhani', sans-serif;\r\n\r\n  cursor: pointer;\r\n\r\n  transition:\r\n    transform 0.22s ease,\r\n    box-shadow 0.22s ease,\r\n    background 0.22s ease,\r\n    opacity 0.22s ease;\r\n}\r\n\r\n\r\n.pass-action:active {\r\n  transform: translateY(1px) scale(0.99);\r\n}\r\n\r\n\r\n.pass-action:disabled {\r\n  opacity: 0.55;\r\n  pointer-events: none;\r\n}\r\n\r\n\r\n/* MAIN SAVE BUTTON */\r\n\r\n.save-action {\r\n  width: 100%;\r\n\r\n  display: flex;\r\n  align-items: center;\r\n\r\n  gap: 14px;\r\n\r\n  padding: 13px 18px;\r\n\r\n  border-radius: 11px;\r\n\r\n  text-align: left;\r\n\r\n  color: #020604;\r\n\r\n  background: var(--accent);\r\n\r\n  box-shadow:\r\n    0 7px 25px rgba(0, 255, 102, 0.18);\r\n}\r\n\r\n\r\n.save-action:hover {\r\n  transform: translateY(-2px);\r\n\r\n  box-shadow:\r\n    0 10px 35px rgba(0, 255, 102, 0.3);\r\n}\r\n\r\n\r\n.action-icon {\r\n  font-size: 1.5rem;\r\n  font-weight: 800;\r\n}\r\n\r\n\r\n.action-copy {\r\n  display: flex;\r\n  flex-direction: column;\r\n}\r\n\r\n\r\n.action-copy strong {\r\n  font-size: 0.95rem;\r\n\r\n  letter-spacing: 1px;\r\n}\r\n\r\n\r\n.action-copy small {\r\n  margin-top: 1px;\r\n\r\n  font-family: 'Inter', sans-serif;\r\n\r\n  font-size: 0.63rem;\r\n  font-weight: 600;\r\n\r\n  opacity: 0.6;\r\n}\r\n\r\n\r\n/* SECONDARY ROW */\r\n\r\n.secondary-actions {\r\n  display: grid;\r\n\r\n  grid-template-columns: 1fr 1fr;\r\n\r\n  gap: 8px;\r\n}\r\n\r\n\r\n.secondary-action {\r\n  min-height: 42px;\r\n\r\n  display: flex;\r\n\r\n  align-items: center;\r\n  justify-content: center;\r\n\r\n  gap: 7px;\r\n\r\n  border-radius: 10px;\r\n\r\n  background: rgba(255,255,255,0.055);\r\n\r\n  color: rgba(255,255,255,0.82);\r\n\r\n  font-size: 0.72rem;\r\n\r\n  font-weight: 700;\r\n\r\n  letter-spacing: 0.6px;\r\n}\r\n\r\n\r\n.secondary-action:hover {\r\n  transform: translateY(-2px);\r\n\r\n  color: #FFFFFF;\r\n\r\n  background: rgba(0,255,102,0.075);\r\n\r\n  box-shadow:\r\n    0 8px 25px rgba(0,0,0,0.25);\r\n}\r\n\r\n\r\n/* ==========================================================================\r\n   7. PORTRAIT EXPORT TICKET — 1080 × 1920\r\n   ========================================================================== */\r\n\r\n#ticketExport {\r\n  position: fixed;\r\n  left: -12000px;\r\n  top: 0;\r\n  width: 1080px;\r\n  height: 1920px;\r\n  overflow: hidden;\r\n  background:\r\n    radial-gradient(\r\n      circle at 50% 15%,\r\n      rgba(0,255,102,0.20),\r\n      transparent 42%\r\n    ),\r\n    radial-gradient(\r\n      circle at 50% 50%,\r\n      #17231d 0%,\r\n      #08100c 48%,\r\n      #040706 100%\r\n    );\r\n\r\n  color: #FFFFFF;\r\n\r\n  font-family: 'Inter', sans-serif;\r\n}\r\n\r\n\r\n.export-bg-grid {\r\n  position: absolute;\r\n  left: -10%;\r\n  right: -10%;\r\n  bottom: -300px;\r\n  height: 950px;\r\n  opacity: 0.15;\r\n  background-image:\r\n    linear-gradient(\r\n      rgba(0,255,102,0.18) 2px,\r\n      transparent 2px\r\n    ),\r\n    linear-gradient(\r\n      90deg,\r\n      rgba(0,255,102,0.18) 2px,\r\n      transparent 2px\r\n    );\r\n\r\n  background-size: 90px 90px;\r\n  transform:\r\n    perspective(700px)\r\n    rotateX(60deg);\r\n}\r\n\r\n\r\n.export-light {\r\n  position: absolute;\r\n  width: 600px;\r\n  height: 1500px;\r\n  top: -300px;\r\n  filter: blur(90px);\r\n  opacity: 0.14;\r\n  background:\r\n    linear-gradient(\r\n      180deg,\r\n      rgba(0,255,102,0.8),\r\n      transparent\r\n    );\r\n}\r\n\r\n\r\n.export-light-one {\r\n  left: -260px;\r\n  transform: rotate(-20deg);\r\n}\r\n\r\n\r\n.export-light-two {\r\n  right: -260px;\r\n  transform: rotate(20deg);\r\n}\r\n\r\n\r\n.export-content {\r\n  position: relative;\r\n  z-index: 5;\r\n  width: 100%;\r\n  height: 100%;\r\n  display: flex;\r\n  flex-direction: column;\r\n  align-items: center;\r\n  padding:\r\n    170px\r\n    90px\r\n    110px;\r\n\r\n  text-align: center;\r\n}\r\n\r\n\r\n.export-brand span {\r\n  display: block;\r\n  margin-bottom: 17px;\r\n  color: #8E9BA0;\r\n  font-size: 21px;\r\n  font-weight: 800;\r\n  letter-spacing: 9px;\r\n}\r\n\r\n\r\n.export-brand h1 {\r\n  font-family: 'Rajdhani', sans-serif;\r\n  font-size: 72px;\r\n  letter-spacing: 12px;\r\n  line-height: 1;\r\n  font-weight: 800;\r\n}\r\n\r\n\r\n.export-ticket-id {\r\n  margin-top: 95px;\r\n  font-family: 'Space Mono', monospace;\r\n  color: var(--accent);\r\n  font-size: 34px;\r\n  text-shadow:\r\n    0 0 30px rgba(0,255,102,0.35);\r\n}\r\n\r\n\r\n.export-section {\r\n  margin-top: 120px;\r\n}\r\n\r\n\r\n.export-label {\r\n  display: block;\r\n  margin-bottom: 25px;\r\n  color: #829088;\r\n  font-size: 22px;\r\n  font-weight: 800;\r\n  letter-spacing: 8px;\r\n}\r\n\r\n\r\n.export-player {\r\n  font-family: 'Rajdhani', sans-serif;\r\n\r\n  font-size: 78px;\r\n  line-height: 1;\r\n  font-weight: 800;\r\n  text-transform: uppercase;\r\n  letter-spacing: 4px;\r\n}\r\n\r\n\r\n.export-divider {\r\n  width: 170px;\r\n  height: 2px;\r\n  margin-top: 110px;\r\n  background:\r\n    linear-gradient(\r\n      90deg,\r\n      transparent,\r\n      rgba(0,255,102,0.7),\r\n      transparent\r\n    );\r\n\r\n  box-shadow:\r\n    0 0 30px rgba(0,255,102,0.3);\r\n}\r\n\r\n\r\n.export-date {\r\n  font-family: 'Rajdhani', sans-serif;\r\n  color: #FFFFFF;\r\n  font-size: 48px;\r\n  font-weight: 700;\r\n  text-transform: uppercase;\r\n}\r\n\r\n\r\n.export-time {\r\n  margin-top: 24px;\r\n  color: var(--accent);\r\n  font-family: 'Rajdhani', sans-serif;\r\n  font-size: 88px;\r\n  font-weight: 800;\r\n  line-height: 1;\r\n  white-space: nowrap;\r\n  text-shadow:\r\n    0 0 45px rgba(0,255,102,0.3);\r\n}\r\n\r\n\r\n.export-venue {\r\n  margin-top: 120px;\r\n  color: #9BA69F;\r\n  font-family: 'Rajdhani', sans-serif;\r\n  font-size: 34px;\r\n  line-height: 1.3;\r\n  font-weight: 700;\r\n  letter-spacing: 2px;\r\n}\r\n\r\n\r\n.export-valid {\r\n  margin-top: 120px;\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 20px;\r\n  padding:\r\n    22px\r\n    43px;\r\n  border-radius: 100px;\r\n  background: var(--accent);\r\n  color: #020503;\r\n  font-family: 'Space Mono', monospace;\r\n  font-size: 24px;\r\n  font-weight: 700;\r\n  box-shadow:\r\n    0 0 50px rgba(0,255,102,0.27);\r\n}\r\n\r\n\r\n.export-valid-dot {\r\n  width: 13px;\r\n  height: 13px;\r\n  border-radius: 50%;\r\n  background: #020503;\r\n}\r\n\r\n\r\n.export-footer {\r\n  margin-top: auto;\r\n  width: 100%;\r\n  display: flex;\r\n  justify-content: space-between;\r\n  color: rgba(255,255,255,0.25);\r\n  font-family: 'Space Mono', monospace;\r\n  font-size: 14px;\r\n  letter-spacing: 2px;\r\n}\r\n\r\n\r\n/* Phone adjustments for control panel */\r\n\r\n@media (max-width: 600px) {\r\n\r\n  .pass-actions {\r\n    width: calc(100% - 26px);\r\n    bottom: 12px;\r\n  }\r\n\r\n  .save-action {\r\n    padding: 11px 15px;\r\n  }\r\n\r\n  .secondary-action {\r\n    font-size: 0.67rem;\r\n  }\r\n\r\n}\r\n\r\n  \u003c/style\u003e\r\n  \u003clink rel=\"stylesheet\" href=\"/mobile.css?v=2.3.0\"\u003e\r\n\u003c/head\u003e\r\n\u003cbody class=\"ticket-page\"\u003e\r\n  \u003ca class=\"site-back ticket-back\" href=\"/\"\u003e← Back to Kickoff\u003c/a\u003e\r\n\r\n  \u003c!-- LAYER 1-5: The 3D Stadium Environment --\u003e\r\n  \u003cdiv class=\"stadium-viewport\" aria-hidden=\"true\"\u003e\r\n  \u003cdiv class=\"stadium-env\" id=\"stadiumEnv\"\u003e\r\n    \u003cdiv class=\"light-beam left\"\u003e\u003c/div\u003e\r\n    \u003cdiv class=\"light-beam right\"\u003e\u003c/div\u003e\r\n    \u003cdiv class=\"pitch-grid\"\u003e\u003c/div\u003e\r\n    \u003cdiv class=\"ambient-football\"\u003e⚽\u003c/div\u003e\r\n  \u003c/div\u003e\r\n  \u003c/div\u003e\r\n  \u003ccanvas id=\"ambientCanvas\"\u003e\u003c/canvas\u003e\r\n\r\n\r\n  \u003c!-- =========================================\r\n     MATCH PASS ACTIONS\r\n     ========================================= --\u003e\r\n\u003cdiv class=\"pass-actions\" data-html2canvas-ignore=\"true\"\u003e\r\n\r\n  \u003cbutton disabled class=\"pass-action save-action\" id=\"saveTicketBtn\"\u003e\r\n    \u003cspan class=\"action-icon\"\u003e↓\u003c/span\u003e\r\n\r\n    \u003cspan class=\"action-copy\"\u003e\r\n      \u003cstrong\u003eSAVE TICKET\u003c/strong\u003e\r\n      \u003csmall\u003eKeep your permanent match pass\u003c/small\u003e\r\n    \u003c/span\u003e\r\n  \u003c/button\u003e\r\n\r\n  \u003cdiv class=\"secondary-actions\"\u003e\r\n\r\n    \u003cbutton disabled class=\"pass-action secondary-action\" id=\"animatedPassBtn\"\u003e\r\n      \u003cspan\u003e◉\u003c/span\u003e\r\n      \u003cspan\u003eANIMATED PASS\u003c/span\u003e\r\n    \u003c/button\u003e\r\n\r\n    \u003cbutton disabled class=\"pass-action secondary-action\" id=\"shareTicketBtn\"\u003e\r\n      \u003cspan\u003e↗\u003c/span\u003e\r\n      \u003cspan\u003eSHARE TICKET\u003c/span\u003e\r\n    \u003c/button\u003e\r\n\r\n\r\n    \u003c!-- =========================================\r\n     1080 × 1920 EXPORT VERSION\r\n     This stays outside the visible screen.\r\n     ========================================= --\u003e\r\n\r\n\u003cdiv id=\"ticketExport\" aria-hidden=\"true\"\u003e\r\n\r\n  \u003cdiv class=\"export-bg-grid\"\u003e\u003c/div\u003e\r\n  \u003cdiv class=\"export-light export-light-one\"\u003e\u003c/div\u003e\r\n  \u003cdiv class=\"export-light export-light-two\"\u003e\u003c/div\u003e\r\n\r\n  \u003cdiv class=\"export-content\"\u003e\r\n\r\n    \u003cdiv class=\"export-brand\"\u003e\r\n      \u003cspan\u003eKICKOFF OS\u003c/span\u003e\r\n      \u003ch1\u003eMATCH PASS\u003c/h1\u003e\r\n    \u003c/div\u003e\r\n\r\n    \u003cdiv class=\"export-ticket-id\" id=\"export-id\"\u003e\r\n      KFK-0000\r\n    \u003c/div\u003e\r\n\r\n    \u003cdiv class=\"export-section\"\u003e\r\n      \u003cspan class=\"export-label\"\u003ePLAYER\u003c/span\u003e\r\n      \u003cdiv class=\"export-player\" id=\"export-name\"\u003e\r\n        PLAYER\r\n      \u003c/div\u003e\r\n    \u003c/div\u003e\r\n\r\n    \u003cdiv class=\"export-divider\"\u003e\u003c/div\u003e\r\n\r\n    \u003cdiv class=\"export-section\"\u003e\r\n      \u003cspan class=\"export-label\"\u003e\r\n        KICKOFF WINDOW\r\n      \u003c/span\u003e\r\n\r\n      \u003cdiv class=\"export-date\" id=\"export-date\"\u003e\r\n        OCT 9\r\n      \u003c/div\u003e\r\n\r\n      \u003cdiv class=\"export-time\" id=\"export-time\"\u003e\r\n        4:30 PM - 6:00 PM\r\n      \u003c/div\u003e\r\n    \u003c/div\u003e\r\n\r\n    \u003cdiv class=\"export-section export-venue\"\u003e\r\n      \u003cspan class=\"export-label\"\u003eVENUE\u003c/span\u003e\r\n\r\n      \u003cdiv\u003e\r\n        CHOUEIFAT FACILITY\u003cbr\u003e\r\n        PITCH 1\r\n      \u003c/div\u003e\r\n    \u003c/div\u003e\r\n\r\n    \u003cdiv class=\"export-valid\"\u003e\r\n      \u003cspan class=\"export-valid-dot\"\u003e\u003c/span\u003e\r\n      CHECKING STATUS\r\n    \u003c/div\u003e\r\n\r\n    \u003cdiv class=\"export-footer\"\u003e\r\n      \u003cspan\u003eKICKOFF CHOUEIFAT\u003c/span\u003e\r\n      \u003cspan\u003eOFFICIAL DIGITAL MATCH PASS\u003c/span\u003e\r\n    \u003c/div\u003e\r\n\r\n  \u003c/div\u003e\r\n\u003c/div\u003e\r\n\r\n  \u003c/div\u003e\r\n\r\n\u003c/div\u003e\r\n  \u003c!-- LAYER 6-8: The Spatial Match Pass --\u003e\r\n  \u003cdiv class=\"pass-stage\"\u003e\r\n  \u003cdiv class=\"spatial-pass-wrapper\" id=\"passWrapper\"\u003e\r\n    \u003cdiv class=\"pass-content\"\u003e\r\n      \r\n      \u003c!-- The Scanning Laser --\u003e\r\n      \u003cdiv class=\"scanner-laser\"\u003e\u003c/div\u003e\r\n\r\n      \u003cdiv class=\"brand-header\" style=\"--z: 20px;\"\u003e\r\n        \u003cspan class=\"label\"\u003eKICKOFF OS\u003c/span\u003e\r\n        \u003ch1\u003eMATCH PASS\u003c/h1\u003e\r\n      \u003c/div\u003e\r\n\r\n      \u003cdiv class=\"pass-id\" style=\"--z: 40px;\" id=\"p-id\"\u003e\r\n        \u003c!-- Injected via JS --\u003e\r\n      \u003c/div\u003e\r\n\r\n      \u003cdiv class=\"player-group\" style=\"--z: 30px;\"\u003e\r\n        \u003cspan class=\"label\"\u003ePlayer\u003c/span\u003e\r\n        \u003cdiv class=\"value player-name\" id=\"p-name\"\u003e--\u003c/div\u003e\r\n      \u003c/div\u003e\r\n\r\n      \u003cdiv class=\"match-core\" style=\"--z: 50px;\"\u003e\r\n        \u003cspan class=\"label\"\u003eKickoff Window\u003c/span\u003e\r\n        \u003cdiv class=\"value match-date\" id=\"p-date\"\u003e--\u003c/div\u003e\r\n        \u003cdiv class=\"value match-time\" id=\"p-time\"\u003e--:--\u003c/div\u003e\r\n      \u003c/div\u003e\r\n\r\n      \u003cdiv class=\"venue-info\" style=\"--z: 20px;\"\u003e\r\n        \u003cspan class=\"label\"\u003eVenue\u003c/span\u003e\r\n        \u003cdiv class=\"value\"\u003eCHOUEIFAT FACILITY PITCH 1\u003c/div\u003e\r\n      \u003c/div\u003e\r\n\r\n      \u003cdiv class=\"verified-status\"\u003e\r\n        \u003cdiv class=\"dot\"\u003e\u003c/div\u003e\r\n        CHECKING STATUS\r\n      \u003c/div\u003e\r\n\r\n    \u003c/div\u003e\r\n  \u003c/div\u003e\r\n\r\n  \u003c/div\u003e\r\n  \u003cscript src=\"shared.js?v=2.3.0\"\u003e\u003c/script\u003e\n  \u003cscript src=\"ticket.js?v=2.3.0\"\u003e\u003c/script\u003e\r\n  \u003cscript src=\"/ui.js?v=2.3.0\"\u003e\u003c/script\u003e\r\n\u003c/body\u003e\r\n\u003c/html\u003e\r\n"}, {"path": "client/public/ticket.js", "code": "document.addEventListener('DOMContentLoaded', () =\u003e {\r\n  const token = new URLSearchParams(window.location.search).get('token');\r\n  const ticketData = { id: 'KFK-UNKNOWN', name: 'GUEST PLAYER', date: 'DATE PENDING', time: '--:--', statusLabel: 'UNVERIFIED PASS' };\r\n  const controls = [...document.querySelectorAll('.pass-action')];\r\n  function setStatus(label, message) {\r\n    for (const element of document.querySelectorAll('.verified-status, .export-valid')) {\r\n      const dot = element.querySelector('.dot, .export-valid-dot')?.cloneNode(true);\r\n      element.replaceChildren(...(dot ? [dot] : []), document.createTextNode(label));\r\n      element.title = message;\r\n    }\r\n  }\r\n  function unavailable(message) {\r\n    setStatus('UNVERIFIED PASS', message);\r\n    controls.forEach(button =\u003e { button.disabled = true; });\r\n  }\r\n  function applyTicket(record) {\r\n    const past = record.ends_at \u0026\u0026 new Date(record.ends_at).getTime() \u003c Date.now();\r\n    const label = record.status === 'CONFIRMED' ? (past ? 'MATCH COMPLETED' : 'VALID RESERVATION')\r\n      : record.status === 'CANCELLED' ? 'CANCELLED' : 'PENDING APPROVAL';\r\n    Object.assign(ticketData, record, { date: new Date(`${record.date}T12:00:00`).toDateString(), statusLabel: label });\r\n    for (const prefix of ['p', 'export']) for (const field of ['id', 'name', 'date', 'time']) {\r\n      const element = document.getElementById(`${prefix}-${field}`);\r\n      if (element) element.textContent = ticketData[field];\r\n    }\r\n    setStatus(label, record.status === 'PENDING' ? 'A request holds no slot until staff confirms it.' : 'Current status checked against the booking database.');\r\n    controls.forEach(button =\u003e { button.disabled = false; });\r\n  }\r\n  async function refreshStatus() {\r\n    if (document.hidden) return;\r\n    try { applyTicket((await window.Kickoff.api(`/api/tickets/${encodeURIComponent(token)}`)).reservation); }\r\n    catch (error) { unavailable(error.message || 'We could not verify this pass.'); }\r\n  }\r\n  if (token) {\r\n    refreshStatus();\r\n    setInterval(refreshStatus, 30000);\r\n    document.addEventListener('visibilitychange', refreshStatus);\r\n  } else unavailable('Open the secure pass from your account or ask staff for an updated link.');\r\n\r\n/* Visible interactive ticket */\r\n\r\ndocument.getElementById('p-id').textContent =\r\n  ticketData.id;\r\n\r\ndocument.getElementById('p-name').textContent =\r\n  ticketData.name;\r\n\r\ndocument.getElementById('p-date').textContent =\r\n  ticketData.date;\r\n\r\ndocument.getElementById('p-time').textContent =\r\n  ticketData.time;\r\n\r\n\r\n/* Portrait saved ticket */\r\n\r\ndocument.getElementById('export-id').textContent =\r\n  ticketData.id;\r\n\r\ndocument.getElementById('export-name').textContent =\r\n  ticketData.name;\r\n\r\ndocument.getElementById('export-date').textContent =\r\n  ticketData.date;\r\n\r\ndocument.getElementById('export-time').textContent =\r\n  ticketData.time;\r\n\r\n  // ==========================================================================\r\n// MATCH PASS EXPORT ENGINE\r\n// ==========================================================================\r\n\r\nconst saveTicketBtn =\r\n  document.getElementById('saveTicketBtn');\r\n\r\nconst animatedPassBtn =\r\n  document.getElementById('animatedPassBtn');\r\n\r\nconst shareTicketBtn =\r\n  document.getElementById('shareTicketBtn');\r\n\r\nconst exportTicket =\r\n  document.getElementById('ticketExport');\r\n\r\n\r\nfunction canvasToBlob(\r\n  canvas,\r\n  type = 'image/png',\r\n  quality = 1\r\n) {\r\n\r\n  return new Promise((resolve) =\u003e {\r\n\r\n    canvas.toBlob(\r\n      resolve,\r\n      type,\r\n      quality\r\n    );\r\n\r\n  });\r\n\r\n}\r\n\r\n\r\nfunction downloadBlob(blob, filename) {\r\n\r\n  const url =\r\n    URL.createObjectURL(blob);\r\n\r\n  const link =\r\n    document.createElement('a');\r\n\r\n  link.href =\r\n    url;\r\n\r\n  link.download =\r\n    filename;\r\n\r\n  document.body.appendChild(link);\r\n\r\n  link.click();\r\n\r\n  link.remove();\r\n\r\n  setTimeout(() =\u003e {\r\n    URL.revokeObjectURL(url);\r\n  }, 1000);\r\n\r\n}\r\n\r\n\r\n/* ---------------------------------------------------------\r\n   Render dedicated 1080 × 1920 ticket\r\n   --------------------------------------------------------- */\r\n\r\nasync function renderPortraitTicket() {\r\n\r\n  // Wait until Google fonts are ready\r\n  if (document.fonts \u0026\u0026 document.fonts.ready) {\r\n    await document.fonts.ready;\r\n  }\r\n\r\n  const canvas = document.createElement('canvas');\r\n\r\n  canvas.width = 1080;\r\n  canvas.height = 1920;\r\n\r\n  const ctx = canvas.getContext('2d');\r\n\r\n  const W = canvas.width;\r\n  const H = canvas.height;\r\n\r\n  // =====================================================\r\n  // BACKGROUND\r\n  // =====================================================\r\n\r\n  ctx.fillStyle = '#050807';\r\n  ctx.fillRect(0, 0, W, H);\r\n\r\n\r\n  // Main soft green stadium glow\r\n\r\n  const mainGlow = ctx.createRadialGradient(\r\n    W / 2,\r\n    250,\r\n    20,\r\n    W / 2,\r\n    500,\r\n    900\r\n  );\r\n\r\n  mainGlow.addColorStop(\r\n    0,\r\n    'rgba(105, 155, 128, 0.65)'\r\n  );\r\n\r\n  mainGlow.addColorStop(\r\n    0.35,\r\n    'rgba(26, 55, 41, 0.45)'\r\n  );\r\n\r\n  mainGlow.addColorStop(\r\n    1,\r\n    'rgba(5, 8, 7, 0)'\r\n  );\r\n\r\n  ctx.fillStyle = mainGlow;\r\n\r\n  ctx.fillRect(\r\n    0,\r\n    0,\r\n    W,\r\n    H\r\n  );\r\n\r\n\r\n  // =====================================================\r\n  // LIGHT BEAMS\r\n  // =====================================================\r\n\r\n  ctx.save();\r\n\r\n  ctx.globalAlpha = 0.1;\r\n\r\n  const leftBeam = ctx.createLinearGradient(\r\n    100,\r\n    0,\r\n    500,\r\n    1300\r\n  );\r\n\r\n  leftBeam.addColorStop(\r\n    0,\r\n    'rgba(0,255,102,0.7)'\r\n  );\r\n\r\n  leftBeam.addColorStop(\r\n    1,\r\n    'rgba(0,255,102,0)'\r\n  );\r\n\r\n  ctx.fillStyle = leftBeam;\r\n\r\n  ctx.beginPath();\r\n\r\n  ctx.moveTo(\r\n    120,\r\n    0\r\n  );\r\n\r\n  ctx.lineTo(\r\n    370,\r\n    0\r\n  );\r\n\r\n  ctx.lineTo(\r\n    700,\r\n    1550\r\n  );\r\n\r\n  ctx.lineTo(\r\n    430,\r\n    1550\r\n  );\r\n\r\n  ctx.closePath();\r\n\r\n  ctx.fill();\r\n\r\n\r\n  ctx.restore();\r\n\r\n\r\n  // =====================================================\r\n  // AMBIENT PARTICLES\r\n  // =====================================================\r\n\r\n  for (let i = 0; i \u003c 55; i++) {\r\n\r\n    const x =\r\n      Math.random() * W;\r\n\r\n    const y =\r\n      Math.random() * H;\r\n\r\n    const r =\r\n      Math.random() * 2.5 + 0.7;\r\n\r\n    const opacity =\r\n      Math.random() * 0.28 + 0.06;\r\n\r\n    ctx.beginPath();\r\n\r\n    ctx.arc(\r\n      x,\r\n      y,\r\n      r,\r\n      0,\r\n      Math.PI * 2\r\n    );\r\n\r\n    ctx.fillStyle =\r\n      `rgba(0,255,102,${opacity})`;\r\n\r\n    ctx.fill();\r\n\r\n  }\r\n\r\n\r\n  // =====================================================\r\n  // HELPERS\r\n  // =====================================================\r\n\r\n  function centerText(\r\n    text,\r\n    y,\r\n    font,\r\n    color = '#FFFFFF',\r\n    letterSpacing = 0\r\n  ) {\r\n\r\n    ctx.font = font;\r\n\r\n    ctx.fillStyle =\r\n      color;\r\n\r\n    ctx.textAlign =\r\n      'center';\r\n\r\n    ctx.textBaseline =\r\n      'middle';\r\n\r\n\r\n    if (!letterSpacing) {\r\n\r\n      ctx.fillText(\r\n        text,\r\n        W / 2,\r\n        y\r\n      );\r\n\r\n      return;\r\n\r\n    }\r\n\r\n\r\n    const chars =\r\n      [...text];\r\n\r\n\r\n    const widths =\r\n      chars.map(\r\n        char =\u003e\r\n          ctx.measureText(char).width\r\n      );\r\n\r\n\r\n    const total =\r\n      widths.reduce(\r\n        (a, b) =\u003e a + b,\r\n        0\r\n      ) +\r\n      letterSpacing *\r\n      (chars.length - 1);\r\n\r\n\r\n    let x =\r\n      W / 2 -\r\n      total / 2;\r\n\r\n\r\n    chars.forEach(\r\n      (char, index) =\u003e {\r\n\r\n        ctx.fillText(\r\n          char,\r\n          x +\r\n          widths[index] / 2,\r\n          y\r\n        );\r\n\r\n        x +=\r\n          widths[index] +\r\n          letterSpacing;\r\n\r\n      }\r\n    );\r\n\r\n  }\r\n\r\n\r\n  // =====================================================\r\n  // BRAND\r\n  // =====================================================\r\n\r\n  centerText(\r\n    'KICKOFF OS',\r\n    165,\r\n    '800 22px Inter',\r\n    '#829089',\r\n    7\r\n  );\r\n\r\n\r\n  centerText(\r\n    'MATCH PASS',\r\n    225,\r\n    '800 62px Rajdhani',\r\n    '#FFFFFF',\r\n    8\r\n  );\r\n\r\n\r\n  // Small accent line\r\n\r\n  const topLine =\r\n    ctx.createLinearGradient(\r\n      390,\r\n      0,\r\n      690,\r\n      0\r\n    );\r\n\r\n  topLine.addColorStop(\r\n    0,\r\n    'rgba(0,255,102,0)'\r\n  );\r\n\r\n  topLine.addColorStop(\r\n    0.5,\r\n    'rgba(0,255,102,0.8)'\r\n  );\r\n\r\n  topLine.addColorStop(\r\n    1,\r\n    'rgba(0,255,102,0)'\r\n  );\r\n\r\n\r\n  ctx.fillStyle =\r\n    topLine;\r\n\r\n  ctx.fillRect(\r\n    390,\r\n    280,\r\n    300,\r\n    2\r\n  );\r\n\r\n\r\n  // =====================================================\r\n  // TICKET ID\r\n  // =====================================================\r\n\r\n  ctx.shadowColor =\r\n    'rgba(0,255,102,0.5)';\r\n\r\n  ctx.shadowBlur =\r\n    22;\r\n\r\n\r\n  centerText(\r\n    ticketData.id,\r\n    370,\r\n    '700 34px \"Space Mono\"',\r\n    '#00FF66'\r\n  );\r\n\r\n\r\n  ctx.shadowBlur =\r\n    0;\r\n\r\n\r\n  // =====================================================\r\n  // PLAYER\r\n  // =====================================================\r\n\r\n  centerText(\r\n    'PLAYER',\r\n    525,\r\n    '800 20px Inter',\r\n    '#83918A',\r\n    7\r\n  );\r\n\r\n\r\n  // Preserve the original single-line style and fit longer names inside the saved pass.\r\n  const playerName = ticketData.name.toUpperCase();\r\n  function nameWidth(text) {\r\n    return [...text].reduce((sum, char) =\u003e sum + ctx.measureText(char).width, 0) + Math.max(0, [...text].length - 1) * 2;\r\n  }\r\n  function nameLines(size) {\r\n    ctx.font = `800 ${size}px Rajdhani`;\r\n    const lines = []; let line = '';\r\n    for (const word of playerName.split(/\\s+/)) {\r\n      const candidate = line ? `${line} ${word}` : word;\r\n      if (nameWidth(candidate) \u003c= 864) { line = candidate; continue; }\r\n      if (line) { lines.push(line); line = ''; }\r\n      for (const char of word) {\r\n        if (line \u0026\u0026 nameWidth(line + char) \u003e 864) { lines.push(line); line = char; }\r\n        else line += char;\r\n      }\r\n    }\r\n    if (line) lines.push(line);\r\n    return lines;\r\n  }\r\n  ctx.font = '800 74px Rajdhani';\r\n  if (nameWidth(playerName) \u003c= 864) centerText(playerName, 600, '800 74px Rajdhani', '#FFFFFF', 2);\r\n  else {\r\n    let size = 74, lines = nameLines(size);\r\n    while (size \u003e 20 \u0026\u0026 (lines.length \u003e 3 || lines.length * size + (lines.length - 1) * 4 \u003e 136)) lines = nameLines(size -= 2);\r\n    lines.forEach((line, index) =\u003e centerText(line, 548 + size + index * (size + 4), `800 ${size}px Rajdhani`, '#FFFFFF', 2));\r\n  }\r\n\r\n\r\n  // =====================================================\r\n  // DIVIDER\r\n  // =====================================================\r\n\r\n  const divider =\r\n    ctx.createLinearGradient(\r\n      390,\r\n      0,\r\n      690,\r\n      0\r\n    );\r\n\r\n\r\n  divider.addColorStop(\r\n    0,\r\n    'rgba(0,255,102,0)'\r\n  );\r\n\r\n  divider.addColorStop(\r\n    0.5,\r\n    'rgba(0,255,102,0.7)'\r\n  );\r\n\r\n  divider.addColorStop(\r\n    1,\r\n    'rgba(0,255,102,0)'\r\n  );\r\n\r\n\r\n atus).json({ error: message, requestId: req.requestId });\n  });\n  app.locals.sessionStore = store;\n  app.locals.rateLimiters = { apiLimiter, loginLimiter, bookingLimiter };\n  return app;\n}\nmodule.exports = { createApp };\n"}, {"path": "server/config/db.js", "code": "const { Pool, types } = require('pg');\nconst { loadConfig } = require('./env');\ntypes.setTypeParser(1082, value =\u003e value);\nfunction createDatabase(config = loadConfig()) {\n  const url = new URL(config.databaseUrl);\n  if (config.production || ['prefer', 'require', 'verify-ca'].includes(url.searchParams.get('sslmode'))) url.searchParams.set('sslmode', 'verify-full');\n  const pool = new Pool({ connectionString: url.href, max: 8, connectionTimeoutMillis: 10000,\n    idleTimeoutMillis: 30000, statement_timeout: 15000, application_name: 'kickoff' });\n  pool.on('error', error =\u003e console.error('database_idle_error', { code: error.code || 'UNKNOWN' }));\n  return {\n    pool,\n    query: (sql, values) =\u003e pool.query(sql, values),\n    async transaction(work) {\n      const client = await pool.connect();\n      try { await client.query('BEGIN'); const result = await work(client); await client.query('COMMIT'); return result; }\n      catch (error) { await client.query('ROLLBACK'); throw error; }\n      finally { client.release(); }\n    },\n    close: () =\u003e pool.end()\n  };\n}\nmodule.exports = { createDatabase };\n"}, {"path": "server/config/env.js", "code": "const path = require('node:path');\nrequire('dotenv').config({ path: path.join(__dirname, '../.env'), quiet: true });\n\nfunction loadConfig(env = process.env) {\n  const required = ['SESSION_SECRET', 'ADMIN_USER', 'ADMIN_PASS', 'GOOGLE_CLIENT_ID', 'GOOGLE_CLIENT_SECRET', 'GOOGLE_CALLBACK_URL'];\n  const missing = required.filter(key =\u003e typeof env[key] !== 'string' || !env[key].trim());\n  if (!(env.DATABASE_URL || env.DB_URL)) missing.push('DATABASE_URL (or DB_URL)');\n  if (missing.length) throw new Error(`Missing required environment variables: ${missing.join(', ')}`);\n  for (const key of [...required, 'TICKET_SECRET']) {\n    if (/^(REPLACE_|CHANGE_ME|YOUR_)/i.test(env[key] || '')) throw new Error(`Replace the example value for ${key} before starting.`);\n  }\n  if (env.SESSION_SECRET.length \u003c 32) throw new Error('SESSION_SECRET must contain at least 32 characters.');\n  if (env.ADMIN_PASS.length \u003c 12) throw new Error('ADMIN_PASS must contain at least 12 characters.');\n  if (env.TICKET_SECRET \u0026\u0026 env.TICKET_SECRET.length \u003c 32) throw new Error('TICKET_SECRET must contain at least 32 characters.');\n  const production = env.NODE_ENV === 'production';\n  const callback = new URL(env.GOOGLE_CALLBACK_URL);\n  const origin = new URL(env.APP_URL || callback.origin);\n  if (!['http:', 'https:'].includes(origin.protocol) || origin.username || origin.password) throw new Error('APP_URL must be an HTTP(S) origin.');\n  if (production \u0026\u0026 (origin.protocol !== 'https:' || callback.protocol !== 'https:')) throw new Error('Production APP_URL and Google callback must use HTTPS.');\n  if (origin.origin !== callback.origin) throw new Error('APP_URL and GOOGLE_CALLBACK_URL must use the same origin.');\n  const port = Number(env.PORT || 3000);\n  if (!Number.isInteger(port) || port \u003c 0 || port \u003e 65535) throw new Error('PORT must be a valid port number.');\n  return {\n    production, port, origin: origin.origin,\n    databaseUrl: env.DATABASE_URL || env.DB_URL,\n    sessionSecret: env.SESSION_SECRET,\n    ticketSecret: env.TICKET_SECRET || env.SESSION_SECRET,\n    adminUser: env.ADMIN_USER, adminPass: env.ADMIN_PASS,\n    googleClientId: env.GOOGLE_CLIENT_ID, googleClientSecret: env.GOOGLE_CLIENT_SECRET,\n    googleCallbackUrl: callback.href,\n    businessWhatsApp: env.BUSINESS_WHATSAPP || '9613696325'\n  };\n}\nmodule.exports = { loadConfig };\n"}, {"path": "server/config/init.sql", "code": "-- Fresh database setup. Existing deployments should use npm run db:migrate.\nBEGIN;\nCREATE TABLE IF NOT EXISTS users (\n  id SERIAL PRIMARY KEY, google_id VARCHAR(255) UNIQUE NOT NULL,\n  email VARCHAR(255) UNIQUE NOT NULL, name VARCHAR(255) NOT NULL,\n  phone VARCHAR(50), created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP\n);\nCREATE TABLE IF NOT EXISTS reservations (\n  id VARCHAR(50) PRIMARY KEY, name VARCHAR(255) NOT NULL, phone VARCHAR(50) NOT NULL,\n  date DATE NOT NULL, time VARCHAR(50) NOT NULL, end_time VARCHAR(50) NOT NULL,\n  notes TEXT, status VARCHAR(50) NOT NULL DEFAULT 'PENDING',\n  user_id INTEGER, starts_at TIMESTAMPTZ, ends_at TIMESTAMPTZ,\n  created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP\n);\nCREATE TABLE IF NOT EXISTS standing_bookings (\n  id SERIAL PRIMARY KEY, player_name VARCHAR(255) NOT NULL, phone VARCHAR(50),\n  day_of_week INTEGER NOT NULL, time VARCHAR(50) NOT NULL,\n  created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP\n);\nALTER TABLE reservations ADD COLUMN IF NOT EXISTS user_id INTEGER;\nALTER TABLE reservations ADD COLUMN IF NOT EXISTS starts_at TIMESTAMPTZ;\nALTER TABLE reservations ADD COLUMN IF NOT EXISTS ends_at TIMESTAMPTZ;\nALTER TABLE reservations ALTER COLUMN status SET DEFAULT 'PENDING';\nALTER TABLE reservations ALTER COLUMN status SET NOT NULL;\nUPDATE reservations AS r SET\n  starts_at = ((r.date + s.start_time::time) AT TIME ZONE 'Asia/Beirut'),\n  ends_at = ((r.date + s.end_time::time) AT TIME ZONE 'Asia/Beirut')\nFROM (VALUES\n  ('3:00 PM - 4:30 PM', '15:00', '16:30'),\n  ('4:30 PM - 6:00 PM', '16:30', '18:00'),\n  ('6:00 PM - 7:30 PM', '18:00', '19:30'),\n  ('7:30 PM - 9:00 PM', '19:30', '21:00'),\n  ('9:00 PM - 10:30 PM', '21:00', '22:30'),\n  ('10:30 PM - 12:00 AM', '22:30', '24:00')\n) AS s(label, start_time, end_time)\nWHERE r.time = s.label AND (r.starts_at IS NULL OR r.ends_at IS NULL);\nDO $$ BEGIN\n  IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'reservations_user_fk' AND conrelid = 'reservations'::regclass) THEN\n    ALTER TABLE reservations ADD CONSTRAINT reservations_user_fk FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE SET NULL;\n  END IF;\n  IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'reservations_status_check' AND conrelid = 'reservations'::regclass) THEN\n    ALTER TABLE reservations ADD CONSTRAINT reservations_status_check CHECK (status IN ('PENDING', 'CONFIRMED', 'CANCELLED'));\n  END IF;\n  IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'reservations_slot_check' AND conrelid = 'reservations'::regclass) THEN\n    ALTER TABLE reservations ADD CONSTRAINT reservations_slot_check CHECK (status = 'CANCELLED' OR time IN (\n      '3:00 PM - 4:30 PM', '4:30 PM - 6:00 PM', '6:00 PM - 7:30 PM',\n      '7:30 PM - 9:00 PM', '9:00 PM - 10:30 PM', '10:30 PM - 12:00 AM'));\n  END IF;\n  IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'standing_day_check' AND conrelid = 'standing_bookings'::regclass) THEN\n    ALTER TABLE standing_bookings ADD CONSTRAINT standing_day_check CHECK (day_of_week BETWEEN 0 AND 6);\n  END IF;\n  IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'standing_slot_check' AND conrelid = 'standing_bookings'::regclass) THEN\n    ALTER TABLE standing_bookings ADD CONSTRAINT standing_slot_check CHECK (time IN (\n      '3:00 PM - 4:30 PM', '4:30 PM - 6:00 PM', '6:00 PM - 7:30 PM',\n      '7:30 PM - 9:00 PM', '9:00 PM - 10:30 PM', '10:30 PM - 12:00 AM'));\n  END IF;\nEND $$;\nCREATE UNIQUE INDEX IF NOT EXISTS reservations_one_confirmed_slot ON reservations (date, time) WHERE status = 'CONFIRMED';\nCREATE UNIQUE INDEX IF NOT EXISTS standing_one_weekly_slot ON standing_bookings (day_of_week, time);\nCREATE INDEX IF NOT EXISTS reservations_user_date ON reservations (user_id, date DESC);\nCREATE INDEX IF NOT EXISTS reservations_status_date ON reservations (status, date);\nCREATE TABLE IF NOT EXISTS session (sid VARCHAR PRIMARY KEY, sess JSON NOT NULL, expire TIMESTAMP(6) NOT NULL);\nCREATE INDEX IF NOT EXISTS session_expire ON session (expire);\nCREATE TABLE IF NOT EXISTS audit_log (\n  id BIGSERIAL PRIMARY KEY, actor VARCHAR(255) NOT NULL,\n  action VARCHAR(80) NOT NULL, entity_id VARCHAR(50) NOT NULL,\n  created_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP\n);\nCREATE TABLE IF NOT EXISTS schema_migrations (version VARCHAR(100) PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP);\n\nINSERT INTO schema_migrations (version) VALUES ('001_security_and_bookings') ON CONFLICT DO NOTHING;\nCOMMIT;\n"}, {"path": "server/config/passport.js", "code": "const { Passport } = require('passport');\nconst GoogleStrategy = require('passport-google-oauth20').Strategy;\nfunction createPassport(db, config) {\n  const passport = new Passport();\n  passport.use(new GoogleStrategy({ clientID: config.googleClientId, clientSecret: config.googleClientSecret,\n    callbackURL: config.googleCallbackUrl, proxy: true, state: true }, async (_access, _refresh, profile, done) =\u003e {\n    try {\n      const email = profile.emails?.[0]?.value;\n      if (!email) return done(null, false);\n      const result = await db.query(`INSERT INTO users (google_id, email, name) VALUES ($1, $2, $3)\n        ON CONFLICT (google_id) DO UPDATE SET email = EXCLUDED.email\n        RETURNING id, name, email, phone`, [profile.id, email, profile.displayName || email.split('@')[0]]);\n      done(null, result.rows[0]);\n    } catch (error) { done(error); }\n  }));\n  passport.serializeUser((user, done) =\u003e done(null, user.id));\n  passport.deserializeUser(async (id, done) =\u003e {\n    try { const result = await db.query('SELECT id, name, email, phone FROM users WHERE id = $1', [id]); done(null, result.rows[0] || false); }\n    catch (error) { done(error); }\n  });\n  return passport;\n}\nmodule.exports = { createPassport };\n"}, {"path": "server/config/runtime-role.sql", "code": "-- Optional production hardening, run AFTER db:migrate as the database owner.\n-- First create a dedicated LOGIN role named kickoff_app with a strong password,\n-- no ownership, no administrative attributes and no privileged memberships.\n-- This script grants access; it does not create/change passwords or revoke other roles.\nDO $$\nDECLARE app_role TEXT := 'kickoff_app';\nBEGIN\n  IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = app_role) THEN\n    RAISE EXCEPTION 'Create the dedicated kickoff_app login role first.';\n  END IF;\n  IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = app_role AND (rolsuper OR rolcreatedb OR rolcreaterole))\n    OR EXISTS (SELECT 1 FROM pg_database d JOIN pg_roles r ON r.oid = d.datdba WHERE d.datname = current_database() AND r.rolname = app_role)\n    OR EXISTS (SELECT 1 FROM pg_auth_members m JOIN pg_roles r ON r.oid = m.member WHERE r.rolname = app_role) THEN\n    RAISE EXCEPTION 'The application role must not own the database, administer roles, or belong to other roles.';\n  END IF;\n  IF NOT has_database_privilege(app_role, current_database(), 'CONNECT') THEN\n    RAISE EXCEPTION 'Grant CONNECT on this database to kickoff_app as its owner, then run this script again.';\n  END IF;\n  IF has_schema_privilege(app_role, 'public', 'CREATE') THEN\n    RAISE EXCEPTION 'The application role can create objects in public. Review schema/PUBLIC privileges before granting runtime access.';\n  END IF;\n  EXECUTE format('GRANT USAGE ON SCHEMA public TO %I', app_role);\n  EXECUTE format('GRANT SELECT, INSERT, UPDATE ON public.users TO %I', app_role);\n  EXECUTE format('GRANT SELECT, INSERT, UPDATE, DELETE ON public.reservations, public.standing_bookings, public.session TO %I', app_role);\n  EXECUTE format('GRANT INSERT ON public.audit_log TO %I', app_role);\n  EXECUTE format('GRANT SELECT ON public.schema_migrations TO %I', app_role);\n  EXECUTE format('GRANT USAGE ON SEQUENCE public.users_id_seq, public.standing_bookings_id_seq, public.audit_log_id_seq TO %I', app_role);\nEND $$;\n"}, {"path": "server/controllers/adminController.js", "code": "const { ALL_SLOTS, HttpError, venueNow, dateValue, addDays, text } = require('../lib/booking');\nfunction createAdminController(db, bookings, tickets) {\n  return {\n    async getDashboardStats(req, res) {\n      const today = venueNow().date;\n      const result = await db.query(`SELECT\n        COUNT(*) FILTER (WHERE date = $1 AND status = 'CONFIRMED')::integer AS \"todayMatches\",\n        COUNT(*) FILTER (WHERE status = 'PENDING' AND date \u003e= $1)::integer AS pending,\n        COUNT(*) FILTER (WHERE date \u003e= $1 AND status = 'CONFIRMED')::integer AS upcoming,\n        COUNT(*) FILTER (WHERE status = 'CANCELLED')::integer AS cancelled FROM reservations`, [today]);\n      res.json(result.rows[0]);\n    },\n    async getReservations(req, res) {\n      const search = text(req.query.search || '', 'Search', 100, false);\n      const status = req.query.status || 'ALL';\n      if (!['ALL', 'ARCHIVE', 'UPCOMING', 'PENDING', 'CONFIRMED', 'CANCELLED'].includes(status)) throw new HttpError(400, 'Unknown booking status.');\n      const page = Number(req.query.page || 1);\n      if (!Number.isInteger(page) || page \u003c 1 || page \u003e 1000000) throw new HttpError(400, 'Invalid page number.');\n      const values = [], conditions = [];\n      const param = value =\u003e { values.push(value); return `$${values.length}`; };\n      if (search) { const term = param(`%${search}%`); conditions.push(`(name ILIKE ${term} OR phone ILIKE ${term} OR id ILIKE ${term})`); }\n      if (status === 'ARCHIVE') conditions.push(`date \u003c ${param(venueNow().date)}::date`);\n      else if (status === 'UPCOMING') conditions.push(`date \u003e= ${param(venueNow().date)}::date AND status = 'CONFIRMED'`);\n      else if (status !== 'ALL') conditions.push(`status = ${param(status)}`);\n      if (req.query.date) conditions.push(`date = ${param(dateValue(req.query.date))}::date`);\n      const where = conditions.length ? `WHERE ${conditions.join(' AND ')}` : '';\n      const count = await db.query(`SELECT COUNT(*)::integer AS total FROM reservations ${where}`, values);\n      const pageSize = 50, total = count.rows[0].total;\n      const order = param(ALL_SLOTS), limit = param(pageSize), offset = param((page - 1) * pageSize);\n      const result = await db.query(`SELECT id, name, phone, date::text, time, end_time, notes, status, user_id, starts_at, ends_at\n        FROM reservations ${where} ORDER BY date DESC, array_position(${order}::text[], time), created_at DESC LIMIT ${limit} OFFSET ${offset}`, values);\n      res.json({ reservations: result.rows.map(row =\u003e ({ ...row, ticketUrl: tickets.url(row.id) })),\n        pagination: { page, pageSize, total, totalPages: Math.max(1, Math.ceil(total / pageSize)), hasNext: page * pageSize \u003c total, hasPrevious: page \u003e 1 } });\n    },\n    async createManualReservation(req, res) {\n      const reservation = await bookings.create(req.body, { staff: req.session.user });\n      res.status(201).json({ success: true, id: reservation.id, reservation, ticketUrl: tickets.url(reservation.id) });\n    },\n    async confirmReservation(req, res) { await bookings.confirm(req.params.id, req.session.user); res.json({ success: true }); },\n    async cancelReservation(req, res) { await bookings.cancel(req.params.id, req.session.user); res.json({ success: true }); },\n    async clearCancelled(req, res) { const count = await bookings.clearCancelled(req.session.user); res.json({ success: true, deleted: count }); },\n    async getStandingBookings(req, res) {\n      const result = await db.query('SELECT id, player_name AS \"playerName\", phone, day_of_week AS \"dayOfWeek\", time FROM standing_bookings ORDER BY day_of_week, array_position($1::text[], time)', [ALL_SLOTS]);\n      res.json({ standingBookings: result.rows });\n    },\n    async createStandingBooking(req, res) { const result = await bookings.standing(req.body, req.session.user); res.status(201).json({ success: true, id: result.id }); },\n    async updateStandingBooking(req, res) { await bookings.standing(req.body, req.session.user, req.params.id); res.json({ success: true }); },\n    async deleteStandingBooking(req, res) { await bookings.removeStanding(req.params.id, req.session.user); res.json({ success: true }); },\n    async getAnalytics(req, res) {\n      const today = venueNow().date, start = addDays(today, -29);\n      const result = await db.query(`SELECT date::text, COUNT(*)::integer AS count FROM reservations\n        WHERE date BETWEEN $1::date AND $2::date AND status = 'CONFIRMED' GROUP BY date ORDER BY date`, [start, today]);\n      res.json({ analytics: result.rows, startDate: start, endDate: today });\n    }\n  };\n}\nmodule.exports = { createAdminController };\n"}, {"path": "server/controllers/authController.js", "code": "const { safeEqual } = require('../lib/booking');\nconst { csrfToken } = require('../middleware/csrf');\nfunction createAuthController(config) {\n  return {\n    checkSession(req, res) { res.json({ authenticated: req.session?.authenticated === true, user: req.session?.user || null }); },\n    login(req, res, next) {\n      const { username, password } = req.body || {};\n      if (typeof username !== 'string' || typeof password !== 'string' || !config.adminUser || !config.adminPass ||\n          !safeEqual(username, config.adminUser) || !safeEqual(password, config.adminPass)) {\n        return res.status(401).json({ error: 'Invalid staff credentials.' });\n      }\n      const customerSession = req.session.passport;\n      req.session.regenerate(error =\u003e {\n        if (error) return next(error);\n        if (customerSession) req.session.passport = customerSession;\n        req.session.authenticated = true;\n        req.session.user = config.adminUser;\n        const token = csrfToken(req);\n        req.session.save(saveError =\u003e saveError ? next(saveError) : res.json({ success: true, csrfToken: token }));\n      });\n    },\n    logout(req, res, next) {\n      req.session.destroy(error =\u003e {\n        if (error) return next(error);\n        res.clearCookie('kickoff.sid', { path: '/', httpOnly: true, sameSite: 'lax', secure: config.production });\n        res.json({ success: true });\n      });\n    }\n  };\n}\nmodule.exports = { createAuthController };\n"}, {"path": "server/lib/booking.js", "code": "const crypto = require('node:crypto');\nconst TIME_ZONE = 'Asia/Beirut';\nconst SLOTS = [\n  { label: '3:00 PM - 4:30 PM', start: '15:00', end: '16:30' },\n  { label: '4:30 PM - 6:00 PM', start: '16:30', end: '18:00' },\n  { label: '6:00 PM - 7:30 PM', start: '18:00', end: '19:30' },\n  { label: '7:30 PM - 9:00 PM', start: '19:30', end: '21:00' },\n  { label: '9:00 PM - 10:30 PM', start: '21:00', end: '22:30' },\n  { label: '10:30 PM - 12:00 AM', start: '22:30', end: '24:00' }\n];\nconst ALL_SLOTS = SLOTS.map(slot =\u003e slot.label);\nclass HttpError extends Error {\n  constructor(status, message) { super(message); this.status = status; }\n}\nfunction venueNow(now = new Date()) {\n  const parts = Object.fromEntries(new Intl.DateTimeFormat('en-CA', {\n    timeZone: TIME_ZONE, year: 'numeric', month: '2-digit', day: '2-digit',\n    hour: '2-digit', minute: '2-digit', hourCycle: 'h23'\n  }).formatToParts(now).map(part =\u003e [part.type, part.value]));\n  return { date: `${parts.year}-${parts.month}-${parts.day}`, time: `${parts.hour}:${parts.minute}` };\n}\nfunction dateValue(value) {\n  if (typeof value !== 'string' || !/^\\d{4}-\\d{2}-\\d{2}$/.test(value)) throw new HttpError(400, 'Use a valid date in YYYY-MM-DD format.');\n  const parsed = new Date(`${value}T12:00:00Z`);\n  if (!Number.isFinite(parsed.getTime()) || parsed.toISOString().slice(0, 10) !== value) throw new HttpError(400, 'Choose a valid calendar date.');\n  return value;\n}\nfunction addDays(date, days) {\n  const value = new Date(`${date}T12:00:00Z`);\n  value.setUTCDate(value.getUTCDate() + days);\n  return value.toISOString().slice(0, 10);\n}\nfunction dayOfWeek(date) { return new Date(`${dateValue(date)}T12:00:00Z`).getUTCDay(); }\nfunction text(value, label, max, required = true) {\n  if (value == null \u0026\u0026 !required) return '';\n  if (typeof value !== 'string') throw new HttpError(400, `${label} must be text.`);\n  const clean = value.trim();\n  if ((required \u0026\u0026 !clean) || clean.length \u003e max || /[\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f\\x7f]/.test(clean)) throw new HttpError(400, `${label} is required and must be at most ${max} characters.`);\n  return clean;\n}\nfunction phoneValue(value, required = true) {\n  const raw = text(value, 'Phone number', 40, required);\n  if (!raw \u0026\u0026 !required) return '';\n  if (!/^[+\\d\\s().-]+$/.test(raw)) throw new HttpError(400, 'Enter a valid phone number, including the country code for international numbers.');\n  let number = raw.replace(/[\\s().-]/g, '');\n  if (number.startsWith('00')) number = `+${number.slice(2)}`;\n  if (/^961\\d+$/.test(number)) number = `+${number}`;\n  if (/^0\\d{7}$/.test(number)) number = `+961${number.slice(1)}`;\n  else if (/^\\d{7,8}$/.test(number)) number = `+961${number}`;\n  if (!/^\\+[1-9]\\d{6,14}$/.test(number)) throw new HttpError(400, 'Enter a valid phone number, for example +961 3 696 325.');\n  return number;\n}\nfunction slotValue(value) {\n  const slot = SLOTS.find(item =\u003e item.label === value);\n  if (!slot) throw new HttpError(400, 'Choose one of the available 90-minute slots.');\n  return slot;\n}\nfunction futureSlot(date, slot, { maxDays = 365, now = new Date() } = {}) {\n  const current = venueNow(now);\n  if (date \u003c current.date || (date === current.date \u0026\u0026 slot.start \u003c= current.time)) throw new HttpError(400, 'This kickoff time has already passed.');\n  if (date \u003e addDays(current.date, maxDays)) throw new HttpError(400, `Bookings are available up to ${maxDays + 1} calendar days ahead.`);\n}\nfunction bookingInput(body = {}, { publicBooking = false, now } = {}) {\n  const name = text(body.name, 'Name', 120);\n  const phone = phoneValue(body.phone);\n  const date = dateValue(body.date);\n  const slot = slotValue(body.time);\n  const notes = text(body.notes, 'Notes', 1000, false);\n  futureSlot(date, slot, { maxDays: publicBooking ? 13 : 365, now });\n  return { name, phone, date, time: slot.label, slot, notes };\n}\nfunction standingInput(body = {}) {\n  const name = text(body.playerName, 'Player name', 120);\n  const phone = phoneValue(body.phone);\n  if (!Number.isInteger(body.dayOfWeek) || body.dayOfWeek \u003c 0 || body.dayOfWeek \u003e 6) throw new HttpError(400, 'Choose a valid day of the week.');\n  return { name, phone, day: body.dayOfWeek, slot: slotValue(body.time) };\n}\nfunction idValue(value) { return text(value, 'Reservation ID', 50); }\nfunction numericId(value) {\n  if (!/^[1-9]\\d*$/.test(String(value)) || !Number.isSafeInteger(Number(value))) throw new HttpError(400, 'Invalid recurring booking ID.');\n  return Number(value);\n}\nfunction safeEqual(a, b) {\n  const left = crypto.createHash('sha256').update(String(a)).digest();\n  const right = crypto.createHash('sha256').update(String(b)).digest();\n  return crypto.timingSafeEqual(left, right);\n}\nmodule.exports = { TIME_ZONE, SLOTS, ALL_SLOTS, HttpError, venueNow, dateValue, addDays, dayOfWeek, text, phoneValue, slotValue, futureSlot, bookingInput, standingInput, idValue, numericId, safeEqual };\n"}, {"path": "server/lib/tickets.js", "code": "const crypto = require('node:crypto');\nconst { HttpError, safeEqual } = require('./booking');\nfunction createTickets(secret) {\n  function sign(payload) { return crypto.createHmac('sha256', secret).update(`kickoff-ticket:v1:${payload}`).digest('base64url'); }\n  function token(id) {\n    const payload = Buffer.from(id, 'utf8').toString('base64url');\n    return `${payload}.${sign(payload)}`;\n  }\n  function verify(value) {\n    if (typeof value !== 'string' || value.length \u003e 180 || !/^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]{43}$/.test(value)) throw new HttpError(404, 'This match pass is invalid.');\n    const [payload, signature] = value.split('.');\n    if (!safeEqual(signature, sign(payload))) throw new HttpError(404, 'This match pass is invalid.');\n    const id = Buffer.from(payload, 'base64url').toString('utf8');\n    if (!id || id.length \u003e 50 || Buffer.from(id).toString('base64url') !== payload) throw new HttpError(404, 'This match pass is invalid.');\n    return id;\n  }\n  return { token, verify, url: id =\u003e `/ticket.html?token=${encodeURIComponent(token(id))}`, qrUrl: id =\u003e `/api/tickets/${token(id)}/qr.svg` };\n}\nmodule.exports = { createTickets };\n"}, {"path": "server/middleware/auth.js", "code": "function requireAuth(req, res, next) {\n  if (req.session?.authenticated === true) return next();\n  res.status(401).json({ error: 'Please sign in to the staff dashboard.', authenticated: false });\n}\nfunction requireUser(req, res, next) {\n  if (req.isAuthenticated?.() \u0026\u0026 req.user?.id) return next();\n  res.status(401).json({ error: 'Please sign in to view your account.' });\n}\nmodule.exports = { requireAuth, requireUser };\n"}, {"path": "server/middleware/csrf.js", "code": "const crypto = require('node:crypto');\nconst { safeEqual } = require('../lib/booking');\nfunction csrfToken(req) {\n  if (!req.session.csrfToken) req.session.csrfToken = crypto.randomBytes(32).toString('base64url');\n  return req.session.csrfToken;\n}\nfunction csrfProtection(config) {\n  return (req, res, next) =\u003e {\n    if (['GET', 'HEAD', 'OPTIONS'].includes(req.method)) return next();\n    const origin = req.get('origin');\n    const localOrigin = !config.production ? `${req.protocol}://${req.get('host')}` : null;\n    if (origin \u0026\u0026 origin !== config.origin \u0026\u0026 origin !== localOrigin) return res.status(403).json({ error: 'This request must come from the Kickoff website.' });\n    const provided = req.get('x-csrf-token');\n    if (!req.session.csrfToken || typeof provided !== 'string' || provided.length \u003e 100 || !safeEqual(provided, req.session.csrfToken)) {\n      return res.status(403).json({ error: 'Your session changed. Refresh the page and try again.', code: 'CSRF_INVALID' });\n    }\n    next();\n  };\n}\nmodule.exports = { csrfToken, csrfProtection };\n"}, {"path": "server/migrations/001_security_and_bookings.sql", "code": "CREATE TABLE IF NOT EXISTS users (\n  id SERIAL PRIMARY KEY, google_id VARCHAR(255) UNIQUE NOT NULL,\n  email VARCHAR(255) UNIQUE NOT NULL, name VARCHAR(255) NOT NULL,\n  phone VARCHAR(50), created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP\n);\nCREATE TABLE IF NOT EXISTS reservations (\n  id VARCHAR(50) PRIMARY KEY, name VARCHAR(255) NOT NULL, phone VARCHAR(50) NOT NULL,\n  date DATE NOT NULL, time VARCHAR(50) NOT NULL, end_time VARCHAR(50) NOT NULL,\n  notes TEXT, status VARCHAR(50) NOT NULL DEFAULT 'PENDING',\n  user_id INTEGER, starts_at TIMESTAMPTZ, ends_at TIMESTAMPTZ,\n  created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP\n);\nCREATE TABLE IF NOT EXISTS standing_bookings (\n  id SERIAL PRIMARY KEY, player_name VARCHAR(255) NOT NULL, phone VARCHAR(50),\n  day_of_week INTEGER NOT NULL, time VARCHAR(50) NOT NULL,\n  created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP\n);\nALTER TABLE reservations ADD COLUMN IF NOT EXISTS user_id INTEGER;\nALTER TABLE reservations ADD COLUMN IF NOT EXISTS starts_at TIMESTAMPTZ;\nALTER TABLE reservations ADD COLUMN IF NOT EXISTS ends_at TIMESTAMPTZ;\nALTER TABLE reservations ALTER COLUMN status SET DEFAULT 'PENDING';\nALTER TABLE reservations ALTER COLUMN status SET NOT NULL;\nUPDATE reservations AS r SET\n  starts_at = ((r.date + s.start_time::time) AT TIME ZONE 'Asia/Beirut'),\n  ends_at = ((r.date + s.end_time::time) AT TIME ZONE 'Asia/Beirut')\nFROM (VALUES\n  ('3:00 PM - 4:30 PM', '15:00', '16:30'),\n  ('4:30 PM - 6:00 PM', '16:30', '18:00'),\n  ('6:00 PM - 7:30 PM', '18:00', '19:30'),\n  ('7:30 PM - 9:00 PM', '19:30', '21:00'),\n  ('9:00 PM - 10:30 PM', '21:00', '22:30'),\n  ('10:30 PM - 12:00 AM', '22:30', '24:00')\n) AS s(label, start_time, end_time)\nWHERE r.time = s.label AND (r.starts_at IS NULL OR r.ends_at IS NULL);\nDO $$ BEGIN\n  IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'reservations_user_fk' AND conrelid = 'reservations'::regclass) THEN\n    ALTER TABLE reservations ADD CONSTRAINT reservations_user_fk FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE SET NULL;\n  END IF;\n  IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'reservations_status_check' AND conrelid = 'reservations'::regclass) THEN\n    ALTER TABLE reservations ADD CONSTRAINT reservations_status_check CHECK (status IN ('PENDING', 'CONFIRMED', 'CANCELLED'));\n  END IF;\n  IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'reservations_slot_check' AND conrelid = 'reservations'::regclass) THEN\n    ALTER TABLE reservations ADD CONSTRAINT reservations_slot_check CHECK (status = 'CANCELLED' OR time IN (\n      '3:00 PM - 4:30 PM', '4:30 PM - 6:00 PM', '6:00 PM - 7:30 PM',\n      '7:30 PM - 9:00 PM', '9:00 PM - 10:30 PM', '10:30 PM - 12:00 AM'));\n  END IF;\n  IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'standing_day_check' AND conrelid = 'standing_bookings'::regclass) THEN\n    ALTER TABLE standing_bookings ADD CONSTRAINT standing_day_check CHECK (day_of_week BETWEEN 0 AND 6);\n  END IF;\n  IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'standing_slot_check' AND conrelid = 'standing_bookings'::regclass) THEN\n    ALTER TABLE standing_bookings ADD CONSTRAINT standing_slot_check CHECK (time IN (\n      '3:00 PM - 4:30 PM', '4:30 PM - 6:00 PM', '6:00 PM - 7:30 PM',\n      '7:30 PM - 9:00 PM', '9:00 PM - 10:30 PM', '10:30 PM - 12:00 AM'));\n  END IF;\nEND $$;\nCREATE UNIQUE INDEX IF NOT EXISTS reservations_one_confirmed_slot ON reservations (date, time) WHERE status = 'CONFIRMED';\nCREATE UNIQUE INDEX IF NOT EXISTS standing_one_weekly_slot ON standing_bookings (day_of_week, time);\nCREATE INDEX IF NOT EXISTS reservations_user_date ON reservations (user_id, date DESC);\nCREATE INDEX IF NOT EXISTS reservations_status_date ON reservations (status, date);\nCREATE TABLE IF NOT EXISTS session (sid VARCHAR PRIMARY KEY, sess JSON NOT NULL, expire TIMESTAMP(6) NOT NULL);\nCREATE INDEX IF NOT EXISTS session_expire ON session (expire);\nCREATE TABLE IF NOT EXISTS audit_log (\n  id BIGSERIAL PRIMARY KEY, actor VARCHAR(255) NOT NULL,\n  action VARCHAR(80) NOT NULL, entity_id VARCHAR(50) NOT NULL,\n  created_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP\n);\nCREATE TABLE IF NOT EXISTS schema_migrations (version VARCHAR(100) PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP);\n"}, {"path": "server/package-lock.json", "code": "{\n  \"name\": \"kickoff-server\",\n  \"version\": \"2.3.0\",\n  \"lockfileVersion\": 3,\n  \"requires\": true,\n  \"packages\": {\n    \"\": {\n      \"name\": \"kickoff-server\",\n      \"version\": \"2.3.0\",\n      \"hasInstallScript\": true,\n      \"dependencies\": {\n        \"chart.js\": \"4.6.1\",\n        \"connect-pg-simple\": \"^10.0.0\",\n        \"dotenv\": \"^18.0.8\",\n        \"express\": \"^5.3.0\",\n        \"express-rate-limit\": \"^8.0.0\",\n        \"express-session\": \"^1.19.0\",\n        \"flatpickr\": \"4.6.13\",\n        \"helmet\": \"^8.3.0\",\n        \"passport\": \"^0.7.0\",\n        \"passport-google-oauth20\": \"^2.0.0\",\n        \"pg\": \"^8.23.1\",\n        \"qrcode\": \"^1.5.4\"\n      },\n      \"devDependencies\": {\n        \"@electric-sql/pglite\": \"^0.3.0\",\n        \"jsdom\": \"^26.0.0\"\n      },\n      \"engines\": {\n        \"node\": \"\u003e=22 \u003c25\"\n      }\n    },\n    \"node_modules/@asamuzakjp/css-color\": {\n      \"version\": \"3.2.0\",\n      \"resolved\": \"https://registry.npmjs.org/@asamuzakjp/css-color/-/css-color-3.2.0.tgz\",\n      \"integrity\": \"sha512-K1A6z8tS3XsmCMM86xoWdn7Fkdn9m6RSVtocUrJYIwZnFVkng/PvkEoWtOWmP+Scc6saYWHWZYbndEEXxl24jw==\",\n      \"dev\": true,\n      \"license\": \"MIT\",\n      \"dependencies\": {\n
