const entries=[{"path": ".github/dependabot.yml", "code": "version: 2\nupdates:\n  - package-ecosystem: npm\n    directory: /server\n    schedule:\n      interval: weekly\n    open-pull-requests-limit: 5\n"}, {"path": ".gitignore", "code": "# -----------------------------------------------------------------------------\r\n# Environment Variables \u0026 Secrets (CRITICAL SECURITY)\r\n# -----------------------------------------------------------------------------\r\n.env\r\n.env.local\r\n.env.development\r\n.env.test\r\n.env.production\r\n*.env\r\n\r\n# -----------------------------------------------------------------------------\r\n# Dependencies\r\n# -----------------------------------------------------------------------------\r\nnode_modules/\r\nserver/node_modules/\r\nclient/node_modules/\r\n\r\n# -----------------------------------------------------------------------------\r\n# Production \u0026 Build Outputs\r\n# -----------------------------------------------------------------------------\r\nbuild/\r\ndist/\r\nout/\r\n\r\n# -----------------------------------------------------------------------------\r\n# Logs \u0026 Debugging\r\n# -----------------------------------------------------------------------------\r\nlogs/\r\n*.log\r\nnpm-debug.log*\r\nyarn-debug.log*\r\nyarn-error.log*\r\n\r\n# -----------------------------------------------------------------------------\r\n# System \u0026 IDE / Text Editor Files\r\n# -----------------------------------------------------------------------------\r\n.DS_Store\r\nThumbs.db\r\n.vscode/\r\n.idea/\r\n*.swp\r\n\r\n# -----------------------------------------------------------------------------\r\n# Coverage \u0026 Temporary Cache\r\n# -----------------------------------------------------------------------------\r\n.cache/\r\ncoverage/\r\n.temp/\r\n\n!.env.example\n"}, {"path": "MOBILE_REVIEW.md", "code": "# Frontend review — 2.3.0\n\nThe original public/admin CSS, ticket CSS, particle/reveal code, ticket motion,\nchart configuration and booking selection delays are retained. Responsive styles\nare layered in `client/public/mobile.css`; shared keyboard, focus and login\ncontrols live in `client/public/ui.js`. The security backend remains in place.\nOptional Cloudflare integration is removed.\n\n## Coverage\n\n| Area | Screens and states reviewed |\n| --- | --- |\n| Customer access | Google/guest/staff choices, mobile navigation, sign-in error, local preview message |\n| Public site | Home, booking guide, gallery, location, terms, privacy, contact and support |\n| Booking | Dates, available/unavailable times, player details, confirmation dialog and receipt |\n| Account | Profile inputs, sign-out control, booking history, long contact/name values and pass links |\n| Staff login | Autofill labels, password visibility, loading, rejected credentials, connection failure and retry |\n| Staff dashboard | Schedule, statistics/chart, booking search/status toolbar, booking cards and weekly bookings |\n| Staff dialogs | Details, manual booking, weekly creation/editing and history confirmation |\n| Date pickers | Schedule and manual booking calendars, clamped horizontally and vertically to the visible screen |\n| Match pass | Long names/time ranges, normal scrolling, all export actions and saved PNG |\n\n## Verification\n\n- `cd server \u0026\u0026 npm test`: 34 passing automated checks. These cover the existing\n  security/database behavior, original animation/style contracts, safe rendering,\n  preview isolation, booking/staff flows and login recovery.\n- Chromium viewport matrix: 320×568, 360×780, 390×844, 430×932, 768×1024,\n  1024×768, 1440×900 and 844×390. Checks cover visible control bounds, document\n  width, open dialog bounds and navigation through the screens above.\n- Additional calendar and keyboard checks at 320×568, 390×844, 768×1024 and\n  844×390 cover popup bounds, initial field focus, reverse-tab wrapping and Escape.\n- A signed-pass fixture successfully downloads a 1080×1920 PNG. Long player\n  names wrap within the saved pass while ordinary names retain their original\n  single-line placement.\n\nBrowser checks use synthetic API responses and cached copies of the existing\nGoogle fonts. They do not create real bookings or contact Neon/Google OAuth.\nExternal gallery images and embedded map content are excluded from automated\nbrowser fixtures; their responsive containers are checked. This is browser\nviewport verification, not testing on physical iOS/Android devices. No live\nRender deployment or provider-account changes were performed.\n\n## Install and preview\n\nUse the whole project together; each HTML page needs the new CSS and helper.\nNo new npm dependencies, environment variables or database migrations are added\nby this frontend revision. Existing Render build/start settings stay the same.\n\n```bash\ncd server\nnpm ci\nnpm run preview\n```\n\nOpen `http://localhost:3000`. This visual preview requires no database or Google\ncredentials. Full production startup remains `node server.js` with the existing\nenvironment configuration. See `README.md` for the original security migration\ninstructions if that migration has not already been applied.\n"}, {"path": "README.md", "code": "# Kickoff — mobile layouts and clearer sign-in\n\nThis edition keeps the original dark/neon design, public and staff styles, particle/reveal animations, chart settings, selection delays, and animated stadium match pass. A separate `client/public/mobile.css` layer adapts the existing pages for phones, tablets and landscape screens. The security fixes remain in place. The optional Cloudflare integration has been removed.\n\n## Frontend changes in this edition\n\n- Responsive layouts across customer sign-in, home/gallery/location/guide, account/history, every booking step, terms/privacy/contact/support, staff sign-in, all three dashboard views, and all dialogs.\n- Clear customer choices: **Continue with Google**, **Continue as guest**, and a separate **Staff sign in** link. The top bar keeps sign-in/account access available on phones.\n- Staff login supports autofill, visible labels, show/hide password, a busy state, duplicate-submit prevention, readable errors and recovery after a failed connection.\n- Larger touch targets, 16px form inputs, linked labels, international phone formatting, safe-area spacing, zoom support and keyboard focus management.\n- Staff booking tables become labeled cards on phones; navigation, counters, chart headings and forms wrap within the screen.\n- Match passes scroll normally, long names/time ranges wrap, and export/share controls stay reachable. Decorative/export layers no longer enlarge the mobile viewport.\n\nUse the complete ZIP so every HTML page receives the new stylesheet and `ui.js` helper. No new environment variables, npm dependencies or database migrations are introduced by this frontend revision. Render build/start commands are unchanged.\n\nThis project uses plain HTML, CSS, JavaScript and canvas. Neither uploaded version imports Three.js, React Three Fiber/Drei, or Spline. No separate React client build is needed. If you installed these packages only for this project, you can remove them from your existing local client folder:\n\n```bash\ncd client\nnpm uninstall three @react-three/fiber @react-three/drei @splinetool/react-spline\n```\n\n## Start with a local visual preview\n\nNo database, Google account, or `.env` file is needed for this mode:\n\n```bash\ncd server\nnpm ci\nnpm run preview\n```\n\nEquivalent startup: `node server.js --preview`.\n\nOpen `http://localhost:3000`, choose **Continue as guest**, and browse the current design. The staff layout is available directly at `http://localhost:3000/admin/dashboard.html`.\n\nPreview binds to this computer only. Its availability is illustrative and its counters/tables are empty. Booking submissions, Google login and all changes are disabled. It refuses to start when the process environment has `NODE_ENV=production`. Normal `node server.js` starts the full application and requires the configuration and migration below.\n\n## Upgrade the existing Render / Neon deployment\n\nUse the complete project together, including the new scripts, shared frontend helper, migration, vendored assets and lockfile. The ZIP contains a `Kick-off-main` folder; inside it, `client`, `server` and `.github` belong at your repository root. Keep your real secrets in Render, outside Git.\n\n1. Create a Neon development branch or backup before altering production data. This update has not accessed your live database.\n2. Use that development branch to run the checks and migration first. Install dependencies from the `server` folder using `npm ci`. Copy `.env.example` to `.env` for local full-app testing and replace the placeholders with your own development values.\n3. Run:\n\n```bash\nnpm run db:check\nnpm run db:migrate\nnpm test\n```\n\n`db:check` is read-only. It reports duplicate confirmed slots, duplicate weekly slots, confirmed/weekly overlaps, and invalid active slots/statuses. Resolve the reported records before migrating. The migration stops on conflicts; it never chooses a booking to cancel or deletes customer records to resolve them.\n\nThe migration runs in one transaction and preserves existing users, reservation IDs and weekly bookings. It adds account ownership, slot timestamps, constraints, indexes, persistent sessions and an audit log. The supplied older `init.sql` did not create the `user_id` column already used by the application; the migration handles this safely. Existing deployments should use `db:migrate`, not rerun a fresh schema manually.\n\nMigration `001_security_and_bookings` is unchanged from the previous security package. If you already applied it successfully, this corrective edition needs no additional migration. Rerunning `db:migrate` is safe and reports that it is already applied. `db:check` reporting `ready: true` means the data passes preflight; it does not apply the migration. Startup now explains a missing migration instead of reporting only `42P01`.\n\n4. Plan production migration while the old application is not accepting booking writes. The old code does not participate in the new PostgreSQL booking lock. Run `db:check` and `db:migrate` against production with the schema owner's credentials, then deploy this complete version. Keep privileged migration credentials out of the running web service when using the restricted application role described below.\n5. In Render, use these settings if your root directory is `server`:\n\n| Setting | Value |\n| --- | --- |\n| Root Directory | `server` |\n| Build Command | `npm ci --omit=dev` |\n| Start Command | `node server.js` |\n| Health Check Path | `/healthz` |\n| Node version | Node 22 or 24 |\n\nThe install script copies pinned Chart.js and Flatpickr assets from the lockfile into the public vendor directory. The browser loads those files from your own server. No separate frontend build or frontend `npm install` is required.\n\n6. Keep the environment settings below in Render. Its native Node runtime normally sets `NODE_ENV=production`; verify the effective value.\n7. After deployment, test Google login, a guest request, staff approval, a signed match-pass link, a cancellation, and conflicting manual/weekly bookings. Check the live layout on desktop/mobile. These provider/browser checks require your configured deployment.\n\n## Environment variables\n\n| Name | Requirement |\n| --- | --- |\n| `DATABASE_URL` or `DB_URL` | Your Neon connection string. Use the restricted app role for the running service when configured. A pooled Neon URL is supported. |\n| `SESSION_SECRET` | Strong random secret, at least 32 characters; generate 32 random bytes as shown below. The old hard-coded fallback has been removed. |\n| `ADMIN_USER` | Your existing staff username. |\n| `ADMIN_PASS` | A strong unique password, at least 12 characters; a password manager generated value is preferred. |\n| `GOOGLE_CLIENT_ID` | Your existing Google OAuth client ID. |\n| `GOOGLE_CLIENT_SECRET` | Your existing Google OAuth client secret. Keep it server-side. |\n| `GOOGLE_CALLBACK_URL` | Exact HTTPS production callback ending in `/api/auth/google/callback`, also registered in Google's authorized redirect URIs. |\n| `NODE_ENV` | `production` on Render; `development` for local full-app work. |\n| `APP_URL` | Optional canonical public origin. Defaults to the callback origin. When set, it must use the same origin as the callback. |\n| `TICKET_SECRET` | Recommended separate random signing key, at least 32 characters. When absent, `SESSION_SECRET` signs passes. |\n| `BUSINESS_WHATSAPP` | Optional; defaults to `9613696325`, international digits without the domestic trunk zero. |\n\nGenerate a random key locally, then copy its output into the relevant private environment field:\n\n```bash\nnode -e \"console.log(require('node:crypto').randomBytes(32).toString('hex'))\"\n```\n\nRun it separately for the session and ticket keys. Do not commit the output. Example placeholders are rejected at startup. If you copy `.env.example`, replace its optional `TICKET_SECRET` placeholder too, or remove that line to use the documented fallback.\n\nFor local full-app testing, use:\n\n```env\nNODE_ENV=development\nPORT=3000\nAPP_URL=http://localhost:3000\nGOOGLE_CALLBACK_URL=http://localhost:3000/api/auth/google/callback\n```\n\nRegister the localhost callback in your Google development OAuth configuration. Then use `npm run dev` for automatic restarts or `node server.js` for normal startup.\n\nProduction PostgreSQL connections enforce `sslmode=verify-full`. Development connection strings using the old `prefer`, `require`, or `verify-ca` aliases are normalized to `verify-full`, retaining full certificate verification and avoiding the alias warning. The old `rejectUnauthorized: false` override is removed. For local PostgreSQL without TLS, use `sslmode=disable` only in development/test mode.\n\n## Restrict the Neon application role\n\nThis is a database-owner configuration step, not something the unprivileged web process can do for itself. Complete the migration first.\n\n1. Using an owner connection in Neon, create a dedicated login role called `kickoff_app` with a strong generated password, no database/schema ownership, no administrative attributes and no privileged role memberships. Keep that password private. Do not reuse an owner/admin account as the runtime role.\n2. Run `server/config/runtime-role.sql` as the owner. It grants only the table/sequence permissions the app needs, including INSERT-only access to its audit log and read-only access to the migration version. It checks that the role already has CONNECT access and cannot create objects in `public`.\n3. If CONNECT has previously been revoked, the owner should grant CONNECT on the specific application database to `kickoff_app`, then rerun the script. If PUBLIC/schema CREATE permissions are too broad, review and restrict them as the owner before rerunning. The helper deliberately does not revoke privileges from other roles or silently change shared database settings.\n4. Set Render's `DATABASE_URL` to this application's Neon connection string using the new role and password. Keep privileged migration credentials in a separate operator environment. Subsequent migrations run as the owner; the web process starts as the app role.\n\nThe automated database test verifies that this role can perform the required application operations while being unable to alter application tables or delete audit records.\n\n## Security behavior changes\n\n- Booking history is scoped to the authenticated `user_id`. A self-entered phone number is contact information, never ownership proof. Guest bookings remain accessible through their secure receipt link; historical phone-only records are not automatically claimed by accounts.\n- Customer/staff values use text nodes or HTML escaping within the original templates. Inline scripts and event-handler attributes are moved into local scripts; responsive refinements are layered over the original styles. Scripts run under a same-origin CSP; the original inline CSS is retained.\n- Tickets require an HMAC-signed link and retrieve the real reservation/status from the API. Old unsigned URL-field tickets fail closed. New booking responses include a secure pass URL and QR; account-owned bookings also show their secure Pass link in the existing account page. The authenticated staff reservations API returns `ticketUrl` for historical records; the original staff modal has not gained extra controls.\n- New booking references retain the original `RES-XXXXXX` display format using cryptographic randomness and collision retries. A reference alone never authorizes access to a booking or pass; signed links and authenticated account/staff ownership provide authorization.\n- Signed links are private bearer links. A recipient can see the player's name, slot and status, but not phone numbers or notes. Share them only with the intended player/facility. Referrer headers are disabled, and QR codes are generated by your own server.\n- A downloaded PNG/video is a snapshot, including its status at export time. Reopen the online secure pass to verify its current status. Status refreshes every 30 seconds while the pass is visible; unavailable verification disables the export controls.\n- Rotating the signing key invalidates old pass links. New links are available from the account page or authenticated staff API. Rotating the session key signs users out; keeping a separate stable ticket key avoids invalidating passes during session-key changes.\n- Public requests are PENDING and do not hold slots. Multiple requests may exist for one slot; only one can be confirmed. All booking/weekly changes use a shared transaction-scoped PostgreSQL advisory lock, plus uniqueness constraints for confirmed/weekly slots.\n- Named slots use the Beirut wall clock. The final slot can have a different elapsed duration during daylight-saving changes; migrated records retain their local schedule.\n- Sessions are stored in PostgreSQL, with a 24-hour cookie, production Secure, HttpOnly and SameSite=Lax attributes. Admin login rotates the session ID; logout destroys the session and clears the cookie.\n- Unsafe API methods require a session CSRF token and validate an incoming Origin header. Google OAuth uses state checking. Same-origin clients do not need permissive CORS headers.\n- Rate limits: 10 staff-login attempts/15 minutes, 8 public booking submissions/15 minutes, 180 general API requests/minute and 120 session-bootstrap requests/minute, per IP. These limits are per application instance. Use a shared rate-limit store or an appropriate edge limit before scaling across several Render instances. Sessions and booking conflict protection already use shared PostgreSQL storage.\n- Request bodies are limited to 16 KiB. Names, phones, notes, dates, slots, calendar horizon and past kickoff times are validated on the server. Staff API responses are paginated; the original staff table/timeline automatically retrieves the pages so its existing layout and full results are preserved. API responses are not cached; static assets can be cached.\n- Staff booking/weekly changes and cancelled-history deletion are written to `audit_log`. Operational errors log an identifier/code instead of full request bodies, ticket links or secrets.\n\n## Account/repository steps outside this ZIP\n\nThese require access to your provider accounts and were not performed by editing the source archive:\n\n- Enable MFA and appropriate collaborator access on GitHub, Render, Neon and staff Google accounts.\n- Review Git history/secret-scanning alerts for previous `.env` or credential commits. The corrected `.gitignore` prevents new untracked secret files from being added; it cannot erase old commits. Rotate credentials if they were exposed.\n- Keep backups/restore coverage appropriate to your Neon plan and test a restore before relying on it.\n- For several staff members, use individually attributable accounts/roles rather than sharing one configured operator password. This update retains your existing single-operator login.\n- Dependabot configuration is included in `.github/dependabot.yml`. Enable the relevant GitHub dependency/security features and review its updates. Reinstalling from an updated lockfile refreshes the local browser assets through `postinstall`.\n\n## Validation and maintenance\n\n```bash\ncd server\nnpm ci\nnpm test\nnpm audit\n```\n\nThe current suite has 34 passing checks covering missing credentials, session rotation/persistence, ownership, safe rendering, CSRF, OAuth state, signed/live tickets, rate limits, input validation, competing approvals, weekly conflicts, database constraints, reference collisions, TLS configuration, migration preservation/rollback/idempotency, Beirut date boundaries, restricted-role permissions, local asset hashes, preview isolation, and the retained public/admin interface flows.\n\nDatabase integration checks use an isolated PGlite PostgreSQL engine, and interface checks use JSDOM. They do not connect to your live Neon database or Google account. PGlite serializes embedded transactions; a live multi-connection load test was not performed. Chromium viewport checks cover the public views, booking flow, account, staff login/dashboard views and dialogs, and the signed pass at 320×568, 360×780, 390×844, 430×932, 768×1024, 1024×768, 1440×900 and 844×390. Browser fixtures use synthetic API data and cached copies of the existing Google fonts; external gallery images and map content are excluded. This verifies responsive browser behavior, not a physical iPhone/Android device or live OAuth/deployment. Source comparisons verify the unchanged original public/admin CSS, ticket CSS, required controls, particle/reveal code, ticket motion, chart settings and selection delays. Pass status text and export availability follow server verification as required by the security fix.\n\nDependencies are locked in `server/package-lock.json`. Run `npm audit` when installing or deploying and review any new advisories.\n\n`COPY_CODE.html` is an optional local file-copy viewer. Keep it at the project root, outside `client/public`. It contains source/documentation and is not part of the hosted website.\n"}, {"path": "client/package.json", "code": "{ \"name\": \"kickoff-client\", \"private\": true, \"type\": \"commonjs\" }\n"}, {"path": "client/public/admin/admin.css", "code": "/* ==========================================================================\r\n   PITCH OS — PREMIUM 3D GLASSMORPHISM DASHBOARD\r\n   ========================================================================== */\r\n\r\n:root {\r\n  --bg-core: #040705; \r\n  --bg-surface: rgba(255, 255, 255, 0.025);\r\n  --bg-surface-raised: rgba(255, 255, 255, 0.04);\r\n  --text-main: #FFFFFF;\r\n  --text-muted: #8E9BA0; \r\n  --accent: #00FF66;\r\n  --accent-glow: rgba(0, 255, 102, 0.15);\r\n  --danger: #E63946; \r\n  --danger-glow: rgba(230, 57, 70, 0.12);\r\n  --warning: #F4A261; \r\n  --disabled: #4A5559; \r\n  --font-display: 'Rajdhani', sans-serif;\r\n  --font-body: 'Inter', sans-serif;\r\n  --font-mono: 'Space Mono', monospace;\r\n  --shadow-soft: 0 10px 30px -10px rgba(0, 0, 0, 0.5);\r\n  --shadow-elevated: 0 20px 40px -10px rgba(0, 0, 0, 0.8);\r\n  --border-faint: rgba(255, 255, 255, 0.03);\r\n  --perspective: 1000px;\r\n  --transition-speed: 300ms;\r\n}\r\n\r\n* { box-sizing: border-box; margin: 0; padding: 0; }\r\n\r\nbody {\r\n  background: radial-gradient(circle at 50% -10%, rgba(0, 255, 102, 0.04) 0%, var(--bg-core) 60%), var(--bg-core);\r\n  color: var(--text-main);\r\n  font-family: var(--font-body);\r\n  min-height: 100vh;\r\n  -webkit-font-smoothing: antialiased;\r\n  overflow-x: hidden;\r\n}\r\n\r\n.dashboard-layout { display: flex; min-height: calc(100vh - 70px); }\r\n.dashboard-main { flex: 1; padding: 40px 48px; overflow-y: auto; perspective: var(--perspective); }\r\n\r\n.admin-topbar {\r\n  display: flex; justify-content: space-between; align-items: center; height: 70px;\r\n  padding: 0 32px;\r\n  background: linear-gradient(to bottom, rgba(4, 7, 5, 0.95) 0%, rgba(4, 7, 5, 0.7) 100%);\r\n  box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);\r\n  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);\r\n  position: sticky; top: 0; z-index: 50;\r\n  border-bottom: 1px solid var(--border-faint);\r\n}\r\n.logo-text { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; letter-spacing: 2px; }\r\n.facility-tag { margin-left: 16px; font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono); background: var(--bg-surface); padding: 4px 10px; border-radius: 4px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);}\r\n.operator-badge { font-size: 0.85rem; color: var(--text-muted); margin-right: 24px; font-weight: 500;}\r\n\r\n.dashboard-sidebar {\r\n  width: 280px;\r\n  background: rgba(0, 0, 0, 0.2); \r\n  border-right: 1px solid var(--border-faint);\r\n  box-shadow: 5px 0 30px rgba(0, 0, 0, 0.3);\r\n  padding: 32px 24px; display: flex; flex-direction: column; justify-content: flex-start; gap: 32px;\r\n}\r\n.sidebar-nav { display: flex; flex-direction: column; gap: 8px; flex: 1; }\r\n.nav-tab {\r\n  background: transparent; border: none; color: var(--text-muted); font-family: var(--font-body);\r\n  font-size: 0.95rem; font-weight: 500; padding: 14px 20px; text-align: left; cursor: pointer;\r\n  border-radius: 8px; transition: all var(--transition-speed) ease; position: relative;\r\n}\r\n.nav-tab:hover { color: var(--text-main); background: var(--bg-surface); transform: translateX(2px); }\r\n.nav-tab.active { \r\n  color: var(--text-main); background: linear-gradient(90deg, rgba(0, 255, 102, 0.05) 0%, transparent 100%); font-weight: 600;\r\n}\r\n.nav-tab.active::before {\r\n  content: ''; position: absolute; left: 0; top: 20%; bottom: 20%; width: 2px;\r\n  background: flex; flex-direction: column; gap: 12px; }\r\n.timeline-row {\r\n  display: flex; align-items: center; background: var(--bg-surface); padding: 18px 24px; border-radius: 10px; justify-content: space-between; \r\n  box-shadow: var(--shadow-soft); transition: transform var(--transition-speed) ease, background var(--transition-speed) ease; position: relative;\r\n}\r\n.timeline-row:hover { transform: translateY(-2px); background: var(--bg-surface-raised); }\r\n.timeline-row.occupied { background: linear-gradient(90deg, rgba(0, 255, 102, 0.02) 0%, var(--bg-surface) 100%); }\r\n.timeline-row.occupied::before { content: ''; position: absolute; left: 0; top: 15%; bottom: 15%; width: 3px; background: var(--accent); border-radius: 4px; }\r\n.timeline-row.vacant { opacity: 0.7; }\r\n.timeline-time { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; width: 180px; letter-spacing: -0.5px;}\r\n.timeline-meta { flex: 1; margin: 0 32px; }\r\n.timeline-player { font-weight: 600; font-size: 1.1rem; margin-bottom: 4px; letter-spacing: 0.3px;}\r\n.timeline-phone { color: var(--text-muted); font-family: var(--font-mono); font-size: 0.85rem; }\r\n\r\n.admin-input {\r\n  background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border-faint); color: var(--text-main);\r\n  padding: 12px 16px; border-radius: 8px; font-family: var(--font-body); font-size: 0.95rem; outline: none;\r\n  transition: all var(--transition-speed) ease; width: 100%;\r\n}\r\n.admin-input:focus { border-color: rgba(0, 255, 102, 0.4); background: rgba(0, 0, 0, 0.5); }\r\n.form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }\r\n.form-group label { font-size: 0.85rem; color: var(--text-muted); font-weight: 500;}\r\n.form-row { display: flex; gap: 24px; }\r\n.flex-1 { flex: 1; }\r\n\r\n.btn {\r\n  padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; border: none; cursor: pointer; \r\n  transition: all var(--transition-speed) ease; font-family: var(--font-body); display: inline-flex; justify-content: center; align-items: center; gap: 8px;\r\n}\r\n.btn-primary { background: var(--accent); color: #000; font-weight: 700; }\r\n.btn-primary:hover { transform: translateY(-2px); filter: brightness(1.05); }\r\n.btn-secondary { background: var(--bg-surface-raised); color: var(--text-main); }\r\n.btn-secondary:hover { background: rgba(255, 255, 255, 0.08); transform: translateY(-2px); }\r\n.btn-danger { background: var(--danger-glow); color: var(--danger); }\r\n.btn-danger:hover { background: rgba(230, 57, 70, 0.2); transform: translateY(-2px); }\r\n.btn-ghost { background: transparent; color: var(--text-muted); }\r\n.btn-ghost:hover { color: var(--text-main); background: var(--bg-surface); }\r\n.btn-sm { padding: 8px 16px; font-size: 0.85rem; }\r\n.w-full { width: 100%; }\r\n\r\n.modal-overlay {\r\n  position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);\r\n  display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity var(--transition-speed) ease;\r\n}\r\n.modal-overlay.active { opacity: 1; pointer-events: auto; }\r\n.modal-card { \r\n  background: rgba(7, 10, 8, 0.95); border: 1px solid rgba(255, 255, 255, 0.03); \r\n  border-radius: 16px; width: 100%; max-width: 520px; padding: 32px; \r\n  transform: translateY(20px); transition: transform 0.4s ease;\r\n}\r\n.modal-overlay.active .modal-card { transform: translateY(0); }\r\n.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px;}\r\n.close-btn { background: none; border: none; font-size: 1.8rem; color: var(--text-muted); cursor: pointer;}\r\n.close-btn:hover { color: var(--text-main); }\r\n.mt-16 { margin-top: 16px; }\r\n\r\n.status-pill { padding: 4px 10px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.5px; }\r\n.status-pill.CONFIRMED { background: rgba(0, 255, 102, 0.1); color: var(--accent); }\r\n.status-pill.CANCELLED { background: rgba(230, 57, 70, 0.1); color: var(--danger); }\r\n.status-pill.PENDING { background: rgba(244, 162, 97, 0.1); color: var(--warning); }\r\n.status-pill.UNKNOWN { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); }\r\n\r\n.auth-body { display: flex; align-items: center; justify-content: center; height: 100vh; }\r\n.login-card { width: 100%; max-width: 420px; padding: 48px 40px; background: rgba(10, 15, 12, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.02); border-radius: 16px; }\r\n.badge { font-family: var(--font-display); font-size: 0.75rem; color: var(--accent); letter-spacing: 2px; font-weight: 700; margin-bottom: 12px; display: inline-block; padding: 4px 10px; background: var(--accent-glow); border-radius: 4px;}\r\n.logo-title { font-family: var(--font-display); font-size: 2.5rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 4px;}\r\n.subtitle { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 32px; }\r\n\r\n/* Custom Scrollbar */\r\n::-webkit-scrollbar { width: 6px; height: 6px; }\r\n::-webkit-scrollbar-track { background: transparent; }\r\n::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 10px; }\r\n::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.15); }\r\n\r\n/* ==========================================================================\r\n   PITCH OS: PREMIUM LIGHT MODE OVERHAUL\r\n   ========================================================================== */\r\n[data-theme=\"light\"] {\r\n  /* Core Colors */\r\n  --bg-core: #F4F7F6;         /* Soft, cool off-white for the deep background */\r\n  --bg-surface: #FFFFFF;      /* Pure white for cards */\r\n  --bg-surface-raised: #FAFCFB; \r\n  --surface-border: #E2E8E5;  /* Crisp, subtle borders */\r\n  \r\n  /* Text */\r\n  --text-main: #111814;       /* Near black for high legibility */\r\n  --text-muted: #5C6B62;      /* Slate green-gray for secondary text */\r\n  \r\n  /* Accents */\r\n  --accent: #00A650;          /* Vibrant, legible green */\r\n  --accent-glow: rgba(0, 166, 80, 0.15);\r\n  --danger: #DE2839;\r\n  --danger-glow: rgba(222, 40, 57, 0.12);\r\n  --warning: #E87A00;\r\n  \r\n  /* Shadows \u0026 Depth */\r\n  --shadow-soft: 0 4px 12px rgba(0, 0, 0, 0.03);\r\n  --shadow-elevated: 0 12px 28px rgba(0, 0, 0, 0.06);\r\n  --border-faint: #E2E8E5;\r\n}\r\n\r\n/* 1. Base \u0026 Layout Overrides */\r\n[data-theme=\"light\"] body { \r\n  background: radial-gradient(circle at 50% 0%, #FFFFFF 0%, var(--bg-core) 100%);\r\n  color: var(--text-main);\r\n}\r\n\r\n/* 2. Topbar \u0026 Sidebar (Fixing the dark elements) */\r\n[data-theme=\"light\"] .admin-topbar {\r\n  background: rgba(255, 255, 255, 0.85); /* Light frosted glass */\r\n  border-bottom: 1px solid var(--surface-border);\r\n  box-shadow: 0 4px 20px rgba(0,0,0,0.02);\r\n}\r\n[data-theme=\"light\"] .facility-tag {\r\n  background: var(--bg-core);\r\n  color: var(--text-main);\r\n  border: 1px solid var(--surface-border);\r\n  box-shadow: none;\r\n}\r\n[data-theme=\"light\"] .dashboard-sidebar {\r\n  background: rgba(255, 255, 255, 0.5);\r\n  border-right: 1px solid var(--surface-border);\r\n  box-shadow: none;\r\n}\r\n\r\n/* 3. Navigation Tabs */\r\n[data-theme=\"light\"] .nav-tab:hover { \r\n  background: #FFFFFF; \r\n  box-shadow: 0 2px 8px rgba(0,0,0,0.02); \r\n}\r\n[data-theme=\"light\"] .nav-tab.active { \r\n  background: linear-gradient(90deg, rgba(0, 166, 80, 0.06) 0%, transparent 100%);\r\n  color: var(--accent);\r\n}\r\n\r\n/* 4. Cards \u0026 Modals */\r\n[data-theme=\"light\"] .login-card, \r\n[data-theme=\"light\"] .dashboard-card, \r\n[data-theme=\"light\"] .stat-card,\r\n[data-theme=\"light\"] .modal-card,\r\n[data-theme=\"light\"] .table-card {\r\n  background: var(--bg-surface);\r\n  border: 1px solid var(--surface-border);\r\n  box-shadow: var(--shadow-soft);\r\n}\r\n[data-theme=\"light\"] .stat-card:hover {\r\n  box-shadow: var(--shadow-elevated);\r\n  border-color: rgba(0, 166, 80, 0.2);\r\n}\r\n\r\n/* 5. Tables \u0026 Inputs */\r\n[data-theme=\"light\"] .admin-input, \r\n[data-theme=\"light\"] select {\r\n  background: var(--bg-surface-raised);\r\n  color: var(--text-main);\r\n  border: 1px solid var(--surface-border);\r\n  box-shadow: inset 0 2px 4px rgba(0,0,0,0.01);\r\n}\r\n[data-theme=\"light\"] .admin-input:focus { \r\n  border-color: var(--accent); \r\n  background: #FFF; \r\n  box-shadow: inset 0 2px 4px rgba(0,0,0,0.01), 0 0 0 3px var(--accent-glow);\r\n}\r\n[data-theme=\"light\"] th { background: var(--bg-surface-raised); color: var(--text-muted); border-bottom: 2px solid var(--surface-border); }\r\n[data-theme=\"light\"] td { color: var(--text-main); border-bottom: 1px solid var(--surface-border); }\r\n[data-theme=\"light\"] .admin-table tbody tr:hover { background: var(--bg-surface-raised); }\r\n\r\n/* 6. Timeline Rows */\r\n[data-theme=\"light\"] .timeline-row { \r\n  background: var(--bg-surface); \r\n  border: 1px solid var(--surface-border); \r\n  box-shadow: var(--shadow-soft);\r\n}\r\n[data-theme=\"light\"] .timeline-row.occupied { \r\n  background: linear-gradient(90deg, rgba(0, 166, 80, 0.04) 0%, var(--bg-surface) 100%); \r\n}\r\n[data-theme=\"light\"] .timeline-row:hover { \r\n  background: var(--bg-surface-raised); \r\n  box-shadow: var(--shadow-elevated); \r\n}\r\n\r\n/* 7. Buttons (White text on green looks much cleaner in light mode) */\r\n[data-theme=\"light\"] .btn-primary { \r\n  color: #FFFFFF; \r\n  box-shadow: 0 4px 12px var(--accent-glow); \r\n}\r\n[data-theme=\"light\"] .btn-secondary { \r\n  border: 1px solid var(--surface-border); \r\n  color: var(--text-main); \r\n  background: var(--bg-surface); \r\n  box-shadow: var(--shadow-soft);\r\n}\r\n[data-theme=\"light\"] .btn-secondary:hover { \r\n  background: var(--bg-surface-raised); \r\n  border-color: #C0C8C4; \r\n}\r\n[data-theme=\"light\"] .btn-danger { \r\n  border: none; \r\n  color: white; \r\n  background: var(--danger); \r\n  box-shadow: 0 4px 12px var(--danger-glow); \r\n}\r\n\r\n/* 8. Fix stray text colors */\r\n[data-theme=\"light\"] h2, \r\n[data-theme=\"light\"] h3, \r\n[data-theme=\"light\"] p { color: inherit; }\r\n\r\n/* =========================================\r\n   GLOWING ADMIN LOGIN UI\r\n   ========================================= */\r\n\r\n.login-box {\r\n  position: absolute;\r\n  top: 50%;\r\n  left: 50%;\r\n  width: 100%;\r\n  max-width: 400px;\r\n  padding: 48px 40px;\r\n  transform: translate(-50%, -50%);\r\n  background: rgba(5, 7, 8, 0.85); /* Kickoff dark surface */\r\n  box-sizing: border-box;\r\n  box-shadow: 0 15px 40px rgba(0,0,0,0.8);\r\n  border-radius: 12px;\r\n  border: 1px solid var(--surface-border);\r\n  backdrop-filter: blur(12px);\r\n  z-index: 100;\r\n}\r\n\r\n.login-box h2 {\r\n  margin: 0 0 40px;\r\n  padding: 0;\r\n  color: #fff;\r\n  text-align: center;\r\n}\r\n\r\n.login-box .user-box {\r\n  position: relative;\r\n}\r\n\r\n.login-box .user-box input {\r\n  width: 100%;\r\n  padding: 10px 0;\r\n  font-size: 16px;\r\n  color: #fff;\r\n  margin-bottom: 35px;\r\n  border: none;\r\n  border-bottom: 1px solid var(--text-dim);\r\n  outline: none;\r\n  background: transparent;\r\n  font-family: var(--font-body);\r\n}\r\n\r\n.login-box .user-box label {\r\n  position: absolute;\r\n  top: 0;\r\n  left: 0;\r\n  padding: 10px 0;\r\n  font-size: 16px;\r\n  color: var(--text-dim);\r\n  pointer-events: none;\r\n  transition: .4s cubic-bezier(0.2, 0.8, 0.2, 1);\r\n  font-family: var(--font-body);\r\n}\r\n\r\n.login-box .user-box input:focus ~ label,\r\n.login-box .user-box input:valid ~ label {\r\n  top: -24px;\r\n  left: 0;\r\n  color: var(--accent);\r\n  font-size: 12px;\r\n  letter-spacing: 1px;\r\n  text-transform: uppercase;\r\n  font-weight: 600;\r\n}\r\n\r\n.login-box .user-box input:focus {\r\n  border-bottom-color: var(--accent);\r\n}\r\n\r\n/* Neon Submit Button */\r\n.neon-submit {\r\n  position: relative;\r\n  display: block;\r\n  width: 100%;\r\n  padding: 16px 20px;\r\n  color: var(--accent);\r\n  font-size: 1.1rem;\r\n  text-decoration: none;\r\n  text-transform: uppercase;\r\n  overflow: hidden;\r\n  transition: .5s;\r\n  margin-top: 10px;\r\n  letter-spacing: 4px;\r\n  background: transparent;\r\n  border: none;\r\n  cursor: pointer;\r\n  font-family: var(--font-display);\r\n  font-weight: 700;\r\n}\r\n\r\n.neon-submit:hover {\r\n  background: var(--accent);\r\n  color: #000;\r\n  border-radius: 6px;\r\n  box-shadow: 0 0 5px var(--accent),\r\n              0 0 25px var(--accent-dim),\r\n              0 0 50px var(--accent-dim),\r\n              0 0 100px var(--accent-dim);\r\n}\r\n\r\n.neon-submit span {\r\n  position: absolute;\r\n  display: block;\r\n}\r\n\r\n.neon-submit span:nth-child(1) {\r\n  top: 0; left: -100%; width: 100%; height: 2px;\r\n  background: linear-gradient(90deg, transparent, var(--accent));\r\n  animation: btn-anim1 1s linear infinite;\r\n}\r\n@keyframes btn-anim1 { 0% { left: -100%; } 50%,100% { left: 100%; } }\r\n\r\n.neon-submit span:nth-child(2) {\r\n  top: -100%; right: 0; width: 2px; height: 100%;\r\n  background: linear-gradient(180deg, transparent, var(--accent));\r\n  animation: btn-anim2 1s linear infinite; animation-delay: .25s;\r\n}\r\n@keyframes btn-anim2 { 0% { top: -100%; } 50%,100% { top: 100%; } }\r\n\r\n.neon-submit span:nth-child(3) {\r\n  bottom: 0; right: -100%; width: 100%; height: 2px;\r\n  background: linear-gradient(270deg, transparent, var(--accent));\r\n  animation: btn-anim3 1s linear infinite; animation-delay: .5s;\r\n}\r\n@keyframes btn-anim3 { 0% { right: -100%; } 50%,100% { right: 100%; } }\r\n\r\n.neon-submit span:nth-child(4) {\r\n  bottom: -100%; left: 0; width: 2px; height: 100%;\r\n  background: linear-gradient(360deg, transparent, var(--accent));\r\n  animation: btn-anim4 1s linear infinite; animation-delay: .75s;\r\n}\r\n@keyframes btn-anim4 { 0% { bottom: -100%; } 50%,100% { bottom: 100%; } }"}, {"path": "client/public/admin/admin.js", "code": "document.addEventListener('DOMContentLoaded', async () =\u003e {\r\n\r\n  const authCheck = await window.Kickoff.fetch('/api/admin/check-session');\r\n  const authData = await authCheck.json();\r\n  if (!authData.authenticated) {\r\n    window.location.href = '/admin/index.html';\r\n    return;\r\n  }\r\n  document.getElementById('operatorName').textContent = authData.user;\r\n\r\n  let currentDate = window.Kickoff.today();\r\n  document.getElementById('scheduleDateInput').value = currentDate;\r\n  document.getElementById('mDate').value = currentDate;\r\n\r\n  function escapeHTML(value) {\r\n    return String(value ?? '').replace(/[\u0026\u003c\u003e\"']/g, (char) =\u003e ({\r\n      '\u0026': '\u0026amp;', '\u003c': '\u0026lt;', '\u003e': '\u0026gt;', '\"': '\u0026quot;', \"'\": '\u0026#039;'\r\n    }[char]));\r\n  }\r\n  \r\n  async function loadStats() {\r\n    const res = await window.Kickoff.fetch('/api/admin/dashboard-stats');\r\n    if (res.ok) {\r\n      const stats = await res.json();\r\n      document.getElementById('statToday').textContent = stats.todayMatches || 0;\r\n      document.getElementById('statPending').textContent = stats.pending || 0;\r\n      document.getElementById('statUpcoming').textContent = stats.upcoming || 0;\r\n      document.getElementById('statCancelled').textContent = stats.cancelled || 0;\r\n    }\r\n  }\r\n\r\n  let volumeChart = null;\r\n\r\n  async function loadAnalytics() {\r\n    try {\r\n      const res = await window.Kickoff.fetch('/api/admin/analytics');\r\n      const data = await res.json();\r\n      if (!data.analytics) return;\r\n\r\n      // Create an empty 30-day timeline\r\n      const labels = [];\r\n      const dataMap = {};\r\n      const today = new Date();\r\n      \r\n      for (let i = 29; i \u003e= 0; i--) {\r\n        const d = new Date(today);\r\n        d.setDate(d.getDate() - i);\r\n        const dateStr = d.toISOString().split('T')[0];\r\n        // Format label as \"Oct 24\"\r\n        labels.push(d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));\r\n        dataMap[dateStr] = 0; // Default to 0 matches\r\n      }\r\n\r\n      // Fill in actual booking counts\r\n      data.analytics.forEach(row =\u003e {\r\n        if (dataMap[row.date] !== undefined) {\r\n          dataMap[row.date] = row.count;\r\n        }\r\n      });\r\n\r\n      const chartData = Object.values(dataMap);\r\n\r\n      const ctx = document.getElementById('analyticsChart').getContext('2d');\r\n      \r\n      // Destroy old chart if reloading\r\n      if (volumeChart) volumeChart.destroy();\r\n\r\n      // Create glowing gradient fill\r\n      const gradient = ctx.createLinearGradient(0, 0, 0, 250);\r\n      gradient.addColorStop(0, 'rgba(0, 255, 102, 0.4)');\r\n      gradient.addColorStop(1, 'rgba(0, 255, 102, 0.0)');\r\n\r\n      volumeChart = new Chart(ctx, {\r\n        type: 'line',\r\n        data: {\r\n          labels: labels,\r\n          datasets: [{\r\n            label: 'Confirmed Bookings',\r\n            data: chartData,\r\n            borderColor: '#00FF66',\r\n            backgroundColor: gradient,\r\n            borderWidth: 3,\r\n            pointBackgroundColor: '#050708',\r\n            pointBorderColor: '#00FF66',\r\n            pointBorderWidth: 2,\r\n            pointRadius: 4,\r\n            pointHoverRadius: 6,\r\n            fill: true,\r\n            tension: 0.4 // Makes the line smooth and curvy\r\n          }]\r\n        },\r\n        options: {\r\n          responsive: true,\r\n          maintainAspectRatio: false,\r\n          plugins: { legend: { display: false } },\r\n          scales: {\r\n            y: { \r\n              beginAtZero: true, \r\n              ticks: { stepSize: 1, color: '#738078', font: { family: 'Space Mono' } },\r\n              grid: { color: 'rgba(255, 255, 255, 0.05)' }\r\n            },\r\n            x: { \r\n              ticks: { color: '#738078', font: { family: 'Inter' }, maxTicksLimit: 10 },\r\n              grid: { display: false }\r\n            }\r\n          }\r\n        }\r\n      });\r\n    } catch (err) {\r\n      console.error(\"Chart load failed:\", err);\r\n    }\r\n  }\r\n\r\n  async function loadTimeline() {\r\n    const grid = document.getElementById('timelineGrid');\r\n    grid.innerHTML = '\u003cdiv style=\"color:var(--text-muted)\"\u003eQuerying schedule...\u003c/div\u003e';\r\n\r\n    const [availRes, fullData] = await Promise.all([\r\n      window.Kickoff.fetch(`/api/availability?date=${currentDate}`),\r\n      window.Kickoff.allReservations({ date: currentDate })\r\n    ]);\r\n\r\n    const availData = await availRes.json();\r\n    const activeBookings = fullData.reservations.filter(r =\u003e ['CONFIRMED', 'PENDING'].includes(r.status));\r\n\r\n    grid.innerHTML = '';\r\n\r\n    availData.schedule.forEach(slot =\u003e {\r\n      const standardBooking = activeBookings.find(b =\u003e b.time === slot.time \u0026\u0026 b.status === 'CONFIRMED') || activeBookings.find(b =\u003e b.time === slot.time);\r\n      const isBlockedByVIP = !slot.available \u0026\u0026 !standardBooking;\r\n\r\n      const row = document.createElement('div');\r\n      \r\n      if (standardBooking) {\r\n        row.className = 'timeline-row occupied';\r\n        const statusColor = standardBooking.status === 'PENDING' ? '#FFB020' : 'var(--accent)';\r\n        row.innerHTML = `\r\n          \u003cdiv class=\"timeline-time\"\u003e${escapeHTML(slot.time)}\u003c/div\u003e\r\n          \u003cdiv class=\"timeline-meta\"\u003e\r\n            \u003cdiv class=\"timeline-player\" style=\"color: ${statusColor};\"\u003e${escapeHTML(standardBooking.name)} [${escapeHTML(standardBooking.status)}]\u003c/div\u003e\r\n            \u003cdiv class=\"timeline-phone\"\u003e${escapeHTML(standardBooking.phone)}\u003c/div\u003e \r\n          \u003c/div\u003e\r\n          \u003cbutton class=\"btn btn-secondary btn-sm\" data-action=\"openDetailsModal\" data-value=\"${escapeHTML(standardBooking.id)}\"\u003eManage\u003c/button\u003e\r\n        `;\r\n      } else if (isBlockedByVIP) {\r\n        row.className = 'timeline-row occupied';\r\n        row.innerHTML = `\r\n          \u003cdiv class=\"timeline-time\"\u003e${escapeHTML(slot.time)}\u003c/div\u003e\r\n          \u003cdiv class=\"timeline-meta\"\u003e\r\n            \u003cdiv class=\"timeline-player\" style=\"color: var(--accent);\"\u003eVIP FIXED BOOKING\u003c/div\u003e\r\n            \u003cdiv class=\"timeline-phone\"\u003eManage in Fixed Bookings tab\u003c/div\u003e\r\n          \u003c/div\u003e\r\n          \u003cbutton class=\"btn btn-secondary btn-sm\" disabled\u003eLocked\u003c/button\u003e\r\n        `;\r\n      } else {\r\n        row.className = 'timeline-row vacant';\r\n        row.innerHTML = `\r\n          \u003cdiv class=\"timeline-time\"\u003e${escapeHTML(slot.time)}\u003c/div\u003e\r\n          \u003cdiv class=\"timeline-meta\"\u003e\u003cspan style=\"color:var(--text-muted)\"\u003eVacant Slot\u003c/span\u003e\u003c/div\u003e\r\n          \u003cbutton class=\"btn btn-primary btn-sm\" data-action=\"quickBook\" data-value=\"${escapeHTML(slot.time)}\"\u003e+ Book\u003c/button\u003e\r\n        `;\r\n      }\r\n      grid.appendChild(row);\r\n    });\r\n  }\r\n\r\n  async function loadReservationsList() {\r\n    const tbody = document.getElementById('reservationsTableBody');\r\n    const search = document.getElementById('searchInput').value;\r\n    const status = document.getElementById('statusFilter').value;\r\n\r\n    const data = await window.Kickoff.allReservations({ search, status });\r\n\r\n    tbody.innerHTML = '';\r\n    if (data.reservations.length === 0) {\r\n      tbody.innerHTML = '\u003ctr\u003e\u003ctd colspan=\"6\" style=\"text-align:center; color:var(--text-muted)\"\u003eNo matching records found.\u003c/td\u003e\u003c/tr\u003e';\r\n      return;\r\n    }\r\n\r\n    const todayStr = window.Kickoff.today();\r\n\r\n    data.reservations.forEach(r =\u003e {\r\n      const tr = document.createElement('tr');\r\n      const safeStatus = ['PENDING', 'CONFIRMED', 'CANCELLED'].includes(r.status) ? r.status : 'UNKNOWN';\r\n      \r\n      const isPast = r.date \u003c todayStr;\r\n      tr.style.opacity = isPast ? '0.55' : '1';\r\n      tr.style.filter = isPast ? 'grayscale(100%)' : 'none';\r\n\r\n      let actionHtml = '';\r\n      \r\n      if (isPast) {\r\n        actionHtml = `\u003cspan style=\"color: var(--text-muted); font-size: 0.85rem; font-family: var(--font-mono);\"\u003eARCHIVED\u003c/span\u003e`;\r\n      } else if (r.status === 'PENDING') {\r\n        actionHtml = `\r\n          \u003cbutton class=\"btn btn-sm\" style=\"background: var(--accent); color: #000; margin-right: 8px;\" data-action=\"confirmReservation\" data-value=\"${escapeHTML(r.id)}\"\u003eConfirm\u003c/button\u003e\r\n          \u003cbutton class=\"btn btn-danger btn-sm\" data-action=\"cancelReservation\" data-value=\"${escapeHTML(r.id)}\"\u003eCancel\u003c/button\u003e\r\n        `;\r\n      } else if (r.status === 'CONFIRMED') {\r\n        actionHtml = `\u003cbutton class=\"btn btn-secondary btn-sm\" data-action=\"openDetailsModal\" data-value=\"${escapeHTML(r.id)}\"\u003eInspect\u003c/button\u003e`;\r\n      } else {\r\n        actionHtml = `\u003cspan style=\"color: var(--text-muted); font-size: 0.8rem;\"\u003eCancelled\u003c/span\u003e`;\r\n      }\r\n\r\n      tr.innerHTML = `\r\n        \u003ctd data-label=\"Reference\" style=\"font-family:var(--font-mono); font-weight:700\"\u003e${escapeHTML(r.id)}\u003c/td\u003e\r\n        \u003ctd data-label=\"Customer\"\u003e\u003cstrong\u003e${escapeHTML(r.name)}\u003c/strong\u003e\u003c/td\u003e\r\n        \u003ctd data-label=\"Phone\"\u003e${escapeHTML(r.phone)}\u003c/td\u003e\r\n        \u003ctd data-label=\"Date \u0026 time\"\u003e${escapeHTML(r.date)} @ ${escapeHTML(r.time)}\u003c/td\u003e\r\n        \u003ctd data-label=\"Status\"\u003e\u003cspan class=\"status-pill ${safeStatus}\"\u003e${escapeHTML(safeStatus)}\u003c/span\u003e\u003c/td\u003e\r\n        \u003ctd data-label=\"Actions\" class=\"text-right\"\u003e\u003cdiv class=\"table-actions\"\u003e${actionHtml}\u003c/div\u003e\u003c/td\u003e\r\n      `;\r\n      tbody.appendChild(tr);\r\n    });\r\n  }\r\n\r\n  let searchTimer;\r\n  let currentFixedBookings = [];\r\n  async function loadFixedBookings() {\r\n    const tbody = document.getElementById('fixedBookingsTableBody');\r\n    if (!tbody) return;\r\n    const res = await window.Kickoff.fetch('/api/admin/standing-bookings');\r\n    const data = await res.json();\r\n    currentFixedBookings = data.standingBookings; \r\n\r\n    tbody.innerHTML = '';\r\n    if (data.standingBookings.length === 0) {\r\n      tbody.innerHTML = '\u003ctr\u003e\u003ctd colspan=\"5\" style=\"text-align:center; color:var(--text-muted)\"\u003eNo fixed VIP bookings active.\u003c/td\u003e\u003c/tr\u003e';\r\n      return;\r\n    }\r\n\r\n    const days = [\"Sunday\", \"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\", \"Saturday\"];\r\n    data.standingBookings.forEach(sb =\u003e {\r\n      const tr = document.createElement('tr');\r\n      tr.innerHTML = `\r\n        \u003ctd data-label=\"Reference\"\u003e${escapeHTML(sb.id)}\u003c/td\u003e\r\n        \u003ctd data-label=\"Team\"\u003e\u003cstrong style=\"color:var(--accent)\"\u003e${escapeHTML(sb.playerName)}\u003c/strong\u003e\u003c/td\u003e\r\n        \u003ctd data-label=\"Phone\"\u003e${escapeHTML(sb.phone || 'N/A')}\u003c/td\u003e\r\n        \u003ctd data-label=\"Weekly slot\"\u003eEvery \u003cstrong\u003e${escapeHTML(days[sb.dayOfWeek])}\u003c/strong\u003e @ ${escapeHTML(sb.time)}\u003c/td\u003e\r\n        \u003ctd data-label=\"Actions\" class=\"text-right\"\u003e\u003cdiv class=\"table-actions\"\u003e\r\n          \u003cbutton class=\"btn btn-secondary btn-sm\" data-action=\"openEditFixedModal\" data-value=\"${escapeHTML(sb.id)}\"\u003eEdit\u003c/button\u003e\r\n          \u003cbutton class=\"btn btn-danger btn-sm\" data-action=\"cancelFixedBooking\" data-value=\"${escapeHTML(sb.id)}\"\u003eRemove\u003c/button\u003e\r\n        \u003c/div\u003e\u003c/td\u003e\r\n      `;\r\n      tbody.appendChild(tr);\r\n    });\r\n  }\r\n\r\n  document.querySelectorAll('.nav-tab').forEach(tab =\u003e {\r\n    tab.addEventListener('click', () =\u003e {\r\n      document.querySelectorAll('.nav-tab').forEach(t =\u003e t.classList.remove('active'));\r\n      document.querySelectorAll('.content-view').forEach(v =\u003e v.classList.remove('active'));\r\n      tab.classList.add('active');\r\n      const targetView = tab.dataset.view;\r\n      document.getElementById(`view-${targetView}`).classList.add('active');\r\n\r\n      if (targetView === 'timeline') loadTimeline();\r\n      if (targetView === 'list') loadReservationsList();\r\n      if (targetView === 'fixed') loadFixedBookings();\r\n    });\r\n  });\r\n\r\n  document.getElementById('scheduleDateInput').addEventListener('change', (e) =\u003e { currentDate = e.target.value; loadTimeline(); });\r\n  if (document.getElementById('searchInput')) document.getElementById('searchInput').addEventListener('input', () =\u003e { clearTimeout(searchTimer); searchTimer = setTimeout(loadReservationsList, 250); });\r\n  \r\n  const filterStatus = document.getElementById('statusFilter');\r\n  const btnClearHistory = document.getElementById('btnClearHistory');\r\n  const clearHistoryModal = document.getElementById('clearHistoryModal');\r\n  \r\n  if (filterStatus) {\r\n    filterStatus.addEventListener('change', () =\u003e {\r\n      btnClearHistory.style.display = filterStatus.value === 'CANCELLED' ? 'inline-block' : 'none';\r\n      loadReservationsList();\r\n    });\r\n  }\r\n\r\n  if (btnClearHistory) {\r\n    btnClearHistory.addEventListener('click', () =\u003e clearHistoryModal.classList.add('active'));\r\n    document.getElementById('btnCancelClear').addEventListener('click', () =\u003e clearHistoryModal.classList.remove('active'));\r\n    document.getElementById('btnConfirmClear').addEventListener('click', async () =\u003e {\r\n      document.getElementById('btnConfirmClear').textContent = \"Clearing...\";\r\n      const response = await window.Kickoff.fetch('/api/admin/reservations/cancelled', { method: 'DELETE' });\r\n      if (!response.ok) { alert((await response.json()).error || 'Could not clear history.'); document.getElementById('btnConfirmClear').textContent = 'Yes, Delete'; return; }\r\n      clearHistoryModal.classList.remove('active');\r\n      document.getElementById('btnConfirmClear').textContent = \"Yes, Delete\";\r\n      loadReservationsList(); loadStats();\r\n    });\r\n  }\r\n\r\n  window.openDetailsModal = async (id) =\u003e {\r\n    const res = await window.Kickoff.fetch(`/api/admin/reservations?search=${encodeURIComponent(id)}`);\r\n    const data = await res.json();\r\n    const item = data.reservations.find(r =\u003e r.id === id);\r\n    if (!item) return;\r\n\r\n    document.getElementById('dRef').textContent = `RESERVATION #${item.id}`;\r\n    document.getElementById('detailsContent').innerHTML = `\r\n      \u003cdiv style=\"margin-bottom:16px;\"\u003e\r\n        \u003cspan style=\"color:var(--text-muted); font-size:0.8rem\"\u003ePLAYER\u003c/span\u003e\r\n        \u003cdiv style=\"font-size:1.2rem; font-weight:700\"\u003e${escapeHTML(item.name)}\u003c/div\u003e\r\n        \u003cdiv style=\"color:var(--text-muted); font-family:var(--font-mono)\"\u003e${escapeHTML(item.phone)}\u003c/div\u003e\r\n      \u003c/div\u003e\r\n      \u003cdiv\u003e\r\n        \u003cspan style=\"color:var(--text-muted); font-size:0.8rem\"\u003eSESSION\u003c/span\u003e\r\n        \u003cdiv\u003e${escapeHTML(item.date)} (${escapeHTML(item.time)})\u003c/div\u003e  \r\n      \u003c/div\u003e\r\n    `;\r\n\r\n    const actions = document.getElementById('detailsActions');\r\n    if (item.status === 'PENDING') {\r\n      actions.innerHTML = `\r\n        \u003cbutton class=\"btn w-full\" style=\"background: var(--accent); color: #000; margin-bottom: 8px;\" data-action=\"confirmReservation\" data-value=\"${escapeHTML(item.id)}\"\u003eApprove Pending Slot\u003c/button\u003e\r\n        \u003cbutton class=\"btn btn-danger w-full\" data-action=\"cancelReservation\" data-value=\"${escapeHTML(item.id)}\"\u003eReject \u0026 Release Slot\u003c/button\u003e\r\n      `;\r\n    } else if (item.status === 'CONFIRMED') {\r\n      actions.innerHTML = `\u003cbutton class=\"btn btn-danger w-full\" data-action=\"cancelReservation\" data-value=\"${escapeHTML(item.id)}\"\u003eCancel Reservation \u0026 Release Slot\u003c/button\u003e`;\r\n    } else {\r\n      actions.innerHTML = `\u003cbutton class=\"btn btn-secondary w-full\" disabled\u003eReservation is Cancelled\u003c/button\u003e`;\r\n    }\r\n    document.getElementById('detailsModal').classList.add('active');\r\n  };\r\n\r\n  window.confirmReservation = async (id) =\u003e {\r\n    const response = await window.Kickoff.fetch(`/api/admin/reservations/${encodeURIComponent(id)}/confirm`, { method: 'PATCH' });\r\n    if (!response.ok) { alert((await response.json()).error || 'Confirmation failed.'); return; }\r\n    document.getElementById('detailsModal').classList.remove('active');\r\n    loadStats(); loadTimeline(); loadReservationsList();\r\n  };\r\n\r\n  window.cancelReservation = async (id) =\u003e {\r\n    if (!confirm(`Are you sure you want to cancel ${id}? The slot will immediately open for customers.`)) return;\r\n    const response = await window.Kickoff.fetch(`/api/admin/reservations/${encodeURIComponent(id)}/cancel`, { method: 'PATCH' });\r\n    if (!response.ok) { alert((await response.json()).error || 'Cancellation failed.'); return; }\r\n    document.getElementById('detailsModal').classList.remove('active');\r\n    loadStats(); loadTimeline(); loadReservationsList();\r\n  };\r\n\r\n  window.cancelFixedBooking = async (id) =\u003e {\r\n    if (!confirm(`Are you sure you want to delete this Fixed Booking?`)) return;\r\n    const response = await window.Kickoff.fetch(`/api/admin/standing-bookings/${encodeURIComponent(id)}`, { method: 'DELETE' });\r\n    if (!response.ok) { alert((await response.json()).error || 'Removal failed.'); return; }\r\n    loadFixedBookings(); loadTimeline();\r\n  };\r\n\r\n  window.openEditFixedModal = (id) =\u003e {\r\n    const item = currentFixedBookings.find(sb =\u003e String(sb.id) === String(id));\r\n    if (!item) return;\r\n    document.getElementById('editFId').value = item.id;\r\n    document.getElementById('editFName').value = item.playerName;\r\n    document.getElementById('editFPhone').value = item.phone || '';\r\n    document.getElementById('editFDay').value = item.dayOfWeek;\r\n    document.getElementById('editFTime').value = item.time;\r\n    document.getElementById('editFixedModal').classList.add('active');\r\n  };\r\n\r\n  window.quickBook = (time) =\u003e {\r\n    document.getElementById('mTime').value = time;\r\n    document.getElementById('mDate').value = currentDate;\r\n    document.getElementById('createModal').classList.add('active');\r\n  };\r\n\r\n  document.querySelectorAll('[data-close]').forEach(btn =\u003e {\r\n    btn.addEventListener('click', (e) =\u003e {\r\n      document.getElementById(e.target.dataset.close).classList.remove('active');\r\n    });\r\n  });\r\n\r\n  document.getElementById('manualBookingForm').addEventListener('submit', async (e) =\u003e {\r\n    e.preventDefault();\r\n    const payload = {\r\n      name: document.getElementById('mName').value, phone: document.getElementById('mPhone').value,\r\n      date: document.getElementById('mDate').value, time: document.getElementById('mTime').value\r\n    };\r\n    const res = await window.Kickoff.fetch('/api/admin/reservations', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });\r\n    if (res.ok) {\r\n      document.getElementById('createModal').classList.remove('active');\r\n      document.getElementById('manualBookingForm').reset();\r\n      loadStats(); loadTimeline(); loadReservationsList();\r\n    } else alert((await res.json()).error || 'The booking could not be saved.');\r\n  });\r\n\r\n  document.getElementById('fixedBookingForm').addEventListener('submit', async (e) =\u003e {\r\n    e.preventDefault();\r\n    const payload = {\r\n      playerName: document.getElementById('fName').value.trim(), phone: document.getElementById('fPhone').value.trim(),\r\n      dayOfWeek: Number(document.getElementById('fDay').value), time: document.getElementById('fTime').value\r\n    };\r\n    const res = await window.Kickoff.fetch('/api/admin/standing-bookings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });\r\n    if (res.ok) {\r\n      document.getElementById('fixedModal').classList.remove('active');\r\n      document.getElementById('fixedBookingForm').reset();\r\n      loadFixedBookings(); loadTimeline();\r\n    } else alert((await res.json()).error || 'The weekly booking could not be saved.');\r\n  });\r\n\r\n  document.getElementById('editFixedBookingForm').addEventListener('submit', async (e) =\u003e {\r\n    e.preventDefault();\r\n    const id = document.getElementById('editFId').value;\r\n    const payload = {\r\n      playerName: document.getElementById('editFName').value.trim(), phone: document.getElementById('editFPhone').value.trim(),\r\n      dayOfWeek: Number(document.getElementById('editFDay').value), time: document.getElementById('editFTime').value\r\n    };\r\n    const res = await window.Kickoff.fetch(`/api/admin/standing-bookings/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });\r\n    if (res.ok) {\r\n      document.getElementById('editFixedModal').classList.remove('active');\r\n      loadFixedBookings(); loadTimeline();\r\n    } else alert((await res.json()).error || 'The weekly booking could not be saved.');\r\n  });\r\n\r\n  document.getElementById('btnOpenCreateModal').addEventListener('click', () =\u003e document.getElementById('createModal').classList.add('active'));\r\n  document.getElementById('btnOpenFixedModal').addEventListener('click', () =\u003e document.getElementById('fixedModal').classList.add('active'));\r\ndocument.getElementById('btnLogout').addEventListener('click', async () =\u003e {\r\n    if (confirm(\"Close staff terminal and sign out?\")) {\r\n      await window.Kickoff.fetch('/api/admin/logout', { method: 'POST' });\r\n      window.location.href = '/admin/index.html';\r\n    }\r\n  });\r\n\r\n  const actions = {\r\n    openDetailsModal: value =\u003e window.openDetailsModal(value), quickBook: value =\u003e window.quickBook(value),\r\n    confirmReservation: value =\u003e window.confirmReservation(value), cancelReservation: value =\u003e window.cancelReservation(value),\r\n    openEditFixedModal: value =\u003e window.openEditFixedModal(value), cancelFixedBooking: value =\u003e window.cancelFixedBooking(value)\r\n  };\r\n  document.addEventListener('click', event =\u003e {\r\n    const button = event.target.closest('button[data-action]');\r\n    if (!button || button.disabled || !Object.hasOwn(actions, button.dataset.action)) return;\r\n    Promise.resolve(actions[button.dataset.action](button.dataset.value)).catch(error =\u003e alert(error.message || 'The request could not be completed.'));\r\n  });\r\n\r\n  // Keep the existing calendar inside the visible screen, including short dialogs.\r\n  function fitCalendar(picker, positionElement) {\r\n    const calendar = picker.calendarContainer;\r\n    const input = positionElement || picker._positionElement || picker.input;\r\n    const view = window.visualViewport;\r\n    const viewLeft = view?.offsetLeft || 0, viewTop = view?.offsetTop || 0;\r\n    const viewWidth = view?.width || window.innerWidth, viewHeight = view?.height || window.innerHeight;\r\n    calendar.classList.add('viewport-calendar');\r\n    calendar.style.position = 'fixed';\r\n    calendar.style.maxHeight = `${Math.max(120, viewHeight - 16)}px`;\r\n    calendar.style.overflowY = 'auto';\r\n    const bounds = input.getBoundingClientRect();\r\n    const height = calendar.offsetHeight, width = calendar.offsetWidth;\r\n    const below = bounds.bottom + 6, above = bounds.top - height - 6;\r\n    const top = below + height \u003c= viewTop + viewHeight - 8 ? below : above \u003e= viewTop + 8 ? above : viewTop + 8;\r\n    calendar.style.top = `${Math.max(viewTop + 8, Math.min(top, viewTop + viewHeight - height - 8))}px`;\r\n    calendar.style.left = `${Math.max(viewLeft + 4, Math.min(bounds.left, viewLeft + viewWidth - width - 4))}px`;\r\n    calendar.style.right = 'auto';\r\n  }\r\n\r\n  flatpickr(\"#scheduleDateInput\", { defaultDate: currentDate, dateFormat: \"Y-m-d\", position: fitCalendar, onChange: function(selectedDates, dateStr) { currentDate = dateStr; loadTimeline(); }});\r\n  flatpickr(\"#mDate\", { defaultDate: currentDate, dateFormat: \"Y-m-d\", position: fitCalendar });\r\n  \r\n  window.visualViewport?.addEventListener('resize', () =\u003e {\r\n    for (const id of ['scheduleDateInput', 'mDate']) {\r\n      const picker = document.getElementById(id)._flatpickr;\r\n      if (picker?.isOpen) fitCalendar(picker);\r\n    }\r\n  });\r\n  loadStats(); loadTimeline(); loadAnalytics();\r\n});"}, {"path": "client/public/admin/dashboard.html", "code": "\u003c!DOCTYPE html\u003e\r\n\u003chtml lang=\"en\" data-theme=\"dark\"\u003e\r\n\u003chead\u003e\r\n  \u003cmeta charset=\"UTF-8\"\u003e\r\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content\"\u003e\r\n  \u003ctitle\u003eKickoff | Pitch Management Dashboard\u003c/title\u003e\r\n  \u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700\u0026family=Rajdhani:wght@600;700;800\u0026family=Space+Mono:wght@400;700\u0026display=swap\" rel=\"stylesheet\"\u003e\r\n  \u003clink rel=\"stylesheet\" href=\"/vendor/flatpickr.min.css?v=4.6.13\"\u003e\r\n  \u003clink rel=\"stylesheet\" href=\"admin.css?v=2.3.0\"\u003e\r\n  \u003clink rel=\"stylesheet\" href=\"/mobile.css?v=2.3.0\"\u003e\r\n\u003c/head\u003e\r\n\u003cbody class=\"admin-page dashboard-page\"\u003e\r\n\r\n  \u003c!-- Top Operator Bar --\u003e\r\n  \u003cheader class=\"admin-topbar\"\u003e\r\n    \u003cdiv class=\"topbar-left\"\u003e\r\n      \u003cspan class=\"logo-text\"\u003eKICKOFF\u003c/span\u003e\r\n      \u003cspan class=\"facility-tag\"\u003eCHOUEIFAT PITCH 1\u003c/span\u003e\r\n    \u003c/div\u003e\r\n    \u003cdiv class=\"topbar-right\"\u003e\r\n      \u003cspan class=\"operator-badge\"\u003e👤 \u003cspan id=\"operatorName\"\u003eOperator\u003c/span\u003e\u003c/span\u003e\r\n      \u003cbutton class=\"btn btn-ghost\" id=\"btnLogout\"\u003eExit Terminal\u003c/button\u003e\r\n    \u003c/div\u003e\r\n  \u003c/header\u003e\r\n\r\n  \u003ca class=\"site-back dashboard-back\" href=\"/\" style=\"display: inline-block; margin: 24px 24px 0; color: var(--accent); text-decoration: none; font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 1.1rem; letter-spacing: 1px;\"\u003e\r\n    ← BACK TO PUBLIC SITE\r\n  \u003c/a\u003e\r\n\r\n  \u003cdiv class=\"dashboard-layout\"\u003e\r\n    \r\n    \u003c!-- Sidebar / Quick Actions --\u003e\r\n    \u003caside class=\"dashboard-sidebar\"\u003e\r\n      \u003cdiv class=\"sidebar-block\"\u003e\r\n        \u003cbutton class=\"btn btn-primary w-full\" id=\"btnOpenCreateModal\"\u003e+ New Reservation\u003c/button\u003e\r\n      \u003c/div\u003e\r\n\r\n      \u003cnav class=\"sidebar-nav\"\u003e\r\n        \u003cbutton class=\"nav-tab active\" data-view=\"timeline\"\u003eSchedule Timeline\u003c/button\u003e\r\n        \u003cbutton class=\"nav-tab\" data-view=\"list\"\u003eAll Bookings\u003c/button\u003e\r\n        \u003cbutton class=\"nav-tab\" data-view=\"fixed\"\u003eVIP
