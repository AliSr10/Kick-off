var(--font-mono); font-size: 0.85rem;\"\u003eConfirmed Matches Only\u003c/span\u003e\r\n     \u003c/div\u003e\r\n     \u003cdiv style=\"position: relative; height: 250px; width: 100%;\"\u003e\r\n       \u003ccanvas id=\"analyticsChart\"\u003e\u003c/canvas\u003e\r\n     \u003c/div\u003e\r\n   \u003c/div\u003e\r\n\r\n      \u003c!-- VIEW: TIMELINE SCHEDULE --\u003e\r\n      \u003cdiv class=\"content-view active\" id=\"view-timeline\"\u003e\r\n        \u003cdiv class=\"view-controls\"\u003e\r\n          \u003cdiv class=\"date-picker-wrap\"\u003e\r\n            \u003clabel for=\"scheduleDateInput\"\u003eSelected Date\u003c/label\u003e\r\n            \u003cinput type=\"date\" id=\"scheduleDateInput\" class=\"admin-input\"\u003e\r\n          \u003c/div\u003e\r\n          \u003cdiv class=\"legend\"\u003e\r\n            \u003cspan class=\"legend-item\"\u003e\u003cspan class=\"dot dot-avail\"\u003e\u003c/span\u003e Available\u003c/span\u003e\r\n            \u003cspan class=\"legend-item\"\u003e\u003cspan class=\"dot dot-booked\"\u003e\u003c/span\u003e Reserved\u003c/span\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n        \u003cdiv class=\"timeline-board\" id=\"timelineGrid\"\u003e\u003c/div\u003e\r\n      \u003c/div\u003e\r\n\r\n      \u003c!-- VIEW: LIST \u0026 SEARCH --\u003e\r\n      \u003cdiv class=\"content-view\" id=\"view-list\"\u003e\r\n        \u003cdiv class=\"view-controls filter-bar\"\u003e\r\n          \u003cinput type=\"text\" id=\"searchInput\" aria-label=\"Search bookings\" class=\"admin-input flex-1\" placeholder=\"🔍 Search by name, phone, or ID...\"\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Table Toolbar with Status Filter and Clear History --\u003e\r\n        \u003cdiv class=\"booking-toolbar\" style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; margin-top: 24px;\"\u003e\r\n          \u003ch2 style=\"font-family: var(--font-display); font-size: 1.5rem; margin: 0;\"\u003eReservation Manager\u003c/h2\u003e\r\n          \u003cdiv class=\"toolbar-actions\" style=\"display: flex; gap: 12px; align-items: center;\"\u003e\r\n            \u003cselect id=\"statusFilter\" aria-label=\"Filter booking status\" class=\"admin-input\" style=\"width: 180px;\"\u003e\r\n              \u003coption value=\"ALL\"\u003eAll Statuses\u003c/option\u003e\r\n              \u003coption value=\"UPCOMING\"\u003eUpcoming Matches\u003c/option\u003e\r\n              \u003coption value=\"PENDING\"\u003ePending\u003c/option\u003e\r\n              \u003coption value=\"CONFIRMED\"\u003eConfirmed\u003c/option\u003e\r\n              \u003coption value=\"CANCELLED\"\u003eCancelled\u003c/option\u003e\r\n              \u003coption value=\"ARCHIVE\"\u003e🗄️ Match Archive\u003c/option\u003e\r\n            \u003c/select\u003e\r\n            \u003cbutton id=\"btnClearHistory\" class=\"btn btn-danger\" style=\"display: none; padding: 8px 16px; font-size: 0.9rem;\"\u003e\r\n              Clear History\r\n            \u003c/button\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"table-card\" tabindex=\"0\" role=\"region\" aria-label=\"Bookings\"\u003e\r\n          \u003ctable class=\"admin-table\"\u003e\r\n            \u003cthead\u003e\r\n              \u003ctr\u003e\r\n                \u003cth\u003eREF ID\u003c/th\u003e\r\n                \u003cth\u003eCUSTOMER\u003c/th\u003e\r\n                \u003cth\u003ePHONE\u003c/th\u003e\r\n                \u003cth\u003eDATE \u0026 TIME\u003c/th\u003e\r\n                \u003cth\u003eSTATUS\u003c/th\u003e\r\n                \u003cth class=\"text-right\"\u003eACTIONS\u003c/th\u003e\r\n              \u003c/tr\u003e\r\n            \u003c/thead\u003e\r\n            \u003ctbody id=\"reservationsTableBody\"\u003e\u003c/tbody\u003e\r\n          \u003c/table\u003e\r\n        \u003c/div\u003e\r\n      \u003c/div\u003e\r\n\r\n      \u003c!-- VIEW: VIP FIXED BOOKINGS --\u003e\r\n      \u003cdiv class=\"content-view\" id=\"view-fixed\"\u003e\r\n        \u003cdiv class=\"view-controls\" style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;\"\u003e\r\n          \u003cdiv\u003e\r\n            \u003ch2 style=\"font-family: var(--font-display); font-size: 1.5rem; letter-spacing: 1px;\"\u003eVIP RECURRING RESERVATIONS\u003c/h2\u003e\r\n            \u003cp style=\"color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;\"\u003ePermanently locked weekly slots for contract teams.\u003c/p\u003e\r\n          \u003c/div\u003e\r\n          \u003cbutton class=\"btn btn-primary\" id=\"btnOpenFixedModal\"\u003e+ New Fixed Booking\u003c/button\u003e\r\n        \u003c/div\u003e\r\n        \u003cdiv class=\"table-card\" tabindex=\"0\" role=\"region\" aria-label=\"Bookings\"\u003e\r\n          \u003ctable class=\"admin-table\"\u003e\r\n            \u003cthead\u003e\r\n              \u003ctr\u003e\r\n                \u003cth\u003eREF ID\u003c/th\u003e\r\n                \u003cth\u003eTEAM / SQUAD\u003c/th\u003e\r\n                \u003cth\u003ePHONE\u003c/th\u003e\r\n                \u003cth\u003eWEEKLY RECURRING SCHEDULE\u003c/th\u003e\r\n                \u003cth class=\"text-right\"\u003eACTIONS\u003c/th\u003e\r\n              \u003c/tr\u003e\r\n            \u003c/thead\u003e\r\n            \u003ctbody id=\"fixedBookingsTableBody\"\u003e\u003c/tbody\u003e\r\n          \u003c/table\u003e\r\n        \u003c/div\u003e\r\n      \u003c/div\u003e\r\n\r\n    \u003c/main\u003e\r\n  \u003c/div\u003e\r\n\r\n  \u003c!-- MODAL: MANUAL CREATION --\u003e\r\n  \u003cdiv class=\"modal-overlay\" id=\"createModal\"\u003e\r\n    \u003cdiv role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"createModalTitle\" class=\"modal-card\"\u003e\r\n      \u003cdiv class=\"modal-header\"\u003e\r\n        \u003ch3 id=\"createModalTitle\"\u003eManual Pitch Booking\u003c/h3\u003e\r\n        \u003cbutton class=\"close-btn\" data-close=\"createModal\" aria-label=\"Close dialog\"\u003e\u0026times;\u003c/button\u003e\r\n      \u003c/div\u003e\r\n      \u003cform id=\"manualBookingForm\" class=\"modal-form\"\u003e\r\n        \u003cdiv class=\"form-group\"\u003e\r\n          \u003clabel for=\"mName\"\u003ePlayer / Team Name\u003c/label\u003e\r\n          \u003cinput type=\"text\" id=\"mName\" required class=\"admin-input\"\u003e\r\n        \u003c/div\u003e\r\n        \u003cdiv class=\"form-group\"\u003e\r\n          \u003clabel for=\"mPhone\"\u003ePhone Number\u003c/label\u003e\r\n          \u003cinput type=\"tel\" id=\"mPhone\" autocomplete=\"tel\" inputmode=\"tel\" maxlength=\"40\" required class=\"admin-input\"\u003e\r\n        \u003c/div\u003e\r\n        \u003cdiv class=\"form-row\"\u003e\r\n          \u003cdiv class=\"form-group flex-1\"\u003e\r\n            \u003clabel for=\"mDate\"\u003eDate\u003c/label\u003e\r\n            \u003cinput type=\"date\" id=\"mDate\" required class=\"admin-input\"\u003e\r\n          \u003c/div\u003e\r\n          \u003cdiv class=\"form-group flex-1\"\u003e\r\n            \u003clabel for=\"mTime\"\u003eKickoff Time\u003c/label\u003e\r\n            \u003cselect id=\"mTime\" required class=\"admin-input\"\u003e\r\n              \u003coption value=\"3:00 PM - 4:30 PM\"\u003e3:00 PM - 4:30 PM\u003c/option\u003e\r\n              \u003coption value=\"4:30 PM - 6:00 PM\"\u003e4:30 PM - 6:00 PM\u003c/option\u003e\r\n              \u003coption value=\"6:00 PM - 7:30 PM\"\u003e6:00 PM - 7:30 PM\u003c/option\u003e\r\n              \u003coption value=\"7:30 PM - 9:00 PM\"\u003e7:30 PM - 9:00 PM\u003c/option\u003e\r\n              \u003coption value=\"9:00 PM - 10:30 PM\"\u003e9:00 PM - 10:30 PM\u003c/option\u003e\r\n              \u003coption value=\"10:30 PM - 12:00 AM\"\u003e10:30 PM - 12:00 AM\u003c/option\u003e\r\n            \u003c/select\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n        \u003cdiv class=\"form-group\"\u003e\r\n          \u003clabel for=\"mNotes\"\u003eStaff Notes\u003c/label\u003e\r\n          \u003cinput type=\"text\" id=\"mNotes\" class=\"admin-input\" placeholder=\"e.g. Walk-in\"\u003e\r\n        \u003c/div\u003e\r\n        \u003cbutton type=\"submit\" class=\"btn btn-primary w-full mt-16\"\u003eCreate Reservation\u003c/button\u003e\r\n      \u003c/form\u003e\r\n    \u003c/div\u003e\r\n  \u003c/div\u003e\r\n\r\n  \u003c!-- MODAL: VIP FIXED BOOKING CREATION --\u003e\r\n  \u003cdiv class=\"modal-overlay\" id=\"fixedModal\"\u003e\r\n    \u003cdiv role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"fixedModalTitle\" class=\"modal-card\"\u003e\r\n      \u003cdiv class=\"modal-header\"\u003e\r\n        \u003ch3 id=\"fixedModalTitle\"\u003eCreate VIP Fixed Booking\u003c/h3\u003e\r\n        \u003cbutton class=\"close-btn\" data-close=\"fixedModal\" aria-label=\"Close dialog\"\u003e\u0026times;\u003c/button\u003e\r\n      \u003c/div\u003e\r\n      \u003cform id=\"fixedBookingForm\" class=\"modal-form\"\u003e\r\n        \u003cdiv class=\"form-group\"\u003e\r\n          \u003clabel for=\"fName\"\u003eTeam / Player Name\u003c/label\u003e\r\n          \u003cinput type=\"text\" id=\"fName\" required class=\"admin-input\"\u003e\r\n        \u003c/div\u003e\r\n        \u003cdiv class=\"form-group\"\u003e\r\n          \u003clabel for=\"fPhone\"\u003ePhone Number\u003c/label\u003e\r\n          \u003cinput type=\"tel\" id=\"fPhone\" autocomplete=\"tel\" inputmode=\"tel\" maxlength=\"40\" required class=\"admin-input\"\u003e\r\n        \u003c/div\u003e\r\n        \u003cdiv class=\"form-row\"\u003e\r\n          \u003cdiv class=\"form-group flex-1\"\u003e\r\n            \u003clabel for=\"fDay\"\u003eDay of the Week\u003c/label\u003e\r\n            \u003cselect id=\"fDay\" required class=\"admin-input\"\u003e\r\n              \u003coption value=\"\" disabled selected\u003eSelect Day\u003c/option\u003e\r\n              \u003coption value=\"1\"\u003eEvery Monday\u003c/option\u003e\r\n              \u003coption value=\"2\"\u003eEvery Tuesday\u003c/option\u003e\r\n              \u003coption value=\"3\"\u003eEvery Wednesday\u003c/option\u003e\r\n              \u003coption value=\"4\"\u003eEvery Thursday\u003c/option\u003e\r\n              \u003coption value=\"5\"\u003eEvery Friday\u003c/option\u003e\r\n              \u003coption value=\"6\"\u003eEvery Saturday\u003c/option\u003e\r\n              \u003coption value=\"0\"\u003eEvery Sunday\u003c/option\u003e\r\n            \u003c/select\u003e\r\n          \u003c/div\u003e\r\n          \u003cdiv class=\"form-group flex-1\"\u003e\r\n            \u003clabel for=\"fTime\"\u003eWeekly Slot\u003c/label\u003e\r\n            \u003cselect id=\"fTime\" required class=\"admin-input\"\u003e\r\n              \u003coption value=\"\" disabled selected\u003eSelect Slot\u003c/option\u003e\r\n              \u003coption value=\"3:00 PM - 4:30 PM\"\u003e3:00 PM - 4:30 PM\u003c/option\u003e\r\n              \u003coption value=\"4:30 PM - 6:00 PM\"\u003e4:30 PM - 6:00 PM\u003c/option\u003e\r\n              \u003coption value=\"6:00 PM - 7:30 PM\"\u003e6:00 PM - 7:30 PM\u003c/option\u003e\r\n              \u003coption value=\"7:30 PM - 9:00 PM\"\u003e7:30 PM - 9:00 PM\u003c/option\u003e\r\n              \u003coption value=\"9:00 PM - 10:30 PM\"\u003e9:00 PM - 10:30 PM\u003c/option\u003e\r\n              \u003coption value=\"10:30 PM - 12:00 AM\"\u003e10:30 PM - 12:00 AM\u003c/option\u003e\r\n            \u003c/select\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n        \u003cbutton type=\"submit\" class=\"btn btn-primary w-full mt-16\"\u003eLock Weekly Schedule\u003c/button\u003e\r\n      \u003c/form\u003e\r\n    \u003c/div\u003e\r\n  \u003c/div\u003e\r\n\r\n  \u003c!-- MODAL: VIP FIXED BOOKING EDIT --\u003e\r\n  \u003cdiv class=\"modal-overlay\" id=\"editFixedModal\"\u003e\r\n    \u003cdiv role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"editFixedModalTitle\" class=\"modal-card\"\u003e\r\n      \u003cdiv class=\"modal-header\"\u003e\r\n        \u003ch3 id=\"editFixedModalTitle\"\u003eEdit VIP Fixed Booking\u003c/h3\u003e\r\n        \u003cbutton class=\"close-btn\" data-close=\"editFixedModal\" aria-label=\"Close dialog\"\u003e\u0026times;\u003c/button\u003e\r\n      \u003c/div\u003e\r\n      \u003cform id=\"editFixedBookingForm\" class=\"modal-form\"\u003e\r\n        \u003cinput type=\"hidden\" id=\"editFId\"\u003e\r\n        \u003cdiv class=\"form-group\"\u003e\r\n          \u003clabel for=\"editFName\"\u003eTeam / Player Name\u003c/label\u003e\r\n          \u003cinput type=\"text\" id=\"editFName\" required class=\"admin-input\"\u003e\r\n        \u003c/div\u003e\r\n        \u003cdiv class=\"form-group\"\u003e\r\n          \u003clabel for=\"editFPhone\"\u003ePhone Number\u003c/label\u003e\r\n          \u003cinput type=\"tel\" id=\"editFPhone\" autocomplete=\"tel\" inputmode=\"tel\" maxlength=\"40\" required class=\"admin-input\"\u003e\r\n        \u003c/div\u003e\r\n        \u003cdiv class=\"form-row\"\u003e\r\n          \u003cdiv class=\"form-group flex-1\"\u003e\r\n            \u003clabel for=\"editFDay\"\u003eDay of the Week\u003c/label\u003e\r\n            \u003cselect id=\"editFDay\" required class=\"admin-input\"\u003e\r\n              \u003coption value=\"1\"\u003eEvery Monday\u003c/option\u003e\r\n              \u003coption value=\"2\"\u003eEvery Tuesday\u003c/option\u003e\r\n              \u003coption value=\"3\"\u003eEvery Wednesday\u003c/option\u003e\r\n              \u003coption value=\"4\"\u003eEvery Thursday\u003c/option\u003e\r\n              \u003coption value=\"5\"\u003eEvery Friday\u003c/option\u003e\r\n              \u003coption value=\"6\"\u003eEvery Saturday\u003c/option\u003e\r\n              \u003coption value=\"0\"\u003eEvery Sunday\u003c/option\u003e\r\n            \u003c/select\u003e\r\n          \u003c/div\u003e\r\n          \u003cdiv class=\"form-group flex-1\"\u003e\r\n            \u003clabel for=\"editFTime\"\u003eWeekly Slot\u003c/label\u003e\r\n            \u003cselect id=\"editFTime\" required class=\"admin-input\"\u003e\r\n              \u003coption value=\"3:00 PM - 4:30 PM\"\u003e3:00 PM - 4:30 PM\u003c/option\u003e\r\n              \u003coption value=\"4:30 PM - 6:00 PM\"\u003e4:30 PM - 6:00 PM\u003c/option\u003e\r\n              \u003coption value=\"6:00 PM - 7:30 PM\"\u003e6:00 PM - 7:30 PM\u003c/option\u003e\r\n              \u003coption value=\"7:30 PM - 9:00 PM\"\u003e7:30 PM - 9:00 PM\u003c/option\u003e\r\n              \u003coption value=\"9:00 PM - 10:30 PM\"\u003e9:00 PM - 10:30 PM\u003c/option\u003e\r\n              \u003coption value=\"10:30 PM - 12:00 AM\"\u003e10:30 PM - 12:00 AM\u003c/option\u003e\r\n            \u003c/select\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n        \u003cbutton type=\"submit\" class=\"btn btn-primary w-full mt-16\"\u003eSave Changes\u003c/button\u003e\r\n      \u003c/form\u003e\r\n    \u003c/div\u003e\r\n  \u003c/div\u003e\r\n\r\n  \u003c!-- MODAL: DETAILS \u0026 CANCEL --\u003e\r\n  \u003cdiv class=\"modal-overlay\" id=\"detailsModal\"\u003e\r\n    \u003cdiv role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"dRef\" class=\"modal-card\"\u003e\r\n      \u003cdiv class=\"modal-header\"\u003e\r\n        \u003ch3 id=\"dRef\"\u003eREF #\u003c/h3\u003e\r\n        \u003cbutton class=\"close-btn\" data-close=\"detailsModal\" aria-label=\"Close dialog\"\u003e\u0026times;\u003c/button\u003e\r\n      \u003c/div\u003e\r\n      \u003cdiv class=\"modal-body\" id=\"detailsContent\"\u003e\u003c/div\u003e\r\n      \u003cdiv class=\"modal-actions mt-16\" id=\"detailsActions\"\u003e\u003c/div\u003e\r\n    \u003c/div\u003e\r\n  \u003c/div\u003e\r\n\r\n  \u003c!-- MODAL: CLEAR HISTORY CONFIRMATION --\u003e\r\n  \u003cdiv class=\"modal-overlay\" id=\"clearHistoryModal\"\u003e\r\n    \u003cdiv role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"clearHistoryModalTitle\" class=\"modal-card\" style=\"max-width: 400px; text-align: center;\"\u003e\r\n      \u003ch3 id=\"clearHistoryModalTitle\" style=\"font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 12px; color: var(--danger);\"\u003eClear History?\u003c/h3\u003e\r\n      \u003cp style=\"color: var(--text-muted); margin-bottom: 24px;\"\u003eThis will permanently delete all CANCELLED reservations from the database. This action cannot be undone.\u003c/p\u003e\r\n      \u003cdiv style=\"display: flex; gap: 12px;\"\u003e\r\n        \u003cbutton class=\"btn w-full\" id=\"btnCancelClear\" style=\"background: transparent; border: 1px solid var(--border-faint); color: var(--text-main);\"\u003eCancel\u003c/button\u003e\r\n        \u003cbutton class=\"btn btn-danger w-full\" id=\"btnConfirmClear\"\u003eYes, Delete\u003c/button\u003e\r\n      \u003c/div\u003e\r\n    \u003c/div\u003e\r\n  \u003c/div\u003e\r\n\r\n  \u003cscript src=\"/shared.js?v=2.3.0\"\u003e\u003c/script\u003e\r\n  \u003cscript src=\"/vendor/flatpickr.min.js?v=4.6.13\"\u003e\u003c/script\u003e\r\n  \u003cscript src=\"admin.js?v=2.3.0\"\u003e\u003c/script\u003e\r\n\r\n  \u003cscript src=\"/vendor/chart.umd.js?v=4.6.1\"\u003e\u003c/script\u003e\r\n  \u003cscript src=\"/ui.js?v=2.3.0\"\u003e\u003c/script\u003e\r\n\u003c/body\u003e\r\n\u003c/html\u003e"}, {"path": "client/public/admin/index.html", "code": "\u003c!DOCTYPE html\u003e\r\n\u003chtml lang=\"en\" data-theme=\"dark\"\u003e\r\n\u003chead\u003e\r\n  \u003cmeta charset=\"UTF-8\"\u003e\r\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content\"\u003e\r\n  \u003ctitle\u003eKickoff | Staff Authentication\u003c/title\u003e\r\n  \u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600\u0026family=Rajdhani:wght@600;700;800\u0026display=swap\" rel=\"stylesheet\"\u003e\r\n  \u003clink rel=\"stylesheet\" href=\"admin.css?v=2.3.0\"\u003e\r\n  \u003clink rel=\"stylesheet\" href=\"/mobile.css?v=2.3.0\"\u003e\r\n\u003c/head\u003e\r\n\u003cbody class=\"admin-page auth-body\"\u003e\r\n\r\n  \u003ca href=\"/\" class=\"site-back\"\u003e← Back to booking\u003c/a\u003e\r\n\r\n  \u003c!-- Glowing Admin Login Box --\u003e\r\n  \u003cdiv class=\"login-box staff-login\" id=\"loginBox\"\u003e\r\n    \u003ch2 style=\"font-family: var(--font-display); letter-spacing: 4px;\" id=\"staffLoginTitle\"\u003eSTAFF SIGN IN\u003c/h2\u003e\r\n    \u003cp class=\"auth-intro\"\u003eManage the pitch, bookings and weekly teams.\u003c/p\u003e\r\n    \u003cform id=\"loginForm\" aria-labelledby=\"staffLoginTitle\"\u003e\r\n      \u003cdiv class=\"user-box\"\u003e\r\n        \u003clabel for=\"username\"\u003eStaff username\u003c/label\u003e\r\n        \u003cinput type=\"text\" id=\"username\" name=\"username\" autocomplete=\"username\" autocapitalize=\"none\" spellcheck=\"false\" placeholder=\"Your staff username\" required\u003e\r\n      \u003c/div\u003e\r\n      \u003cdiv class=\"user-box\"\u003e\r\n        \u003clabel for=\"password\"\u003ePassword\u003c/label\u003e\r\n        \u003cinput type=\"password\" id=\"password\" name=\"password\" autocomplete=\"current-password\" placeholder=\"Enter your password\" required\u003e\r\n        \u003cbutton type=\"button\" class=\"password-toggle\" id=\"togglePassword\" aria-label=\"Show password\" aria-controls=\"password\" aria-pressed=\"false\"\u003eShow\u003c/button\u003e\r\n      \u003c/div\u003e\r\n      \r\n      \u003cbutton type=\"submit\" class=\"neon-submit\" id=\"loginBtn\"\u003e\r\n        \u003cspan\u003e\u003c/span\u003e\r\n        \u003cspan\u003e\u003c/span\u003e\r\n        \u003cspan\u003e\u003c/span\u003e\r\n        \u003cspan\u003e\u003c/span\u003e\r\n        \u003cb id=\"loginButtonLabel\"\u003eSign in\u003c/b\u003e\r\n      \u003c/button\u003e\r\n\r\n      \u003cdiv id=\"loginError\" role=\"alert\" aria-live=\"polite\" tabindex=\"-1\" style=\"color: var(--danger); margin-top: 20px; font-size: 0.85rem; text-align: center; font-family: var(--font-mono);\"\u003e\u003c/div\u003e\r\n    \u003c/form\u003e\r\n    \u003cp class=\"staff-login-help\"\u003eNeed staff access? Contact the facility manager.\u003c/p\u003e\r\n    \u003ca href=\"/\" class=\"customer-login-link\"\u003eLooking to play? Book as a customer →\u003c/a\u003e\r\n  \u003c/div\u003e\r\n\r\n  \u003cscript src=\"/shared.js?v=2.3.0\"\u003e\u003c/script\u003e\n  \u003cscript src=\"login.js?v=2.3.0\"\u003e\u003c/script\u003e\r\n  \u003cscript src=\"/ui.js?v=2.3.0\"\u003e\u003c/script\u003e\r\n\u003c/body\u003e\r\n\u003c/html\u003e"}, {"path": "client/public/admin/login.js", "code": "document.getElementById('loginForm').addEventListener('submit', async event =\u003e {\n  event.preventDefault();\n  const form = event.currentTarget;\n  const button = form.querySelector('button[type=\"submit\"]');\n  if (button.disabled) return;\n  const errorBanner = document.getElementById('loginError');\n  errorBanner.style.display = 'none';\n  button.disabled = true;\n  const label = document.getElementById('loginButtonLabel');\n  if (label) label.textContent = 'Signing in…';\n  button.setAttribute('aria-busy', 'true');\n  try {\n    const response = await window.Kickoff.fetch('/api/admin/login', {\n      method: 'POST', headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value })\n    });\n    const data = await response.json();\n    if (response.ok) window.location.href = '/admin/dashboard.html';\n    else throw new Error(data.error || 'Authentication rejected');\n  } catch (error) {\n    errorBanner.textContent = error.message || 'Connection failed. Please try again.';\n    errorBanner.style.display = 'block';\n    errorBanner.focus();\n  } finally {\n    button.disabled = false; button.removeAttribute('aria-busy');\n    if (label) label.textContent = 'Sign in';\n  }\n});\n"}, {"path": "client/public/app.js", "code": "document.addEventListener('DOMContentLoaded', () =\u003e {\r\n\r\n  const BUSINESS_WHATSAPP = \"9613696325\";\r\n  const escapeHTML = window.Kickoff.escapeHTML;\r\n\r\n  const views = document.querySelectorAll('.view');\r\n  const progressContainer = document.getElementById('progressContainer');\r\n  const steps = document.querySelectorAll('.step');\r\n  \r\n  const state = {\r\n    date: null,\r\n    time: null,\r\n    playerName: '',\r\n    playerPhone: '',\r\n    reservationId: null\r\n  };\r\n\r\n  // --- Authentication Gate Logic ---\r\n  const btnGoogleLogin = document.getElementById('btnGoogleLogin');\r\n  const btnGuestLogin = document.getElementById('btnGuestLogin');\r\n  \r\n  if (btnGoogleLogin) btnGoogleLogin.addEventListener('click', () =\u003e {\r\n    if (btnGoogleLogin.disabled) return;\r\n    btnGoogleLogin.disabled = true;\r\n    const label = btnGoogleLogin.querySelector('.google-button-label');\r\n    if (label) label.textContent = 'Opening Google…';\r\n    window.location.href = '/api/auth/google';\r\n  });\r\n  if (btnGuestLogin) btnGuestLogin.addEventListener('click', () =\u003e navigateTo('view-home'));\r\n\r\n  // --- Check Session on Load \u0026 Setup Profile ---\r\n  async function checkUserSession() {\r\n    try {\r\n      const res = await window.Kickoff.fetch('/api/auth/me');\r\n      const data = await res.json();\r\n      if (data.preview \u0026\u0026 btnGoogleLogin) {\r\n        btnGoogleLogin.disabled = true; btnGoogleLogin.dataset.preview = 'true';\r\n        const hint = document.getElementById('guestHint');\r\n        if (hint) hint.textContent = 'Local preview: continue as a guest. Google sign-in is available on the live website.';\r\n      }\r\n      \r\n      const deskProfile = document.getElementById('desktopProfileLink');\r\n      const mobProfile = document.getElementById('mobileProfileLink');\r\n      const deskLogin = document.getElementById('desktopLoginLink');\r\n      const mobLogin = document.getElementById('mobileLoginLink');\r\n\r\n      if (data.loggedIn) {\r\n        state.isLoggedIn = true;\r\n        state.user = data.user;\r\n        \r\n        const firstName = state.user.name.split(' ')[0].toUpperCase();\r\n        if (deskProfile) { deskProfile.style.display = 'block'; deskProfile.textContent = 'My account'; deskProfile.title = `Signed in as ${firstName}`; }\r\n        if (mobProfile) { mobProfile.style.display = 'block'; mobProfile.textContent = `👤 ${firstName}`; }\r\n        if (deskLogin) deskLogin.style.display = 'none';\r\n        if (mobLogin) mobLogin.style.display = 'none';\r\n\r\n        if (document.getElementById('accEmail')) document.getElementById('accEmail').value = state.user.email || '';\r\n        if (document.getElementById('accName')) document.getElementById('accName').value = state.user.name || '';\r\n        if (document.getElementById('accPhone')) document.getElementById('accPhone').value = state.user.phone || '';\r\n\r\n        if (document.getElementById('playerName')) document.getElementById('playerName').value = state.user.name || '';\r\n        if (document.getElementById('playerPhone')) document.getElementById('playerPhone').value = state.user.phone || '';\r\n\r\n        if (document.getElementById('view-entry').classList.contains('active')) navigateTo('view-home');\r\n      } else {\r\n        state.isLoggedIn = false;\r\n        state.user = null;\r\n\r\n        if (deskProfile) deskProfile.style.display = 'none';\r\n        if (mobProfile) mobProfile.style.display = 'none';\r\n        if (deskLogin) deskLogin.style.display = 'block';\r\n        if (mobLogin) mobLogin.style.display = 'block';\r\n      }\r\n    } catch (err) {\r\n      console.error(\"Session check failed\", err);\r\n    }\r\n  }\r\n\r\n  const closeAppSidebar = () =\u003e {\r\n    const sidebar = document.querySelector('.sidebar');\r\n    const overlay = document.querySelector('.sidebar-overlay');\r\n    if (sidebar) sidebar.classList.remove('active');\r\n    if (overlay) overlay.classList.remove('active');\r\n  };\r\n\r\n  // --- Load User Matches Dashboard ---\r\n  async function loadUserMatches() {\r\n    const listContainer = document.getElementById('userMatchesList');\r\n    if (!listContainer) return;\r\n\r\n    listContainer.innerHTML = '\u003cdiv style=\"color: var(--text-dim); text-align: center; padding: 20px 0;\"\u003eLoading matches...\u003c/div\u003e';\r\n\r\n    try {\r\n      const res = await window.Kickoff.fetch('/api/auth/my-reservations');\r\n      const data = await res.json();\r\n\r\n      if (!res.ok || !data.reservations || data.reservations.length === 0) {\r\n        listContainer.innerHTML = '\u003cdiv style=\"color: var(--text-dim); text-align: center; padding: 20px 0;\"\u003eNo pitch reservations found yet.\u003c/div\u003e';\r\n        return;\r\n      }\r\n\r\n      listContainer.innerHTML = '';\r\n      const todayStr = window.Kickoff.today();\r\n\r\n      data.reservations.forEach(match =\u003e {\r\n        const matchCard = document.createElement('div');\r\n        matchCard.style.cssText = 'background: var(--surface); border: 1px solid var(--surface-border); padding: 16px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 12px;';\r\n\r\n        const isPast = match.date \u003c todayStr;\r\n        let badgeColor = '#FFB020'; \r\n        let badgeBg = 'rgba(255, 176, 32, 0.15)';\r\n\r\n        if (match.status === 'CONFIRMED') {\r\n          badgeColor = 'var(--accent)';\r\n          badgeBg = 'rgba(0, 255, 102, 0.12)';\r\n        } else if (match.status === 'CANCELLED') {\r\n          badgeColor = 'var(--danger)';\r\n          badgeBg = 'rgba(222, 40, 57, 0.12)';\r\n        }\r\n\r\n        const ticketUrl = typeof match.ticketUrl === 'string' \u0026\u0026 match.ticketUrl.startsWith('/ticket.html?token=') ? match.ticketUrl : '#';\r\n\r\n        matchCard.innerHTML = `\r\n          \u003cdiv\u003e\r\n            \u003cdiv style=\"font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-dim); margin-bottom: 4px;\"\u003e${escapeHTML(match.id)}\u003c/div\u003e\r\n            \u003cdiv style=\"font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; color: var(--text-main);\"\u003e${escapeHTML(match.date)} \u0026bull; ${escapeHTML(match.time)}\u003c/div\u003e\r\n            \u003cdiv style=\"font-size: 0.85rem; color: var(--text-dim); margin-top: 2px;\"\u003e${escapeHTML(match.name)} ${isPast ? '\u003cspan style=\"color: var(--accent); font-weight: bold;\"\u003e(Completed)\u003c/span\u003e' : ''}\u003c/div\u003e\r\n          \u003c/div\u003e\r\n          \u003cdiv style=\"display: flex; align-items: center; gap: 12px;\"\u003e\r\n            \u003cspan style=\"background: ${badgeBg}; color: ${badgeColor}; padding: 4px 10px; border-radius: 4px; font-family: var(--font-display); font-size: 0.8rem; font-weight: 700; letter-spacing: 1px;\"\u003e${escapeHTML(match.status)}\u003c/span\u003e\r\n            \u003ca href=\"${escapeHTML(ticketUrl)}\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"btn\" style=\"padding: 6px 12px; font-size: 0.8rem; border: 1px solid var(--surface-border); color: var(--text-main); text-decoration: none;\"\u003ePass 🎟️\u003c/a\u003e\r\n          \u003c/div\u003e\r\n        `;\r\n        listContainer.appendChild(matchCard);\r\n      });\r\n    } catch (err) {\r\n      listContainer.innerHTML = '\u003cdiv style=\"color: var(--danger); text-align: center; padding: 20px 0;\"\u003eError retrieving match history.\u003c/div\u003e';\r\n    }\r\n  }\r\n\r\n  [document.getElementById('desktopProfileLink'), document.getElementById('mobileProfileLink')].forEach(btn =\u003e {\r\n    if (btn) btn.addEventListener('click', (e) =\u003e { \r\n      e.preventDefault(); \r\n      closeAppSidebar(); \r\n      navigateTo('view-account'); \r\n      loadUserMatches(); \r\n    });\r\n  });\r\n\r\n  [document.getElementById('desktopLoginLink'), document.getElementById('mobileLoginLink')].forEach(btn =\u003e {\r\n    if (btn) btn.addEventListener('click', (e) =\u003e { e.preventDefault(); closeAppSidebar(); navigateTo('view-entry'); });\r\n  });\r\n\r\n  const profileForm = document.getElementById('profileForm');\r\n  if (profileForm) {\r\n    profileForm.addEventListener('submit', async (e) =\u003e {\r\n      e.preventDefault();\r\n      const btn = document.getElementById('btnSaveProfile');\r\n      btn.textContent = 'Saving...'; btn.disabled = true;\r\n      \r\n      try {\r\n        const res = await window.Kickoff.fetch('/api/auth/me', {\r\n          method: 'PUT',\r\n          headers: { 'Content-Type': 'application/json' },\r\n          body: JSON.stringify({\r\n            name: document.getElementById('accName').value,\r\n            phone: document.getElementById('accPhone').value\r\n          })\r\n        });\r\n        \r\n        const data = await res.json();\r\n        if (res.ok) {\r\n          state.user = data.user;\r\n          if (document.getElementById('playerName')) document.getElementById('playerName').value = state.user.name || '';\r\n          if (document.getElementById('playerPhone')) document.getElementById('playerPhone').value = state.user.phone || '';\r\n\r\n          btn.textContent = 'Saved Successfully!';\r\n        } else {\r\n          btn.textContent = 'Error Saving';\r\n        }\r\n      } catch (err) {\r\n        btn.textContent = 'Network Error';\r\n      } finally {\r\n        setTimeout(() =\u003e { btn.textContent = 'Save Details'; btn.disabled = false; }, 2000);\r\n      }\r\n    });\r\n  }\r\nconst btnLogoutApp = document.getElementById('btnLogoutApp');\r\n  if (btnLogoutApp) {\r\n    btnLogoutApp.addEventListener('click', async () =\u003e {\r\n      if (confirm(\"Are you sure you want to sign out of your profile?\")) {\r\n        await window.Kickoff.fetch('/api/auth/logout', { method: 'POST' });\r\n        window.location.reload(); \r\n      }\r\n    });\r\n  }\r\n  checkUserSession();\r\n\r\n  function updateNavHighlight() {\r\n    const navHighlight = document.getElementById('navHighlight');\r\n    const activeLink = document.querySelector('.desktop-nav a.active:not(.admin-badge-link)');\r\n    \r\n    if (activeLink \u0026\u0026 navHighlight) {\r\n      navHighlight.style.opacity = '1';\r\n      navHighlight.style.width = `${activeLink.offsetWidth}px`;\r\n      navHighlight.style.left = `${activeLink.offsetLeft}px`;\r\n    } else if (navHighlight) {\r\n      navHighlight.style.opacity = '0';\r\n    }\r\n  }\r\n\r\n  window.addEventListener('resize', updateNavHighlight);\r\n  setTimeout(updateNavHighlight, 100);\r\n\r\n  function setTopNavActive(linkId) {\r\n    document.querySelectorAll('.desktop-nav a').forEach(link =\u003e link.classList.remove('active'));\r\n    const activeLink = document.getElementById(linkId);\r\n    if (activeLink) activeLink.classList.add('active');\r\n    updateNavHighlight();\r\n  }\r\n\r\n  let origNavigateTo = function(targetId) {\r\n    views.forEach(v =\u003e v.classList.remove('active'));\r\n    const targetEl = document.getElementById(targetId);\r\n    if (targetEl) targetEl.classList.add('active');\r\n    window.scrollTo({ top: 0, behavior: 'smooth' });\r\n\r\n    const footer = document.querySelector('.modern-footer');\r\n    const isContentPage = ['view-entry', 'view-home', 'view-account', 'view-terms', 'view-privacy', 'view-contact', 'view-support', 'view-rules'].includes(targetId);\r\n\r\n    if (isContentPage) {\r\n      if (progressContainer) progressContainer.classList.remove('visible');\r\n      if (footer) footer.style.display = 'flex';\r\n    } else {\r\n      if (progressContainer) progressContainer.classList.add('visible');\r\n      updateProgress(targetId);\r\n      if (footer) footer.style.display = 'none';\r\n    }\r\n\r\n    if (targetId === 'view-home') setTopNavActive('topNavHome');\r\n    if (targetId === 'view-date') setTopNavActive('topNavBook');\r\n  };\r\n\r\n  function navigateTo(targetId) {\r\n    origNavigateTo(targetId);\r\n    if (targetId === 'view-account' \u0026\u0026 state.isLoggedIn) {\r\n      loadUserMatches();\r\n    }\r\n  }\r\n\r\n  function updateProgress(viewId) {\r\n    steps.forEach(step =\u003e step.classList.remove('active'));\r\n    if (viewId === 'view-date') steps[0].classList.add('active');\r\n    if (viewId === 'view-time') { steps[0].classList.add('active'); steps[1].classList.add('active'); }\r\n    if (viewId === 'view-details') { steps[0].classList.add('active'); steps[1].classList.add('active'); steps[2].classList.add('active'); }\r\n    if (viewId === 'view-confirm') steps.forEach(s =\u003e s.classList.add('active'));\r\n  }\r\n\r\n  document.querySelectorAll('[data-back]').forEach(btn =\u003e {\r\n    btn.addEventListener('click', (e) =\u003e navigateTo(e.target.dataset.back));\r\n  });\r\n\r\n  const btnStart = document.getElementById('btnStart');\r\n  if (btnStart) btnStart.addEventListener('click', () =\u003e { generateDates(); navigateTo('view-date'); });\r\n\r\n  const sidebar = document.getElementById('sidebar');\r\n  const sidebarOverlay = document.getElementById('sidebarOverlay');\r\n  \r\n  const openSidebarBtn = document.getElementById('openSidebar');\r\n  if (openSidebarBtn) openSidebarBtn.addEventListener('click', () =\u003e {\r\n    if (sidebar) sidebar.classList.add('active');\r\n    if (sidebarOverlay) sidebarOverlay.classList.add('active');\r\n  });\r\n  \r\n  const closeSidebarBtn = document.getElementById('closeSidebar');\r\n  if (closeSidebarBtn) closeSidebarBtn.addEventListener('click', closeAppSidebar);\r\n  if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeAppSidebar);\r\n\r\n  document.querySelectorAll('.nav-item[data-view], .desktop-nav a[data-view]').forEach(link =\u003e {\r\n    link.addEventListener('click', (e) =\u003e {\r\n      e.preventDefault();\r\n      closeAppSidebar();\r\n      const targetView = e.currentTarget.getAttribute('data-view');\r\n      if (targetView === 'view-date') generateDates();\r\n      navigateTo(targetView);\r\n    });\r\n  });\r\n\r\n  function scrollToHomeSection(sectionId, navLinkId) {\r\n    navigateTo('view-home');\r\n    setTopNavActive(navLinkId);\r\n    setTimeout(() =\u003e {\r\n      const section = document.getElementById(sectionId);\r\n      if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });\r\n    }, 100);\r\n  }\r\n\r\n  const setupScrollBtn = (btnId, sectionId, topNavId) =\u003e {\r\n    const btn = document.getElementById(btnId);\r\n    const topNav = document.getElementById(topNavId);\r\n    if (btn) btn.addEventListener('click', (e) =\u003e { e.preventDefault(); scrollToHomeSection(sectionId, topNavId); closeAppSidebar(); });\r\n    if (topNav) topNav.addEventListener('click', (e) =\u003e { e.preventDefault(); scrollToHomeSection(sectionId, topNavId); });\r\n  }\r\n\r\n  setupScrollBtn('navGalleryBtn', 'gallerySection', 'topNavGallery');\r\n  setupScrollBtn('navLocationBtn', 'locationSection', 'topNavLocation');\r\n  setupScrollBtn('navRulesBtn', 'rulesSection', 'topNavRules');\r\n\r\n function generateDates() {\r\n    // 1. Re-link the container so JS knows where to build the matrix grid\r\n    const dateContainer = document.getElementById('dateTimeline');\r\n    if (!dateContainer) return;\r\n    \r\n    dateContainer.innerHTML = '';\r\n    const today = new Date(window.Kickoff.today() + \"T12:00:00\");\r\n    \r\n    for (let i = 0; i \u003c 14; i++) {\r\n      const d = new Date(today);\r\n      d.setDate(today.getDate() + i);\r\n      \r\n      const node = document.createElement('button');\r\n      node.type = 'button';\r\n      node.setAttribute('aria-label', d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }));\r\n      node.className = `date-node ${i === 0 ? 'active' : ''}`;\r\n      \r\n      const dayName = i === 0 ? 'TODAY' : d.toLocaleDateString('en-US', { weekday: 'short' });\r\n      const monthName = d.toLocaleDateString('en-US', { month: 'short' });\r\n      \r\n      node.innerHTML = `\u003cspan class=\"date-day\"\u003e${dayName}\u003c/span\u003e\u003cspan class=\"date-num\"\u003e${d.getDate()}\u003c/span\u003e`;\r\n      \r\n      if (i === 0 \u0026\u0026 document.getElementById('monthWatermark')) {\r\n        document.getElementById('monthWatermark').textContent = monthName.toUpperCase();\r\n      }\r\n\r\n      node.addEventListener('click', () =\u003e {\r\n        document.querySelectorAll('.date-node').forEach(n =\u003e n.classList.remove('active'));\r\n        node.classList.add('active');\r\n        state.date = d;\r\n        \r\n        const fullDateStr = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).toUpperCase();\r\n        const contextDateEl = document.getElementById('contextDate');\r\n        if (contextDateEl) contextDateEl.textContent = fullDateStr;\r\n        \r\n        setTimeout(() =\u003e { generateTimes(); navigateTo('view-time'); }, 200);\r\n      });\r\n      \r\n      dateContainer.appendChild(node);\r\n    }\r\n  }\r\n  async function generateTimes() {\r\n    const container = document.getElementById('timeTimeline');\r\n    if (!container) return;\r\n    container.innerHTML = '\u003cdiv style=\"color:var(--text-dim); padding:20px 0;\"\u003eLoading pitch availability...\u003c/div\u003e';\r\n    if (!state.date) return;\r\n\r\n    const year = state.date.getFullYear();\r\n    const month = String(state.date.getMonth() + 1).padStart(2, '0');\r\n    const day = String(state.date.getDate()).padStart(2, '0');\r\n    const dateStr = `${year}-${month}-${day}`;\r\n    \r\n    try {\r\n      const response = await window.Kickoff.fetch(`/api/availability?date=${dateStr}`);\r\n      const data = await response.json();\r\n\r\n      if (!response.ok || !data.schedule) {\r\n        container.innerHTML = `\u003cdiv style=\"color:var(--text-dim); padding:20px 0;\"\u003e${escapeHTML(data.error || 'Could not load schedule.')}\u003c/div\u003e`;\r\n        return;\r\n      }\r\n\r\n      container.innerHTML = '';\r\n      data.schedule.forEach(slot =\u003e {\r\n        const node = document.createElement('button');\r\n        node.type = 'button'; node.disabled = !slot.available;\r\n        node.className = `time-node ${slot.available ? 'available' : 'booked'}`;\r\n        \r\n        const statusText = !slot.available ? 'BOOKED' : (slot.isPopular ? '🔥 FAST FILLING' : 'AVAILABLE');\r\n\r\n        node.innerHTML = `\u003cspan class=\"time-val\"\u003e${escapeHTML(slot.time)}\u003c/span\u003e\u003cspan class=\"time-status\"\u003e${statusText}\u003c/span\u003e`;\r\n\r\n        if (slot.available) {\r\n          node.addEventListener('click', () =\u003e {\r\n            document.querySelectorAll('.time-node').forEach(n =\u003e n.classList.remove('selected'));\r\n            node.classList.add('selected');\r\n            \r\n            state.time = slot.time;\r\n            const fullDateStr = state.date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).toUpperCase();\r\n            const contextSessionEl = document.getElementById('contextSession');\r\n            if (contextSessionEl) contextSessionEl.textContent = `${fullDateStr} — ${state.time}`;\r\n            \r\n            setTimeout(() =\u003e navigateTo('view-details'), 250);\r\n          });\r\n        }\r\n        container.appendChild(node);\r\n      });\r\n    } catch (err) {\r\n      container.innerHTML = '\u003cdiv style=\"color:var(--text-dim); padding:20px 0;\"\u003eError querying pitch availability. Check server logs.\u003c/div\u003e';\r\n    }\r\n  }\r\n\r\n  const bookingForm = document.getElementById('bookingForm');\r\n  const confirmModal = document.getElementById('confirmModal');\r\n  const btnCancelConfirm = document.getElementById('btnCancelConfirm');\r\n  const btnProceedConfirm = document.getElementById('btnProceedConfirm');\r\n  const btnHome = document.getElementById('btnHome');\r\n\r\n  if (btnHome) btnHome.addEventListener('click', () =\u003e { if (bookingForm) bookingForm.reset(); navigateTo('view-home'); });\r\n\r\n  if (bookingForm) {\r\n    bookingForm.onsubmit = (e) =\u003e {\r\n      e.preventDefault();\r\n      if (!state.date || !state.time) return alert(\"Please select a valid date and time.\");\r\n      const inputName = document.getElementById('playerName').value.trim();\r\n      const inputPhone = document.getElementById('playerPhone').value.trim();\r\n      if (!inputName || !inputPhone) return alert(\"Please complete all required fields.\");\r\n\r\n      state.playerName = inputName;\r\n      state.playerPhone = inputPhone;\r\n      if (confirmModal) confirmModal.classList.add('active');\r\n    };\r\n  }\r\n\r\n  if (btnCancelConfirm) btnCancelConfirm.addEventListener('click', () =\u003e confirmModal.classList.remove('active'));\r\n\r\n  if (btnProceedConfirm) {\r\n    btnProceedConfirm.addEventListener('click', async () =\u003e {\r\n      if (btnProceedConfirm.disabled) return;\r\n      btnProceedConfirm.disabled = true;\r\n      btnProceedConfirm.textContent = \"PROCESSING...\";\r\n\r\n      const year = state.date.getFullYear();\r\n      const month = String(state.date.getMonth() + 1).padStart(2, '0');\r\n      const day = String(state.date.getDate()).padStart(2, '0');\r\n      const dateStr = `${year}-${month}-${day}`;\r\n\r\n      try {\r\n        const res = await window.Kickoff.fetch('/api/reservations', {\r\n          method: 'POST',\r\n          headers: { 'Content-Type': 'application/json' },\r\n          body: JSON.stringify({\r\n            name: state.playerName,\r\n            phone: state.playerPhone,\r\n            date: dateStr,\r\n            time: state.time\r\n          })\r\n        });\r\n\r\n        const result = await res.json();\r\n\r\n        if (!res.ok) {\r\n          btnProceedConfirm.disabled = false; btnProceedConfirm.textContent = \"Understand \u0026 Book\";\r\n          confirmModal.classList.remove('active');\r\n          alert(result.error || \"Could not reserve pitch.\");\r\n          return;\r\n        }\r\n\r\n        state.reservationId = result.reservation.id;\r\n        const bookingSession = await window.Kickoff.bootstrap();\r\n        const configuredNumber = bookingSession.settings?.businessWhatsApp;\r\n        state.businessWhatsApp = /^[0-9]{8,15}$/.test(configuredNumber || '') ? configuredNumber : BUSINESS_WHATSAPP;\r\n\r\n        document.getElementById('ticketId').textContent = state.reservationId;\r\n        document.getElementById('resDate').textContent = state.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toUpperCase();\r\n        document.getElementById('resTime').textContent = state.time;\r\n        document.getElementById('resName').textContent = state.playerName.toUpperCase();\r\n\r\n        const ticketUrl = new URL(result.ticket.url, window.location.origin).href;\r\n        const qrImageElement = document.querySelector('.qr-img');\r\n        if (qrImageElement) {\r\n          qrImageElement.src = result.ticket.qrUrl;\r\n          qrImageElement.style.cursor = 'pointer';\r\n          qrImageElement.onclick = () =\u003e window.open(ticketUrl, '_blank', 'noopener,noreferrer');\r\n        }\r\n\r\n        btnProceedConfirm.disabled = false; \r\n        btnProceedConfirm.textContent = \"Understand \u0026 Book\";\r\n        confirmModal.classList.remove('active');\r\n        navigateTo('view-confirm');\r\n        \r\n        setTimeout(openWhatsApp, 300); \r\n\r\n      } catch (err) {\r\n        btnProceedConfirm.disabled = false; btnProceedConfirm.textContent = \"Understand \u0026 Book\";\r\n        confirmModal.classList.remove('active');\r\n        alert(err.message || \"Network error. Please try again.\");\r\n      }\r\n    });\r\n  }\r\n\r\n  function openWhatsApp() {\r\n    if (!state.date || !state.time || !state.reservationId) return;\r\n    const formattedDate = state.date.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });\r\n    const message = `⚽ PITCH BOOKING REQUEST\\n\\nHi! I just booked a slot on the website and want to confirm my pending reservation.\\n\\n👤 Name: ${state.playerName}\\n📱 Phone: ${state.playerPhone}\\n📅 Date: ${formattedDate}\\n⏰ Time: ${state.time}\\n🎟️ Ticket ID: ${state.reservationId}\\n\\nPlease let me know when this is locked in!`;\r\n    const encoded = encodeURIComponent(message);\r\n    window.location.href = `https://wa.me/${state.businessWhatsApp || BUSINESS_WHATSAPP}?text=${encoded}`;\r\n  }\r\n\r\n  document.querySelectorAll('[data-digits-only]').forEach(input =\u003e {\r\n    input.addEventListener('input', () =\u003e { input.value = input.value.replace(/[^0-9]/g, ''); });\r\n  });\r\n  document.querySelectorAll('[data-hover-accent]').forEach(link =\u003e {\r\n    link.addEventListener('mouseover', () =\u003e { link.style.color = 'var(--accent)'; });\r\n    link.addEventListener('mouseout', () =\u003e { link.style.color = 'var(--text-dim)'; });\r\n  });\r\n\r\n  const canvas = document.getElementById('ambientCanvas');\r\n  if (canvas) {\r\n    const ctx = canvas.getContext('2d');\r\n    let width, height, particles = [];\r\n\r\n    function initCanvas() {\r\n      width = canvas.width = window.innerWidth;\r\n      height = canvas.height = window.innerHeight;\r\n      particles = [];\r\n      for (let i = 0; i \u003c 40; i++) {\r\n        particles.push({ x: Math.random() * width, y: Math.random() * height, r: Math.random() * 1.5 + 0.5, dx: (Math.random() - 0.5) * 0.2, dy: (Math.random() - 0.5) * 0.2, baseAlpha: Math.random() * 0.5 + 0.1 });\r\n      }\r\n    }\r\n\r\n    function animateCanvas() {\r\n      ctx.clearRect(0, 0, width, height);\r\n      particles.forEach(p =\u003e {\r\n        p.x += p.dx; p.y += p.dy;\r\n        if (p.x \u003c 0 || p.x \u003e width) p.dx *= -1;\r\n        if (p.y \u003c 0 || p.y \u003e height) p.dy *= -1;\r\n        ctx.beginPath();\r\n        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);\r\n        ctx.fillStyle = `rgba(0, 255, 102, ${p.baseAlpha})`;\r\n        ctx.fill();\r\n      });\r\n      requestAnimationFrame(animateCanvas);\r\n    }\r\n\r\n    window.addEventListener('resize', initCanvas);\r\n    initCanvas();\r\n    animateCanvas();\r\n  }\r\n\r\n  const scrollObserver = new IntersectionObserver((entries, observer) =\u003e {\r\n    entries.forEach(entry =\u003e {\r\n      if (entry.isIntersecting) {\r\n        entry.target.classList.add('visible');\r\n        observer.unobserve(entry.target); \r\n      }\r\n    });\r\n  }, { root: null, rootMargin: '0px', threshold: 0.15 });\r\n\r\n  document.querySelectorAll('.reveal-3d').forEach(el =\u003e scrollObserver.observe(el));\r\n});\r\n"}, {"path": "client/public/index.html", "code": "\u003c!DOCTYPE html\u003e\r\n\u003chtml lang=\"en\" data-theme=\"dark\"\u003e\r\n\u003chead\u003e\r\n  \u003cmeta charset=\"UTF-8\"\u003e\r\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content\"\u003e\r\n  \u003ctitle\u003eKickoff | Immersive Pitch Booking\u003c/title\u003e\r\n  \u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700\u0026family=Rajdhani:wght@500;600;700;800\u0026family=Space+Mono:wght@700\u0026display=swap\" rel=\"stylesheet\"\u003e\r\n  \u003clink rel=\"stylesheet\" href=\"styles.css?v=2.3.0\"\u003e\r\n  \u003clink rel=\"stylesheet\" href=\"/mobile.css?v=2.3.0\"\u003e\r\n\u003c/head\u003e\r\n\u003cbody class=\"public-page\"\u003e\r\n\r\n  \u003c!-- Ambient Canvas Background --\u003e\r\n  \u003ccanvas id=\"ambientCanvas\"\u003e\u003c/canvas\u003e\r\n\r\n  \u003c!-- Sidebar Overlay \u0026 Navigation --\u003e\r\n  \u003cdiv class=\"sidebar-overlay\" id=\"sidebarOverlay\" aria-hidden=\"true\"\u003e\u003c/div\u003e\r\n  \u003cnav class=\"sidebar\" id=\"sidebar\" aria-label=\"Main navigation\" aria-hidden=\"true\"\u003e\r\n    \u003cdiv class=\"sidebar-header\"\u003e\r\n      \u003cspan class=\"logo-text\"\u003eKICKOFF\u003c/span\u003e\r\n \"#\" data-view=\"view-home\" id=\"topNavHome\" class=\"active\"\u003eHome\u003c/a\u003e\r\n      \u003ca href=\"#\" id=\"topNavRules\"\u003eGuide\u003c/a\u003e\r\n      \u003ca href=\"#\" id=\"topNavGallery\"\u003eGallery\u003c/a\u003e\r\n      \u003ca href=\"#\" id=\"topNavLocation\"\u003eLocation\u003c/a\u003e\r\n      \u003ca href=\"#\" data-view=\"view-date\" id=\"topNavBook\"\u003eBook Pitch\u003c/a\u003e\r\n    \u003c/nav\u003e\r\n\r\n    \u003cdiv class=\"topbar-actions\"\u003e\r\n      \u003cbutton class=\"btn-text header-auth\" id=\"desktopProfileLink\" style=\"display: none; color: var(--accent); font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; margin-right: 16px;\"\u003eMy account\u003c/button\u003e\r\n      \u003cbutton class=\"btn-text header-auth\" id=\"desktopLoginLink\" style=\"font-weight: 700; margin-right: 16px;\"\u003eSign in\u003c/button\u003e\r\n      \u003cdiv class=\"live-status\"\u003e\r\n        \u003cdiv class=\"pulse-dot\"\u003e\u003c/div\u003e\r\n        \u003cspan\u003ePitch Live\u003c/span\u003e\r\n      \u003c/div\u003e\r\n    \u003c/div\u003e\r\n  \u003c/header\u003e\r\n\r\n  \u003c!-- Booking Progress Indicator --\u003e\r\n  \u003cdiv class=\"progress-container\" id=\"progressContainer\"\u003e\r\n    \u003cdiv class=\"step active\" data-step=\"1\"\u003e01 DATE\u003c/div\u003e\r\n    \u003cdiv class=\"step\" data-step=\"2\"\u003e02 KICKOFF\u003c/div\u003e\r\n    \u003cdiv class=\"step\" data-step=\"3\"\u003e03 DETAILS\u003c/div\u003e\r\n    \u003cdiv class=\"step\" data-step=\"4\"\u003e04 CONFIRM\u003c/div\u003e\r\n  \u003c/div\u003e\r\n\r\n  \u003c!-- Main Viewport --\u003e\r\n  \u003cmain id=\"mainContent\" class=\"app-viewport\" style=\"perspective: 1200px;\"\u003e\r\n    \r\n    \u003c!-- VIEW 0: UNIVERSAL ENTRY GATE --\u003e\r\n    \u003csection class=\"view active\" id=\"view-entry\"\u003e\r\n      \u003cdiv class=\"entry-shell\"\u003e\r\n        \u003cdiv class=\"public-auth-card\" aria-labelledby=\"welc amily: var(--font-display); font-size: 1rem !important; font-weight: 700; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.desktop-nav a { padding-inline: 12px; }\n.sidebar { width: min(340px, calc(100% - 24px)); height: 100dvh; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); visibility: hidden; transition: left .4s cubic-bezier(.16, 1, .3, 1), visibility 0s .4s; }\n.sidebar.active { visibility: visible; transition-delay: 0s, 0s; }\n.sidebar-links { gap: 8px; overflow-y: auto; overscroll-behavior: contain; }\n.sidebar-links .nav-item { display: flex; align-items: center; min-height: 48px; font-size: 1.45rem; padding-block: 6px; min-width: 0; overflow-wrap: anywhere; }\n.sidebar-header { margin-bottom: 20px; }\n.progress-container { padding-inline: 16px; gap: 10px; background: linear-gradient(var(--bg-color), rgba(5, 7, 8, .95)); }\n.step { font-size: .8rem; white-space: nowrap; padding-block: 4px 10px; }\n.entry-shell { display: grid; place-items: center; min-height: min(650px, calc(100svh - 160px)); padding-block: 16px; }\n.public-auth-card { max-width: 440px; padding: 36px 32px; }\n.auth-title { font: 700 1.85rem var(--font-display); margin-top: 16px; letter-spacing: .2px; }\n.auth-intro { color: #a0ada5; font-size: .95rem; line-height: 1.6; margin: 10px 0 26px; }\n.auth-actions { display: flex; flex-direction: column; gap: 12px; }\n.auth-btn { min-height: 56px; font-size: 1.05rem; letter-spacing: .5px; padding: 14px 16px; text-transform: none; }\n.auth-btn svg { flex-shrink: 0; }\n.auth-hint, .staff-entry p, .staff-login-help { color: #a0ada5; font-size: .82rem; line-height: 1.5; }\n.auth-hint { margin-top: 14px; }\n.staff-entry { border-top: 1px solid var(--surface-border); margin-top: 26px; padding-top: 18px; }\n.staff-entry-link { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: var(--accent); font-size: .95rem; text-decoration: none; font-weight: 600; } -bottom)); }\n.footer-links a { display: inline-flex; align-items: center; min-height: 44px; }\n\n/* Staff sign-in retains the original neon button and animated border. */\n.admin-page { --surface: var(--bg-surface); --surface-border: rgba(255, 255, 255, .1); --text-dim: var(--text-muted); --accent-dim: var(--accent-glow); }\n.auth-body { height: auto; min-height: 100svh; padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); display: flex; flex-direction: column; align-items: stretch; gap: 20px; }\n.auth-body \u003e .site-back { align-self: flex-start; }\n.staff-login { position: relative; top: auto; left: auto; transform: none; width: 100%; margin: auto; max-width: 430px; padding: 36px; }\n.staff-login h2 { font-size: 1.8rem; letter-spacing: 2px !important; margin-bottom: 0; }\n.staff-login .auth-intro { text-align: center; margin-bottom: 28px; }\n.staff-login .user-box { margin-bottom: 24px; }\n.staff-login .user-box label { position: static; display: block; padding: 0; margin-bottom: 8px; font-size: .9rem; color: var(--text-muted); }\n.staff-login .user-box input { display: block; font-size: 16px; line-height: 1.5; min-height: 48px; border-bottom-color: var(--text-muted); margin: 0; padding: 12px 0; border-radius: 0; }\n.staff-login #password { padding-right: 68px; }\n.password-toggle { position: absolute; right: 0; bottom: 2px; min-width: 60px; min-height: 44px; padding: 8px; border: 0; border-radius: 6px; background: transparent; color: var(--accent); font: 600 .85rem var(--font-body); cursor: pointer; }\n.neon-submit { min-height: 52px; letter-spacing: 2px; }\n.neon-submit b { font: inherit; }\n.staff-login-help { text-align: center; margin: 24px 0 10px; }\n.customer-login-link { display: flex; align-items: center; justify-content: center; min-height: 44px; color: var(--accent); text-align: center; font-size: .9rem; text-decoration: none; line-height: 1.5;  var(--font-display); font-weight: 700; font-size: 1rem; color: var(--accent); letter-spacing: 1px; }\r\n\r\n.location-grid { display: grid; grid-template-columns: 1fr; gap: 24px; }\r\n.interactive-map { height: 320px; border-radius: 16px; position: relative; overflow: hidden; border: 1px solid var(--surface-border); }\r\n.map-iframe { width: 100%; height: 100%; border: none; filter: invert(100%) hue-rotate(180deg) brightness(85%) contrast(110%); }\r\n.location-details-card { background: var(--surface); border: 1px solid var(--surface-border); padding: 32px; border-radius: 16px; display: flex; flex-direction: column; justify-content: center; }\r\n.location-details-card h4 { font-family: var(--font-display); font-size: 1.8rem; margin-bottom: 8px; }\r\n.location-details-card p { color: var(--text-dim); margin-bottom: 24px; }\r\n.detail-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--surface-border); font-size: 0.95rem; }\r\n.detail-row span { color: var(--text-dim); }\r\n\r\n.rules-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }\r\n.rule-card { background: var(--surface); border: 1px solid var(--surface-border); padding: 24px; border-radius: 12px; position: relative; }\r\n.rule-num { font-family: var(--font-mono); font-size: 0.85rem; color: var(--accent); font-weight: 700; display: block; margin-bottom: 12px; }\r\n.rule-card h4 { font-family: var(--font-display); font-size: 1.3rem; margin-bottom: 8px; letter-spacing: 1px; }\r\n.rule-card p { color: var(--text-dim); font-size: 0.9rem; line-height: 1.5; }\r\n\r\n.timeline-container { \r\n  display: grid; \r\n  grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); \r\n  gap: 16px; \r\n  padding: 20px 0; \r\n  position: relative; \r\n  z-index: 2; \r\n}\r\n.timeline-container:active { cursor: grabbing; } \r\n.timeline-container::-webkit-scrollbar { display: none; }\r\n.date-node { \r\n  display: flex; \r\n  flex-direction: column; \r\n  align-items: center; \r\n  justify-content: center; \r\n  background: var(--surface); \r\n  border: 1px solid var(--surface-border); \r\n  border-radius: 12px; \r\n  padding: 16px 8px; \r\n  cursor: pointer; \r\n  transition: var(--transition-smooth); \r\n}\r\n.date-node:hover { \r\n  border-color: rgba(0, 255, 102, 0.5); \r\n  transform: translateY(-2px); \r\n}\r\n.date-node.active { \r\n  background: var(--accent); \r\n  color: #000; \r\n  border-color: var(--accent); \r\n  transform: translateY(-4px); \r\n  box-shadow: 0 10px 20px var(--accent-dim); \r\n}\r\n\r\n.date-day { \r\n  font-family: var(--font-mono); \r\n  font-size: 0.75rem; \r\n  letter-spacing: 1px; \r\n  text-transform: uppercase; \r\n  margin-bottom: 4px; \r\n  color: var(--text-dim);\r\n}\r\n.date-node.active .date-day { color: rgba(0, 0, 0, 0.7); }\r\n\r\n.date-num { \r\n  font-family: var(--font-display); \r\n  font-size: 3rem; \r\n  font-weight: 700; \r\n  line-height: 1; \r\n}\r\n\r\n.background-watermark { \r\n  position: absolute; top: 30%; left: -5%; \r\n  font-family: var(--font-display); font-size: 18rem; font-weight: 800; \r\n  color: rgba(255, 255, 255, 0.05); z-index: 0; pointer-events: none; white-space: nowrap; \r\n}\r\n\r\n.time-list { display: flex; flex-direction: column; gap: 16px; margin-top: 32px; }\r\n.time-node { display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.3s; padding: 16px; border: 1px solid var(--surface-border); border-radius: 8px; background: var(--surface); }\r\n.time-val { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }\r\n.time-status { font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; color: var(--accent); }\r\n.time-node:hover:not(.booked) { border-color: var(--accent); transform: translateX(6px); }\r\n.time-node.booked { cursor: not-allowed; opacity: 0.3; }\r\n.time-node.booked .time-status { color: var(--text-dim); }\r\n\r\n.minimal
