xes\",\n  \"main\": \"server.js\",\n  \"scripts\": {\n    \"start\": \"node server.js\",\n    \"dev\": \"node --watch server.js\",\n    \"db:migrate\": \"node scripts/migrate.js\",\n    \"db:check\": \"node scripts/check-data.js\",\n    \"test\": \"node --test --test-concurrency=1 test/*.test.js\",\n    \"vendor:sync\": \"node scripts/vendor.js\",\n    \"postinstall\": \"node scripts/vendor.js\",\n    \"preview\": \"node server.js --preview\",\n    \"audit:prod\": \"npm audit --omit=dev\"\n  },\n  \"keywords\": [],\n  \"type\": \"commonjs\",\n  \"engines\": {\n    \"node\": \"\u003e=22 \u003c25\"\n  },\n  \"dependencies\": {\n    \"connect-pg-simple\": \"^10.0.0\",\n    \"dotenv\": \"^18.0.8\",\n    \"express\": \"^5.3.0\",\n    \"express-session\": \"^1.19.0\",\n    \"express-rate-limit\": \"^8.0.0\",\n    \"helmet\": \"^8.3.0\",\n    \"passport\": \"^0.7.0\",\n    \"passport-google-oauth20\": \"^2.0.0\",\n    \"pg\": \"^8.23.1\",\n    \"qrcode\": \"^1.5.4\",\n    \"chart.js\": \"4.6.1\",\n    \"flatpickr\": \"4.6.13\"\n  },\n  \"devDependencies\": {\n    \"@electric-sql/pglite\": \"^0.3.0\",\n    \"jsdom\": \"^26.0.0\"\n  }\n}\n"}, {"path": "server/routes/admin.js", "code": "const express = require('express');\nconst { requireAuth } = require('../middleware/auth');\nconst { createAdminController } = require('../controllers/adminController');\nfunction createAdminRoutes({ db, bookings, tickets, auth, loginLimiter }) {\n  const router = express.Router();\n  const c = createAdminController(db, bookings, tickets);\n  router.get('/check-session', auth.checkSession);\n  router.post('/login', loginLimiter, auth.login);\n  router.post('/logout', auth.logout);\n  router.use(requireAuth);\n  router.get('/dashboard-stats', c.getDashboardStats);\n  router.get('/reservations', c.getReservations);\n  router.post('/reservations', c.createManualReservation);\n  router.delete('/reservations/cancelled', c.clearCancelled);\n  router.patch('/reservations/:id/confirm', c.confirmReservation);\n  router.patch('/reservations/:id/cancel', c.cancelReservation);\n  router.get('/standing-bookings', c.getStandingBookings);\n  router.post('/standing-bookings', c.createStandingBooking);\n  router.put('/standing-bookings/:id', c.updateStandingBooking);\n  router.delete('/standing-bookings/:id', c.deleteStandingBooking);\n  router.get('/analytics', c.getAnalytics);\n  return router;\n}\nmodule.exports = { createAdminRoutes };\n"}, {"path": "server/routes/api.js", "code": "const express = require('express');\nconst QRCode = require('qrcode');\nconst { SLOTS, HttpError, venueNow, dateValue, dayOfWeek, addDays } = require('../lib/booking');\nfunction createApiRoutes({ db, bookings, tickets, config, bookingLimiter }) {\n  const router = express.Router();\n  router.get('/availability', async (req, res) =\u003e {\n    const date = dateValue(req.query.date);\n    const current = venueNow();\n    if ((!req.session?.authenticated \u0026\u0026 date \u003c current.date) || date \u003e addDays(current.date, 365)) throw new HttpError(400, 'Choose a date from today onwards.');\n    const [regular, weekly] = await Promise.all([\n      db.query(\"SELECT time FROM reservations WHERE date = $1 AND status = 'CONFIRMED'\", [date]),\n      db.query('SELECT time FROM standing_bookings WHERE day_of_week = $1', [dayOfWeek(date)])\n    ]);\n    const occupied = new Set([...regular.rows, ...weekly.rows].map(row =\u003e row.time));\n    res.json({ date, timeZone: 'Asia/Beirut', schedule: SLOTS.map(slot =\u003e {\n      const passed = date \u003c current.date || (date === current.date \u0026\u0026 slot.start \u003c= current.time);\n      return { time: slot.label, start: slot.start, end: slot.end, available: !occupied.has(slot.label) \u0026\u0026 !passed,\n        reason: passed ? 'PASSED' : occupied.has(slot.label) ? 'BOOKED' : null,\n        isPopular: ['19:30', '21:00'].includes(slot.start) };\n    }) });\n  });\n  router.post('/reservations', bookingLimiter, async (req, res) =\u003e {\n    const reservation = await bookings.create(req.body, { userId: req.isAuthenticated?.() ? req.user.id : null });\n    res.status(201).json({ reservation, ticket: { url: tickets.url(reservation.id), qrUrl: tickets.qrUrl(reservation.id) },\n      message: 'Your request is pending. The slot is reserved only after staff confirms it.' });\n  });\n  async function readTicket(value) {\n    const id = tickets.verify(value);\n    const result = await db.query('SELECT id, name, date::text, time, status, starts_at, ends_at FROM reservations WHERE id = $1', [id]);\n    if (!result.rows.length) throw new HttpError(404, 'This match pass is no longer available.');\n    return { ...result.rows[0], venue: 'Kickoff Choueifat · Pitch 1', timeZone: 'Asia/Beirut' };\n  }\n  router.get('/tickets/:token/qr.svg', async (req, res) =\u003e {\n    const reservation = await readTicket(req.params.token);\n    const svg = await QRCode.toString(`${config.origin}${tickets.url(reservation.id)}`, { type: 'svg', margin: 2, width: 180, errorCorrectionLevel: 'M' });\n    res.type('image/svg+xml').send(svg);\n  });\n  router.get('/tickets/:token', async (req, res) =\u003e res.json({ reservation: await readTicket(req.params.token) }));\n  return router;\n}\nmodule.exports = { createApiRoutes };\n"}, {"path": "server/routes/auth.js", "code": "const express = require('express');\nconst { requireUser } = require('../middleware/auth');\nconst { ALL_SLOTS, text, phoneValue } = require('../lib/booking');\nfunction publicUser(user) { return { id: user.id, name: user.name, email: user.email, phone: user.phone || '' }; }\nfunction createAuthRoutes({ db, passport, tickets, logout }) {\n  const router = express.Router();\n  router.get('/google', passport.authenticate('google', { scope: ['profile', 'email'] }));\n  router.get('/google/callback', passport.authenticate('google', { failureRedirect: '/?error=login_failed' }), (_req, res) =\u003e res.redirect('/'));\n  router.get('/me', (req, res) =\u003e res.json(req.isAuthenticated?.() ? { loggedIn: true, user: publicUser(req.user) } : { loggedIn: false }));\n  router.post('/logout', logout);\n  router.put('/me', requireUser, async (req, res) =\u003e {\n    const name = text(req.body?.name, 'Name', 120);\n    const phone = phoneValue(req.body?.phone, false);\n    const updated = await db.query('UPDATE users SET name = $1, phone = $2 WHERE id = $3 RETURNING id, name, email, phone', [name, phone, req.user.id]);\n    res.json({ success: true, user: publicUser(updated.rows[0]) });\n  });\n  router.get('/my-reservations', requireUser, async (req, res) =\u003e {\n    // Phone numbers are contact details, never proof of booking ownership.\n    const result = await db.query(`SELECT id, name, date::text, time, status FROM reservations\n      WHERE user_id = $1 ORDER BY date DESC, array_position($2::text[], time)`, [req.user.id, ALL_SLOTS]);\n    res.json({ success: true, reservations: result.rows.map(row =\u003e ({ ...row, ticketUrl: tickets.url(row.id) })) });\n  });\n  return router;\n}\nmodule.exports = { createAuthRoutes, publicUser };\n"}, {"path": "server/scripts/check-data.js", "code": "const { ALL_SLOTS, venueNow } = require('../lib/booking');\nasync function checkData(db) {\n  const issues = [];\n  const tables = await db.query(\"SELECT to_regclass('public.reservations') AS reservations, to_regclass('public.standing_bookings') AS standing\");\n  if (tables.rows[0].reservations) {\n    const duplicates = await db.query(\"SELECT date::text, time, array_agg(id) AS ids FROM reservations WHERE status = 'CONFIRMED' GROUP BY date, time HAVING COUNT(*) \u003e 1\");\n    for (const row of duplicates.rows) issues.push({ issue: 'Multiple confirmed reservations share a slot', ...row });\n    const invalid = await db.query(\"SELECT id, date::text, time, status FROM reservations WHERE status IS NULL OR status NOT IN ('PENDING', 'CONFIRMED', 'CANCELLED') OR (status \u003c\u003e 'CANCELLED' AND NOT (time = ANY($1::text[])))\", [ALL_SLOTS]);\n    for (const row of invalid.rows) issues.push({ issue: 'Invalid active booking slot or status', ...row });\n  }\n  if (tables.rows[0].standing) {\n    const weekly = await db.query('SELECT day_of_week, time, array_agg(id) AS ids FROM standing_bookings GROUP BY day_of_week, time HAVING COUNT(*) \u003e 1');\n    for (const row of weekly.rows) issues.push({ issue: 'Duplicate weekly booking', ...row });\n    const invalid = await db.query('SELECT id, day_of_week, time FROM standing_bookings WHERE day_of_week NOT BETWEEN 0 AND 6 OR NOT (time = ANY($1::text[]))', [ALL_SLOTS]);\n    for (const row of invalid.rows) issues.push({ issue: 'Invalid weekly day or slot', ...row });\n  }\n  if (tables.rows[0].reservations \u0026\u0026 tables.rows[0].standing) {\n    const overlap = await db.query(`SELECT r.id, r.date::text, r.time, s.id AS standing_id FROM reservations r JOIN standing_bookings s\n      ON s.day_of_week = EXTRACT(DOW FROM r.date) AND s.time = r.time\n      WHERE r.status = 'CONFIRMED' AND r.date \u003e= $1::date`, [venueNow().date]);\n    for (const row of overlap.rows) issues.push({ issue: 'Confirmed reservation overlaps a recurring slot', ...row });\n  }\n  return issues;\n}\nasync function main() {\n  const { createDatabase } = require('../config/db');\n  const db = createDatabase();\n  try { const issues = await checkData(db); console.log(JSON.stringify({ ready: issues.length === 0, issues }, null, 2)); if (issues.length) process.exitCode = 1; }\n  finally { await db.close(); }\n}\nif (require.main === module) main().catch(error =\u003e { console.error('Database check failed:', error.code || error.message); process.exitCode = 1; });\nmodule.exports = { checkData };\n"}, {"path": "server/scripts/migrate.js", "code": "const fs = require('node:fs');\nconst path = require('node:path');\nconst { checkData } = require('./check-data');\nconst VERSION = '001_security_and_bookings';\nasync function migrate(db) {\n  return db.transaction(async client =\u003e {\n    await client.query('SELECT pg_advisory_xact_lock($1)', [728346201]);\n    await client.query('CREATE TABLE IF NOT EXISTS schema_migrations (version VARCHAR(100) PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP)');\n    const prior = await client.query('SELECT version FROM schema_migrations WHERE version = $1', [VERSION]);\n    if (prior.rows.length) return { applied: false, version: VERSION };\n    const issues = await checkData(client);\n    if (issues.length) {\n      const error = new Error('Existing records need review before migration. Run npm run db:check, resolve the reported conflicts, then run db:migrate again. No records were changed.');\n      error.issues = issues;\n      throw error;\n    }\n    await client.query(fs.readFileSync(path.join(__dirname, '../migrations', `${VERSION}.sql`), 'utf8'));\n    await client.query('INSERT INTO schema_migrations (version) VALUES ($1)', [VERSION]);\n    return { applied: true, version: VERSION };\n  });\n}\nasync function main() {\n  const { createDatabase } = require('../config/db');\n  const db = createDatabase();\n  try { console.log(JSON.stringify(await migrate(db))); }\n  finally { await db.close(); }\n}\nif (require.main === module) main().catch(error =\u003e { console.error('Migration failed:', error.message); if (error.issues) console.error(JSON.stringify(error.issues, null, 2)); process.exitCode = 1; });\nmodule.exports = { migrate, VERSION };\n"}, {"path": "server/scripts/vendor.js", "code": "// Keep browser dependencies local and reproducible from package-lock.json.\nconst fs = require('node:fs');\nconst path = require('node:path');\nconst crypto = require('node:crypto');\nconst root = path.join(__dirname, '..');\nconst target = path.join(root, '../client/public/vendor');\nfs.mkdirSync(target, { recursive: true });\nconst assets = [\n  ['chart.js', 'dist/chart.umd.js', 'chart.umd.js'],\n  ['chart.js', 'LICENSE.md', 'chart.LICENSE.md'],\n  ['flatpickr', 'dist/flatpickr.min.js', 'flatpickr.min.js'],\n  ['flatpickr', 'dist/flatpickr.min.css', 'flatpickr.min.css'],\n  ['flatpickr', 'LICENSE.md', 'flatpickr.LICENSE.md']\n];\nconst manifest = [];\nfor (const [name, source, destination] of assets) {\n  const packageDir = path.join(root, 'node_modules', name);\n  const bytes = fs.readFileSync(path.join(packageDir, source));\n  fs.writeFileSync(path.join(target, destination), bytes);\n  manifest.push({ file: destination, package: name, version: JSON.parse(fs.readFileSync(path.join(packageDir, 'package.json'), 'utf8')).version,\n    sha256: crypto.createHash('sha256').update(bytes).digest('hex') });\n}\nfs.writeFileSync(path.join(target, 'manifest.json'), JSON.stringify(manifest, null, 2) + '\\n');\nconsole.log('Local browser assets synchronized from locked dependencies.');\n"}, {"path": "server/server.js", "code": "// Visual preview stays separate from the production application and its credentials.\nfunction createPreviewApp() {\n  const express = require('express');\n  const path = require('node:path');\n  const { SLOTS, venueNow, addDays } = require('./lib/booking');\n  const app = express();\n  app.disable('x-powered-by');\n  app.use((req, res, next) =\u003e { res.set('Cache-Control', 'no-store'); next(); });\n  app.get('/api/session', (req, res) =\u003e res.json({\n    preview: true, user: null, csrfToken: 'local-visual-preview',\n    settings: { bookingDays: 14, businessWhatsApp: '9613696325' }\n  }));\n  app.get('/api/auth/me', (req, res) =\u003e res.json({ loggedIn: false, preview: true }));\n  app.get('/api/availability', (req, res) =\u003e res.json({\n    preview: true, date: req.query.date || venueNow().date, timeZone: 'Asia/Beirut',\n    schedule: SLOTS.map(slot =\u003e ({ time: slot.label, start: slot.start, end: slot.end,\n      available: true, reason: null, isPopular: ['19:30', '21:00'].includes(slot.start) }))\n  }));\n  app.get('/api/admin/check-session', (req, res) =\u003e res.json({ authenticated: true, user: 'LOCAL PREVIEW', preview: true }));\n  app.get('/api/admin/dashboard-stats', (req, res) =\u003e res.json({ todayMatches: 0, pending: 0, upcoming: 0, cancelled: 0 }));\n  app.get('/api/admin/reservations', (req, res) =\u003e res.json({ reservations: [], pagination: {\n    page: 1, pageSize: 50, total: 0, totalPages: 1, hasNext: false, hasPrevious: false\n  } }));\n  app.get('/api/admin/standing-bookings', (req, res) =\u003e res.json({ standingBookings: [] }));\n  app.get('/api/admin/analytics', (req, res) =\u003e {\n    const today = venueNow().date;\n    res.json({ analytics: [], startDate: addDays(today, -29), endDate: today });\n  });\n  app.use('/api', (req, res) =\u003e res.status(503).json({\n    error: 'Visual preview only. Booking, sign-in, and changes are disabled.'\n  }));\n  app.use(express.static(path.join(__dirname, '../client/public')));\n  return app;\n}\nasync function start() {\n  if (process.argv.includes('--preview')) {\n    if (process.env.NODE_ENV === 'production') throw new Error('Visual preview is unavailable in production.');\n    const port = Number(process.env.PORT || 3000);\n    if (!Number.isInteger(port) || port \u003c 0 || port \u003e 65535) throw new Error('PORT must be a valid port number.');\n    // Bind to this computer only; preview never mounts production API routes.\n    return createPreviewApp().listen(port, '127.0.0.1', () =\u003e {\n      console.log(`Visual preview: http://localhost:${port}`);\n      console.log('No database or Google credentials needed. Booking and sign-in are disabled.');\n    });\n  }\n  const { loadConfig } = require('./config/env');\n  const { createDatabase } = require('./config/db');\n  const { createApp } = require('./app');\n  const config = loadConfig();\n  const db = createDatabase(config);\n  await db.query('SELECT 1');\n  const migrationTable = await db.query(\"SELECT to_regclass('schema_migrations') AS name\");\n  if (!migrationTable.rows[0].name) throw new Error('Database migration is missing. Run npm run db:check, then npm run db:migrate before starting.');\n  const schema = await db.query(\"SELECT version FROM schema_migrations WHERE version = '001_security_and_bookings'\");\n  if (!schema.rows.length) throw new Error('Run npm run db:migrate before starting this version.');\n  const app = createApp({ config, db });\n  const server = app.listen(config.port, () =\u003e console.log(`Kickoff listening on port ${config.port}`));\n  let shuttingDown = false;\n  async function shutdown() {\n    if (shuttingDown) return;\n    shuttingDown = true;\n    const timeout = setTimeout(() =\u003e process.exit(1), 15000).unref();\n    server.close(async () =\u003e { clearTimeout(timeout); await db.close(); process.exit(0); });\n    server.closeIdleConnections();\n  }\n  process.once('SIGTERM', shutdown);\n  process.once('SIGINT', shutdown);\n}\nif (require.main === module) start().catch(error =\u003e { console.error('Startup failed:', error.code || error.message); process.exit(1); });\nmodule.exports = { start, createPreviewApp };\n"}, {"path": "server/services/bookings.js", "code": "const crypto = require('node:crypto');\nconst { bookingInput, standingInput, dayOfWeek, slotValue, futureSlot, venueNow, HttpError, idValue, numericId } = require('../lib/booking');\nconst CALENDAR_LOCK = 728346201;\nfunction createBookings(db, { now = () =\u003e new Date() } = {}) {\n  async function locked(work) {\n    return db.transaction(async client =\u003e {\n      // Every calendar write takes the same transaction-scoped lock. No session-level locks,\n      // so this also works through Neon's transaction pooler.\n      await client.query('SELECT pg_advisory_xact_lock($1)', [CALENDAR_LOCK]);\n      return work(client);\n    });\n  }\n  async function audit(client, actor, action, id) {\n    await client.query('INSERT INTO audit_log (actor, action, entity_id) VALUES ($1, $2, $3)', [actor, action, String(id)]);\n  }\n  async function assertFree(client, date, time, exclude = '') {\n    const conflicts = await client.query(`SELECT id FROM reservations\n      WHERE date = $1 AND time = $2 AND status = 'CONFIRMED' AND id \u003c\u003e $3 LIMIT 1`, [date, time, exclude]);\n    if (conflicts.rows.length) throw new HttpError(409, 'This slot has already been confirmed for another team. Choose another kickoff time.');\n    const fixed = await client.query('SELECT id FROM standing_bookings WHERE day_of_week = $1 AND time = $2 LIMIT 1', [dayOfWeek(date), time]);\n    if (fixed.rows.length) throw new HttpError(409, 'This kickoff time belongs to a recurring booking.');\n  }\n  async function create(body, { userId = null, staff = null } = {}) {\n    const input = bookingInput(body, { publicBooking: !staff, now: now() });\n    return locked(async client =\u003e {\n      await assertFree(client, input.date, input.time);\n      let id, result;\n      const status = staff ? 'CONFIRMED' : 'PENDING';\n      for (let attempt = 0; attempt \u003c 5; attempt++) {\n        // The original short display reference is not an access credential.\n        // Signed links and account ownership provide authorization.\n        id = `RES-${crypto.randomInt(36 ** 6).toString(36).padStart(6, '0').toUpperCase()}`;\n        result = await client.query(`INSERT INTO reservations\n        (id, name, phone, date, time, end_time, notes, status, user_id, starts_at, ends_at)\n        VALUES ($1, $2, $3, $4::date, $5, $6, $7, $8, $9,\n          (($4::date + $10::time) AT TIME ZONE 'Asia/Beirut'),\n          (($4::date + $11::time) AT TIME ZONE 'Asia/Beirut'))\n        ON CONFLICT (id) DO NOTHING\n        RETURNING id, name, phone, date::text, time, status`,\n      [id, input.name, input.phone, input.date, input.time, input.time.split(' - ')[1], input.notes, status, userId, input.slot.start, input.slot.end]);\n        if (result.rows.length) break;\n      }\n      if (!result.rows.length) throw new HttpError(503, 'Could not create a booking reference. Please try again.');\n      await audit(client, staff ? `staff:${staff}` : (userId ? `user:${userId}` : 'guest'), `booking.${status.toLowerCase()}`, id);\n      return result.rows[0];\n    });\n  }\n  async function confirm(value, staff) {\n    const id = idValue(value);\n    return locked(async client =\u003e {\n      const found = await client.query('SELECT id, name, phone, date::text, time, status, notes, user_id, starts_at, ends_at FROM reservations WHERE id = $1 FOR UPDATE', [id]);\n      const booking = found.rows[0];\n      if (!booking) throw new HttpError(404, 'Reservation not found.');\n      if (booking.status === 'CANCELLED') throw new HttpError(409, 'A cancelled request cannot be confirmed. Create a new booking.');\n      futureSlot(booking.date, slotValue(booking.time), { now: now() });\n      await assertFree(client, booking.date, booking.time, id);\n      await client.query(\"UPDATE reservations SET status = 'CONFIRMED' WHERE id = $1\", [id]);\n      await audit(client, `staff:${staff}`, 'booking.confirmed', id);\n      return { ...booking, status: 'CONFIRMED' };\n    });\n  }\n  async function cancel(value, staff) {\n    const id = idValue(value);\n    return locked(async client =\u003e {\n      const result = await client.query(\"UPDATE reservations SET status = 'CANCELLED' WHERE id = $1 RETURNING id\", [id]);\n      if (!result.rows.length) throw new HttpError(404, 'Reservation not found.');\n      await audit(client, `staff:${staff}`, 'booking.cancelled', id);\n    });\n  }\n  async function standing(body, staff, value = null) {\n    const input = standingInput(body);\n    const id = value === null ? null : numericId(value);\n    return locked(async client =\u003e {\n      if (id !== null) {\n        const result = await client.query('SELECT id FROM standing_bookings WHERE id = $1 FOR UPDATE', [id]);\n        if (!result.rows.length) throw new HttpError(404, 'Recurring booking not found.');\n      }\n      const duplicate = await client.query('SELECT id FROM standing_bookings WHERE day_of_week = $1 AND time = $2 AND ($3::integer IS NULL OR id \u003c\u003e $3) LIMIT 1', [input.day, input.slot.label, id]);\n      if (duplicate.rows.length) throw new HttpError(409, 'This weekly slot is already assigned.');\n      const conflict = await client.query(`SELECT id FROM reservations WHERE status = 'CONFIRMED'\n        AND date \u003e= $1::date AND EXTRACT(DOW FROM date) = $2 AND time = $3 LIMIT 1`, [venueNow(now()).date, input.day, input.slot.label]);\n      if (conflict.rows.length) throw new HttpError(409, 'This recurring slot would overlap an existing confirmed booking. Resolve that booking first.');\n      const result = id === null\n        ? await client.query('INSERT INTO standing_bookings (player_name, phone, day_of_week, time) VALUES ($1, $2, $3, $4) RETURNING id', [input.name, input.phone, input.day, input.slot.label])\n        : await client.query('UPDATE standing_bookings SET player_name = $1, phone = $2, day_of_week = $3, time = $4 WHERE id = $5 RETURNING id', [input.name, input.phone, input.day, input.slot.label, id]);\n      await audit(client, `staff:${staff}`, id === null ? 'standing.created' : 'standing.updated', result.rows[0].id);\n      return result.rows[0];\n    });\n  }\n  async function removeStanding(value, staff) {\n    const id = numericId(value);\n    return locked(async client =\u003e {\n      const result = await client.query('DELETE FROM standing_bookings WHERE id = $1 RETURNING id', [id]);\n      if (!result.rows.length) throw new HttpError(404, 'Recurring booking not found.');\n      await audit(client, `staff:${staff}`, 'standing.deleted', id);\n    });\n  }\n  async function clearCancelled(staff) {\n    return locked(async client =\u003e {\n      const result = await client.query(\"DELETE FROM reservations WHERE status = 'CANCELLED'\");\n      await audit(client, `staff:${staff}`, 'booking.cancelled_history_cleared', result.rowCount || 0);\n      return result.rowCount || 0;\n    });\n  }\n  return { create, confirm, cancel, standing, removeStanding, clearCancelled };\n}\nmodule.exports = { createBookings, CALENDAR_LOCK };\n"}, {"path": "server/test/database-config.test.js", "code": "const { test } = require('node:test');\nconst assert = require('node:assert/strict');\nconst { createDatabase } = require('../config/db');\n\ntest('legacy SSL modes retain full certificate verification without the alias warning', async () =\u003e {\n  for (const mode of ['prefer', 'require', 'verify-ca']) {\n    const db = createDatabase({ production: false, databaseUrl: `postgres://example.invalid/kickoff?sslmode=${mode}` });\n    try { assert.equal(new URL(db.pool.options.connectionString).searchParams.get('sslmode'), 'verify-full'); }\n    finally { await db.close(); }\n  }\n  for (const production of [false, true]) {\n    const db = createDatabase({ production, databaseUrl: 'postgres://example.invalid/kickoff?sslmode=disable' });\n    try { assert.equal(new URL(db.pool.options.connectionString).searchParams.get('sslmode'), production ? 'verify-full' : 'disable'); }\n    finally { await db.close(); }\n  }\n});\n"}, {"path": "server/test/fixtures/legacy-schema.sql", "code": "CREATE TABLE IF NOT EXISTS reservations (\r\n    id VARCHAR(50) PRIMARY KEY,\r\n    name VARCHAR(255) NOT NULL,\r\n    phone VARCHAR(50) NOT NULL,\r\n    date DATE NOT NULL,\r\n    time VARCHAR(50) NOT NULL,\r\n    end_time VARCHAR(50) NOT NULL,\r\n    notes TEXT,\r\n    status VARCHAR(50) DEFAULT 'CONFIRMED',\r\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\r\n);\r\n\r\nCREATE TABLE IF NOT EXISTS standing_bookings (\r\n    id SERIAL PRIMARY KEY,\r\n    player_name VARCHAR(255) NOT NULL,\r\n    phone VARCHAR(50),\r\n    day_of_week INTEGER NOT NULL, -- 0 (Sun) to 6 (Sat)\r\n    time VARCHAR(50) NOT NULL,\r\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\r\n);\r\n\r\nCREATE TABLE IF NOT EXISTS users (\r\n    id SERIAL PRIMARY KEY,\r\n    google_id VARCHAR(255) UNIQUE NOT NULL,\r\n    email VARCHAR(255) UNIQUE NOT NULL,\r\n    name VARCHAR(255) NOT    async query(sql, values = []) {\n      let result;\n      if (!values.length \u0026\u0026 sql.includes(';')) { const results = await client.exec(sql); result = results.at(-1) || { rows: [] }; }\n      else result = await client.query(sql, values);\n      return { ...result, rowCount: result.affectedRows ?? result.rows?.length ?? 0 };\n    }\n  });\n  return { ...wrap(native), transaction: work =\u003e native.transaction(client =\u003e work(wrap(client))), close: () =\u003e native.close() };\n}\nlet native, db, server, origin, store, services, app;\nfunction client(cookie = '') {\n  let csrf;\n  return {\n    get cookie() { return cookie; },\n    async request(url, options = {}) {\n      const headers = { ...(cookie ? { Cookie: cookie } : {}), ...(csrf \u0026\u0026 options.csrf !== false ? { 'X-CSRF-Token': csrf } : {}), ...(options.body ? { 'Content-Type': 'application/json' } : {}), ...options.headers };\n      const response = await fetch(origin + url, { method: options.method || 'GET', redirect: 'manual', headers, ...(options.body ? { body: JSON.stringify(options.body) } : {}) });\n      const set = response.headers.get('set-cookie'); if (set) cookie = set.split(';')[0];\n      const contentType = response.headers.get('content-type') || '';\n      const body = contentType.includes('application/json') ? await response.json() : await response.text();\n      if (body.csrfToken) csrf = body.csrfToken;\n      return { status: response.status, body, headers: response.headers };\n    },\n    async bootstrap() { return this.request('/api/session'); }\n  };\n}\nconst date = () =\u003e addDays(venueNow().date, 2);\nconst booking = (extra = {}) =\u003e ({ name: 'Test Player', phone: '03 696 325', date: date(), time: SLOTS[2].label, ...extra });\nasync function staff() { const value = client(); await value.bootstrap(); const response = await value.request('/api/admin/login', { method: 'POST', body: { username: config.adminUser, password: config.adminPass } }); assert.equal(response.status, 200); return value; }\nasync function customer(id) {\n  const sid = `test-customer-${id}`;\n  await new Promise((resolve, reject) =\u003e store.set(sid, { cookie: { maxAge: 86400000, expires: new Date(Date.now() + 86400000), httpOnly: true, path: '/', sameSite: 'lax' }, passport: { user: id } }, error =\u003e error ? reject(error) : resolve()));\n  const value = client(`kickoff.sid=${encodeURIComponent(`s:${signature.sign(sid, config.sessionSecret)}`)}`); await value.bootstrap(); return value;\n}\nbefore(async () =\u003e {\n  native = new PGlite(); db = adapt(native); await migrate(db); store = new session.MemoryStore();\n  services = createBookings(db);\n  app = createApp({ config, db, sessionStore: store });\n  server = app.listen(0, '127.0.0.1'); await new Promise(resolve =\u003e server.once('listening', resolve)); origin = `http://127.0.0.1:${server.address().port}`;\n});\nafter(async () =\u003e { if (server) { server.closeAllConnections(); await new Promise(resolve =\u003e server.close(resolve)); } if (db) await db.close(); });\nbeforeEach(async () =\u003e { app.locals.rateLimiters.apiLimiter.resetKey('127.0.0.1'); app.locals.rateLimiters.loginLimiter.resetKey('127.0.0.1'); app.locals.rateLimiters.bookingLimiter.resetKey('127.0.0.1'); await db.query('TRUNCATE reservations, standing_bookings, users, audit_log RESTART IDENTITY CASCADE'); await new Promise(resolve =\u003e store.clear(resolve)); });\n\ntest('configuration fails closed when credentials are absent or short', () =\u003e {\n  assert.throws(() =\u003e loadConfig({}), /Missing required/);\n  assert.throws(() =\u003e loadConfig({ DATABASE_URL: 'postgres://localhost/test', SESSION_SECRET: 'short', ADMIN_USER: 'x', ADMIN_PASS: 'long-enough-password', GOOGLE_CLIENT_ID: 'x', GOOGLE_CLIENT_SECRET: 'x', GOOGLE_CALLBACK_URL: 'http://localhost/callback' }), /32/);\n});\ntest('sessions, strict CSP, cache rules and JSON API 404s', async () =\u003e {\n  const guest = client(), init = await guest.b l(second.id, 'RES-000002');\n  await assert.rejects(services.create(booking({ name: 'Exhausted retries' })), error =\u003e error.status === 503);\n  const saved = await db.query('SELECT id, name FROM reservations ORDER BY id');\n  assert.deepEqual(saved.rows, [{ id: first.id, name: 'First Team' }, { id: second.id, name: 'Second Team' }]);\n  assert.equal((await db.query('SELECT COUNT(*)::int AS count FROM audit_log')).rows[0].count, 2);\n});\ntest('recurring slots block public and manual reservations; duplicate/edit/delete checks work', async () =\u003e {\n  const admin = await staff(), payload = { playerName: 'Weekly Team', phone: '03696325', dayOfWeek: dayOfWeek(date()), time: SLOTS[1].label };\n  const weekly = await admin.request('/api/admin/standing-bookings', { method: 'POST', body: payload }); assert.equal(weekly.status, 201);\n  assert.equal((await admin.request('/api/admin/standing-bookings', { method: 'POST', body: payload })).status, 409);\n  assert.equal((await admin.request(`/api/admin/standing-bookings/${weekly.body.id}`, { method: 'PUT', body: { ...payload, playerName: 'Updated Team' } })).status, 200);\n  const guest = client(); await guest.bootstrap();\n  assert.equal((await guest.request('/api/reservations', { method: 'POST', body: booking({ time: SLOTS[1].label }) })).status, 409);\n  assert.equal((await admin.request('/api/admin/reservations', { method: 'POST', body: booking({ time: SLOTS[1].label }) })).status, 409);\n  assert.equal((await admin.request(`/api/admin/standing-bookings/${weekly.body.id}`, { method: 'DELETE' })).status, 200);\n  assert.equal((await guest.request('/api/reservations', { method: 'POST', body: booking({ time: SLOTS[1].label }) })).status, 201);\n});\ntest('profile phone changes never expose another customer’s reservations or notes', async () =\u003e {\n  const a = (await db.query(\"INSERT INTO users(google_id,email,name,phone) VALUES('a','a@example.invalid','Alice','+9613696325') RETURNING id\")).rows[0].id;\n  const b \n    }\n    assert.equal((await migrate(legacy)).applied, false);\n  } finally { await legacy.close(); }\n});\ntest('migration stops atomically when legacy confirmed bookings conflict', async () =\u003e {\n  const native = new PGlite(), legacy = adapt(native);\n  try {\n    await native.exec(fs.readFileSync(path.join(__dirname, 'fixtures/legacy-schema.sql'), 'utf8'));\n    await legacy.query(\"INSERT INTO reservations(id,name,phone,date,time,end_time,status) VALUES('one','One','03696325',$1,$2,'7:30 PM','CONFIRMED'),('two','Two','03696325',$1,$2,'7:30 PM','CONFIRMED')\", [date(), SLOTS[2].label]);\n    await assert.rejects(migrate(legacy), /Existing records need review/);\n    assert.equal((await legacy.query('SELECT COUNT(*)::int AS count FROM reservations')).rows[0].count, 2);\n    assert.equal((await legacy.query(\"SELECT to_regclass('schema_migrations') AS migration\")).rows[0].migration, null);\n  } finally { await legacy.close(); }\n});\n\ntest('PostgreSQL sessions survive a session-store instance change', async () =\u003e {\n  const PgStore = require('connect-pg-simple')(session);\n  const first = new PgStore({ pool: db, tableName: 'session', createTableIfMissing: false, pruneSessionInterval: false });\n  const value = { cookie: { expires: new Date(Date.now() + 3600000), maxAge: 3600000 }, marker: 'persisted-in-postgres' };\n  await new Promise((resolve, reject) =\u003e first.set('persistent-session-test', value, error =\u003e error ? reject(error) : resolve()));\n  await first.close();\n  const second = new PgStore({ pool: db, tableName: 'session', createTableIfMissing: false, pruneSessionInterval: false });\n  try { const loaded = await new Promise((resolve, reject) =\u003e second.get('persistent-session-test', (error, data) =\u003e error ? reject(error) : resolve(data))); assert.equal(loaded.marker, value.marker); }\n  finally { await new Promise(resolve =\u003e second.destroy('persistent-session-test', resolve)); await second.close(); }\n});\ntest('calen it db.transaction(async client =\u003e {\n      await client.query('SET LOCAL ROLE kickoff_app');\n      const user = await client.query(\"INSERT INTO users(google_id,email,name) VALUES('runtime-role','runtime@example.invalid','Player') RETURNING id\");\n      assert(user.rows[0].id);\n      await client.query(\"INSERT INTO reservations(id,name,phone,date,time,end_time,status) VALUES('role-booking','Player','+9613696325',$1,$2,'7:30 PM','PENDING')\", [date(), SLOTS[2].label]);\n      await client.query(\"INSERT INTO audit_log(actor,action,entity_id) VALUES('staff:test','test','role-booking')\");\n      await client.query('SELECT version FROM schema_migrations');\n    });\n    for (const sql of ['DELETE FROM audit_log', 'ALTER TABLE reservations ADD COLUMN forbidden TEXT']) {\n      await assert.rejects(db.transaction(async client =\u003e { await client.query('SET LOCAL ROLE kickoff_app'); await client.query(sql); }), error =\u003e error.code === '42501');\n    }\n  } finally { await db.query('DROP OWNED BY kickoff_app'); await db.query('DROP ROLE kickoff_app'); }\n});\n"}, {"path": "server/test/ui.test.js", "code": "const {test}=require('node:test');\nconst assert=require('node:assert/strict');\nconst fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');\nconst {JSDOM,VirtualConsole}=require('jsdom');\nconst root=path.join(__dirname,'../../client/public');\nconst read=file=\u003efs.readFileSync(path.join(root,file),'utf8');\nconst sha=value=\u003ecrypto.createHash('sha256').update(value).digest('hex');\nconst contract=JSON.parse(fs.readFileSync(path.join(__dirname,'fixtures/original-design-contract.json'),'utf8'));\ntest('responsive pages retain original controls, public/admin CSS and ticket CSS',()=\u003e{\n for(const [file,hash] of Object.entries(contract.css))assert.equal(sha(fs.readFileSync(path.join(root,file))),hash,file);\n for(const file of Object.keys(contract.templates)){\n  const dom=new JSDOM(read(file)),doc=dom.window.document;\ inearGradient:()=\u003e({addColorStop(){}})}:null;};\n // Original public particles require a canvas; remove only that canvas in the test fixture.\n w.document.getElementById('ambientCanvas')?.remove();\n w.Chart=class{constructor(context,config){w.chartConfig=config;}destroy(){}};\n w.flatpickr=(selector,options)=\u003e{(w.pickers||=[]).push({selector,options});};\n w.fetch=async(url,options={})=\u003e{\n  calls.push({url:String(url),options});const result=await handler(String(url),options);\n  const response={ok:(result.status||200)\u003c400,status:result.status||200,json:async()=\u003eresult.body??result};response.clone=()=\u003e({...response});return response;\n };\n await new Promise(resolve=\u003ew.document.readyState==='loading'?w.document.addEventListener('DOMContentLoaded',resolve,{once:true}):resolve());\n for(const script of scripts)w.eval(read(script));w.document.dispatchEvent(new w.Event('DOMContentLoaded'));\n return{dom,w,doc:w.document,errors,calls,alerts,close:()=\u003ew.close()};\n}\nasync function until(check){for(let i=0;i\u003c200;i++){if(check())return;await new Promise(resolve=\u003esetTimeout(resolve,5));}throw new Error('DOM state did not settle');}\nconst session={csrfToken:'test-csrf',user:null,settings:{bookingDays:14,businessWhatsApp:'9613696325'}};\ntest('staff sign-in supports password visibility, blocks duplicate submits and recovers after network errors',async()=\u003e{\n let rejectLogin;\n const f=await fixture('admin/index.html',['shared.js','admin/login.js','ui.js'],url=\u003e{\n  if(url==='/api/session')return session;\n  if(url==='/api/admin/login')return new Promise((resolve,reject)=\u003e{rejectLogin=reject;});\n  throw new Error(url);\n });\n try{\n  const password=f.doc.getElementById('password'),toggle=f.doc.getElementById('togglePassword');\n  password.value='example-password';f.doc.getElementById('username').value='staff';\n  toggle.click();assert.equal(password.type,'text');assert.equal(toggle.getAttribute('aria-pressed'),'true');\n  toggle.click();assert.equal(password.type,'password');\n  const form=f.doc.getElementById('loginForm'),button=f.doc.getElementById('loginBtn');\n  form.dispatchEvent(new f.w.Event('submit',{bubbles:true,cancelable:true}));\n  form.dispatchEvent(new f.w.Event('submit',{bubbles:true,cancelable:true}));\n  await until(()=\u003erejectLogin);\n  assert.equal(f.calls.filter(c=\u003ec.url==='/api/admin/login').length,1);\n  assert.equal(button.disabled,true);assert.equal(button.getAttribute('aria-busy'),'true');\n  rejectLogin(new Error('Connection failed. Please try again.'));\n  await until(()=\u003e!button.disabled);\n  assert.equal(f.doc.getElementById('loginButtonLabel').textContent,'Sign in');\n  assert.equal(f.doc.getElementById('loginError').textContent,'Connection failed. Please try again.');\n  assert.equal(f.doc.activeElement.id,'loginError');assert.equal(password.value,'example-password');\n  assert.deepEqual(f.errors,[]);\n }finally{f.close();}\n});\ntest('customer login errors keep guest access available and preview explains disabled Google sign-in',async()=\u003e{\n const f=await fixture('index.html',['shared.js','app.js','ui.js'],url=\u003eurl==='/api/auth/me'?{loggedIn:false,preview:true}:session,'?error=login_failed');\n try{\n  await until(()=\u003ef.doc.getElementById('btnGoogleLogin').dataset.preview==='true');\n  assert.equal(f.doc.getElementById('authError').hidden,false);\n  assert(f.doc.getElementById('authError').textContent.includes('Try again or continue as a guest'));\n  assert(f.doc.getElementById('guestHint').textContent.includes('Local preview'));\n  assert.equal(f.doc.getElementById('btnGuestLogin').disabled,false);\n  f.doc.getElementById('btnGuestLogin').click();assert(f.doc.getElementById('view-home').classList.contains('active'));\n  assert.deepEqual(f.errors,[]);\n }finally{f.close();}\n});\ntest('original customer match cards escape untrusted fields and use signed pass URLs',async()=\u003e{\n const f=await fixture('index ue}));\n  assert(f.doc.getElementById('confirmModal').classList.contains('active'));\n  f.doc.getElementById('btnProceedConfirm').click();f.doc.getElementById('btnProceedConfirm').click();\n  await until(()=\u003ef.doc.getElementById('view-confirm').classList.contains('active'));\n  const submits=f.calls.filter(c=\u003ec.url==='/api/reservations');assert.equal(submits.length,1);assert.equal(submits[0].options.headers['X-CSRF-Token'],'test-csrf');\n  assert.equal(f.doc.querySelector('.qr-img').getAttribute('src'),'/api/tickets/signed-test/qr.svg');\n  assert.deepEqual(f.errors,[]);\n }finally{f.close();}\n});\ntest('original staff table and chart render safely; rejected approvals retain the original modal',async()=\u003e{\n const f=await fixture('admin/dashboard.html',['shared.js','admin/admin.js'],(url,options)=\u003e{\n  if(url==='/api/session')return session;\n  if(url==='/api/admin/check-session')return{authenticated:true,user:'staff'};\n  if(url.startsWith('/api/availability'))return{schedule:slots};\n  if(url.startsWith('/api/admin/reservations?')){\n   const secondPage=new URL(url,'http://kickoff.test').searchParams.get('page')==='2';\n   return{reservations:[secondPage?{...booking,id:'RES-SECOND',name:'Second Team',time:slots[3].time}:booking],pagination:{hasNext:!secondPage}};\n  }\n  if(url==='/api/admin/dashboard-stats')return{todayMatches:1,pending:1,upcoming:1,cancelled:0};\n  if(url==='/api/admin/analytics')return{analytics:[]};\n  if(url==='/api/admin/standing-bookings')return{standingBookings:[{id:1,playerName:'Weekly',phone:'03696325',dayOfWeek:1,time:slots[1].time}]};\n  if(url.endsWith('/confirm'))return{status:409,body:{error:'Slot already confirmed.'}};\n  throw new Error(url);\n });\n try{\n  await until(()=\u003ef.w.chartConfig);assert.equal(f.w.chartConfig.type,'line');assert.equal(f.w.pickers.length,2);\n  f.doc.querySelector('[data-view=\"list\"]').click();await until(()=\u003ef.doc.querySelectorAll('#reservationsTableBody tr').length===2);\n  assert.equal(f.doc.querySelector('#reservationsTableBody img'),null);\n  await f.w.openDetailsModal(booking.id);assert(f.doc.getElementById('detailsModal').classList.contains('active'));\n  f.doc.querySelector('#detailsActions [data-action=\"confirmReservation\"]').click();await until(()=\u003ef.alerts.includes('Slot already confirmed.'));\n  assert(f.doc.getElementById('detailsModal').classList.contains('active'));\n  f.doc.querySelector('[data-view=\"fixed\"]').click();await until(()=\u003ef.doc.querySelector('#fixedBookingsTableBody [data-action=\"openEditFixedModal\"]'));\n  f.doc.querySelector('#fixedBookingsTableBody [data-action=\"openEditFixedModal\"]').click();await until(()=\u003ef.doc.getElementById('editFixedModal').classList.contains('active'));\n  assert.equal(f.doc.getElementById('editFId').value,'1');assert.deepEqual(f.errors,[]);\n }finally{f.close();}\n});\ntest('original pass verifies server data without blocking motion initialization and follows cancellation status',async()=\u003e{\n let status='PENDING';\n const f=await fixture('ticket.html',['shared.js','ticket.js'],()=\u003e({reservation:{...booking,status,ends_at:'2099-01-02T00:00:00Z'}}),'?token=signed\u0026name=FORGED');\n try{\n  await until(()=\u003ef.doc.getElementById('p-name').textContent===malicious);\n  assert.equal(f.doc.querySelector('#p-name img'),null);assert(f.doc.querySelector('.verified-status').textContent.includes('PENDING APPROVAL'));\n  status='CANCELLED';f.doc.dispatchEvent(new f.w.Event('visibilitychange'));await until(()=\u003ef.doc.querySelector('.verified-status').textContent.includes('CANCELLED'));\n  assert.equal(f.doc.getElementById('saveTicketBtn').disabled,false);assert.deepEqual(f.errors,[]);\n }finally{f.close();}\n});\ntest('unsigned pass stays unverified with exports disabled while original display code initializes',async()=\u003e{\n const f=await fixture('ticket.html',['shared.js','ticket.js'],()=\u003e{throw new Error('Unsigned pass must not call ticket API');},'?id=FORGED\u0026name=Fake');\n try{\n  assert(f.doc.querySelector('.verified-status').textContent.includes('UNVERIFIED PASS'));\n  assert.equal(f.doc.getElementById('saveTicketBtn').disabled,true);assert.equal(f.calls.length,0);assert.deepEqual(f.errors,[]);\n }finally{f.close();}\n});\n"}];const list=document.getElementById('files'),source=document.getElementById('source'),name=document.getElementById('filename'),status=document.getElementById('copystatus');
