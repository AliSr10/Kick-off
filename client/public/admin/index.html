<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Kickoff | Staff Authentication</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css?v=2.3.0">
  <link rel="stylesheet" href="/mobile.css?v=2.3.0">
</head>
<body class="admin-page auth-body">

  <a href="/" class="site-back">← Back to booking</a>

  <!-- Glowing Admin Login Box -->
  <div class="login-box staff-login" id="loginBox">
    <h2 style="font-family: var(--font-display); letter-spacing: 4px;" id="staffLoginTitle">STAFF SIGN IN</h2>
    <p class="auth-intro">Manage the pitch, bookings and weekly teams.</p>
    <form id="loginForm" aria-labelledby="staffLoginTitle">
      <div class="user-box">
        <label for="username">Staff username</label>
        <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Your staff username" required>
      </div>
      <div class="user-box">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>
        <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password" aria-controls="password" aria-pressed="false">Show</button>
      </div>
      
      <button type="submit" class="neon-submit" id="loginBtn">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <b id="loginButtonLabel">Sign in</b>
      </button>

      <div id="loginError" role="alert" aria-live="polite" tabindex="-1" style="color: var(--danger); margin-top: 20px; font-size: 0.85rem; text-align: center; font-family: var(--font-mono);"></div>
    </form>
    <p class="staff-login-help">Need staff access? Contact the facility manager.</p>
    <a href="/" class="customer-login-link">Looking to play? Book as a customer →</a>
  </div>

  <script src="/shared.js?v=2.3.0"></script>
  <script src="login.js?v=2.3.0"></script>
  <script src="/ui.js?v=2.3.0"></script>
</body>
</html>
